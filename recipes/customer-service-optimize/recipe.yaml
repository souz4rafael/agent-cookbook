skills:
  - id: routine-demand-pass1-intent-v2
    title: routine-demand-pass1-intent-v2
    description: Identify the underlying request in one case and measure only available operational signals.
    coverage: reference
    instructions: |-
      # Reference only
      First pass of routine-demand analysis. Separate the customer's request from the agent's remedy. Preserve unknown measurements rather than replacing them with zero. Explicit email direction, deduplicated related records and bounded retrieval matter.
      # Not implemented here
      Natural-language intent extraction, signal counting and the native result envelope are not executed by this exercise.
  - id: routine-demand-pass2-cluster-v2
    title: routine-demand-pass2-cluster-v2
    description: Group extracted requests into reusable routines as the second pass of routine-demand analysis.
    coverage: reference
    instructions: |-
      # Reference only
      This pass consumes first-pass results and builds routine groupings under the selected skill contract. It is not a general request to analyse a case.
      # Not implemented here
      Semantic clustering and native multi-pass orchestration are outside this first local exercise.
  - id: routine-demand-pass3-verdict-v2
    title: routine-demand-pass3-verdict-v2
    description: Explain reconciled routine findings without changing supplied counts, assignments or verdicts.
    coverage: reference
    instructions: |-
      # Reference only
      Turn supplied aggregate evidence and reconciled decisions into administrator guidance. Missing measurements stay unmeasured; supplied verdicts and counts are not recalculated by the language model.
      # Not implemented here
      Aggregate processing, ranking and native output contracts are not executed.
  - id: unchecked-outbound-communication-pass1-evaluate-v1
    title: unchecked-outbound-communication-pass1-evaluate-v1
    description: Assess visible content defects in sent outbound communications against configured scenarios.
    coverage: reference
    instructions: |-
      # Reference only
      Inspect rendered content and explicit template metadata, not inferred policy-review history or unsent drafts. Only configured defects supported by visible evidence count.
      # Not implemented here
      Message-language analysis, template inspection and native JSON results are not executed.
  - id: closure-without-confirmation-pass1-evaluate-v1
    title: closure-without-confirmation-pass1-evaluate-v1
    description: Available exercise. Explore one fictional closure scenario with editable evidence and a configurable rapid-closure tier.
    coverage: simulated
    instructions: |-
      # What is preserved
      Assess closed cases only. An active case or empty scenario set is Not Applicable rather than Healthy. Acceptance must be explicit; silence is not consent. Severity comes from configured conditions, not a universal timer.
      # Fictional scenario used here
      Strained means a closed case with no acceptance and a final unanswered human outbound message. Critical adds an enabled rapid-closure tier and a measured interval no greater than the chosen maximum. Other complete closed histories have no match under this narrow scenario.
      # Teaching adaptations
      Inputs are manually supplied observations, not extracted emails. The interval is entered in hours, not calculated from timestamps. Incomplete evidence blocks the exercise instead of producing a native health result. Results are readable explanations, not the original JSON dispatch contract.
      # Boundaries
      No model, Dataverse lookup, arbitrary scenario-text interpretation, multi-scenario rollup or external action. The original managed agent is unchanged.
  - id: stalled-cases-pass1-evaluate-v1
    title: stalled-cases-pass1-evaluate-v1
    description: Assess inactivity on active cases using scenario-specific conditions, not a built-in number of days.
    coverage: reference
    instructions: |-
      # Reference only
      Closed cases are outside this pattern. Use supplied timestamps and the dispatch evaluation time to measure relevant gaps, and apply the configured scenario's threshold.
      # Not implemented here
      Timeline arithmetic and stalled-case scenario evaluation are not executed.
  - id: missing-case-context-pass1-evaluate-v1
    title: missing-case-context-pass1-evaluate-v1
    description: Assess the current case snapshot against configured information-quality scenarios.
    coverage: reference
    instructions: |-
      # Reference only
      Evaluate the declared snapshot and evidence window. A missing current value is not proof that it was missing at intake. Do not invent historical changes, downstream effects or replacement taxonomy values.
      # Not implemented here
      Case-field evaluation, scenario interpretation and native result generation are not executed.
lab:
  title: Did closure really include customer confirmation?
  description: "Local adaptation, not a native JSON endpoint. These fields are manually supplied observations from a fictional case, not extracted messages. The fictional scenario flags a final unanswered human outbound message before closure; its optional Critical tier uses an editable maximum interval. Unknown evidence blocks this exercise. Seven skills are documented, but only this one scenario is executable. Free-text Instructions do not alter the rules."
  fields:
    - id: state
      label: Case state
      type: select
      defaultValue: resolved
      hint: Active cases are outside the closure pattern.
      options: [{ value: active, label: Active }, { value: resolved, label: Resolved }, { value: cancelled, label: Cancelled }, { value: unknown, label: Unknown }]
    - { id: configured, label: Fictional scenario configured, type: boolean, defaultValue: true, hint: "Off represents an empty scenario set, not a healthy case." }
    - { id: complete, label: Relevant evidence complete for this exercise, type: boolean, defaultValue: true, hint: Manually supplied observation; this does not verify retrieval completeness. Turn off to block unsupported conclusions. }
    - id: confirmation
      label: Customer accepted the resolution
      type: select
      defaultValue: absent
      hint: An inbound question is not acceptance. Use Unknown when the evidence does not establish this.
      options: [{ value: accepted, label: Explicit acceptance }, { value: absent, label: No acceptance in the complete evidence }, { value: unknown, label: Unknown }]
    - id: last-human
      label: Last human message before closure
      type: select
      defaultValue: outbound
      hint: Based on explicit direction and chronology; exclude automated notices. A later customer question is inbound but not necessarily acceptance.
      options: [{ value: outbound, label: Outbound - support representative }, { value: inbound, label: Inbound - customer }, { value: none, label: No human messages }, { value: unknown, label: Unknown }]
    - { id: hours, label: Hours from last human outbound message to closure, type: number, defaultValue: 2, min: 0, max: 87600, hint: Manually measured fictional interval. Leave blank when unknown. No timestamps are parsed here. }
    - { id: critical-enabled, label: Enable fictional Critical tier, type: boolean, defaultValue: true, hint: Turning off removes the rapid-closure tier; Strained remains configured. }
    - { id: critical-hours, label: Critical tier maximum interval in hours, type: number, defaultValue: 4, min: 0, max: 87600, hint: "Fictional inclusive threshold, not a value imported from the original environment." }
  checks:
    - { id: configured, label: Scenario configured, field: configured, operator: eq, value: true }
    - { id: active, label: Case is active, field: state, operator: eq, value: active }
    - { id: unknown-state, label: Case state unknown, field: state, operator: eq, value: unknown }
    - { id: complete, label: Required evidence supplied, field: complete, operator: eq, value: true }
    - { id: accepted, label: Explicit customer acceptance, field: confirmation, operator: eq, value: accepted }
    - { id: unknown-confirmation, label: Confirmation unknown, field: confirmation, operator: eq, value: unknown }
    - { id: outbound, label: Final human message outbound, field: last-human, operator: eq, value: outbound }
    - { id: unknown-direction, label: Last human message unknown, field: last-human, operator: eq, value: unknown }
    - { id: no-messages, label: No human messages recorded, field: last-human, operator: eq, value: none }
    - { id: critical-enabled, label: Critical tier configured, field: critical-enabled, operator: eq, value: true }
    - { id: threshold-known, label: Critical threshold supplied, field: critical-hours, operator: present }
    - { id: interval-known, label: Closure interval supplied, field: hours, operator: present }
    - { id: rapid, label: Interval within configured Critical maximum, field: hours, operator: lte, otherField: critical-hours }
  rules:
    - { id: no-scenario, label: No configured scenario means no assessment, all: [{ checkId: configured, equals: false }], outcomeId: not-applicable }
    - { id: active-case, label: Active cases cannot match closure, all: [{ checkId: active, equals: true }], outcomeId: not-applicable }
    - id: missing-evidence
      label: Unknown required evidence blocks the teaching exercise
      all: []
      any: [{ checkId: unknown-state, equals: true }, { checkId: complete, equals: false }, { checkId: unknown-confirmation, equals: true }, { checkId: unknown-direction, equals: true }]
      outcomeId: insufficient-evidence
    - { id: contradictory-evidence, label: Acceptance cannot coexist with no human messages in this fixture, all: [{ checkId: accepted, equals: true }, { checkId: no-messages, equals: true }], outcomeId: insufficient-evidence }
    - { id: confirmed, label: Explicit acceptance passes the scenario, all: [{ checkId: accepted, equals: true }], outcomeId: confirmed }
    - { id: missing-threshold, label: Enabled Critical tier needs its declared threshold, all: [{ checkId: outbound, equals: true }, { checkId: critical-enabled, equals: true }, { checkId: threshold-known, equals: false }], outcomeId: insufficient-evidence }
    - { id: rapid-closure, label: Unanswered closure meets configured Critical tier, all: [{ checkId: outbound, equals: true }, { checkId: critical-enabled, equals: true }, { checkId: rapid, equals: true }], outcomeId: critical }
    - { id: unconfirmed-closure, label: Unanswered closure meets Strained tier, all: [{ checkId: outbound, equals: true }], outcomeId: strained }
    - { id: no-match, label: No unanswered final outbound message under this narrow scenario, all: [], outcomeId: no-match }
  outcomes:
    - id: not-applicable
      title: Not Applicable - no closure assessment
      summary: "Case state: {{state}}. Scenario configured: {{configured}}. An active case or an empty scenario set cannot be assessed by this closure scenario. This is not a Healthy verdict and is not included in a healthy-case count."
      documentIds: []
      skillId: closure-without-confirmation-pass1-evaluate-v1
    - id: insufficient-evidence
      title: Exercise blocked - incomplete or inconsistent evidence
      summary: No native health result is emitted by this teaching guard. Resolve unknown observations, inconsistent acceptance evidence or an absent enabled-tier threshold before claiming a verdict. This is not Healthy and is not a new health state from the original skill.
      documentIds: []
      skillId: closure-without-confirmation-pass1-evaluate-v1
    - id: confirmed
      title: Healthy - explicit confirmation
      summary: The closed case has explicit customer acceptance in the supplied evidence. No unconfirmed-closure scenario matched. The case was assessed, unlike Not Applicable. This finding does not establish unrelated service quality or technical correctness.
      documentIds: []
      skillId: closure-without-confirmation-pass1-evaluate-v1
    - id: critical
      title: Critical - unconfirmed rapid closure
      summary: "The case is {{state}}, no acceptance was observed and the final human message was outbound. Closure followed after {{hours}} hours, within the configured maximum of {{critical-hours}} hours. Both the unconfirmed pattern and its enabled rapid-closure tier are supported. These thresholds are fictional configuration, not defaults of the original agent."
      documentIds: []
      skillId: closure-without-confirmation-pass1-evaluate-v1
      draft:
        title: Reviewable administrator finding
        body: "Finding: unconfirmed rapid closure. Case state: {{state}}. Interval: {{hours}} hours; configured maximum: {{critical-hours}} hours. Review the closure history and decide whether a follow-up is appropriate under approved service policy. This is a draft finding only; no message, case update or follow-up task has been created."
    - id: strained
      title: Strained - unconfirmed closure
      summary: "The final human outbound message was unanswered before closure and no acceptance is recorded. The configured Strained condition matches. The Critical condition is disabled, unmet or unmeasured; an unknown interval is never treated as zero."
      documentIds: []
      skillId: closure-without-confirmation-pass1-evaluate-v1
      recommendations:
        - when: { checkId: interval-known, equals: false }
          title: Interval not measured
          description: The evidence supports unconfirmed closure, but cannot establish the rapid-closure tier.
      draft:
        title: Reviewable administrator finding
        body: "Finding: unconfirmed closure. Case state: {{state}}. Recorded interval: {{hours}} hours. Check the history and appropriate follow-up with the responsible service team. The customer is not assumed to be satisfied. No action has been executed."
    - id: no-match
      title: Healthy - no configured match, not proof of satisfaction
      summary: "The complete supplied history does not end with an unanswered human outbound message. Last human message: {{last-human}}. Explicit acceptance: {{confirmation}}. The narrow fictional scenario does not match; a customer question is not confirmation, and no-message history does not prove a successful resolution."
      documentIds: []
      skillId: closure-without-confirmation-pass1-evaluate-v1
  cases:
    - id: rapid-closure
      title: Unanswered closure after two hours
      inputs: { state: resolved, configured: true, complete: true, confirmation: absent, last-human: outbound, hours: 2, critical-enabled: true, critical-hours: 4 }
      expected: { outcomeId: critical, kind: answer, documentIds: [], contains: [Critical, "2 hours", "4 hours"] }
    - id: confirmed-closure
      title: Customer explicitly accepted the fix
      inputs: { state: resolved, configured: true, complete: true, confirmation: accepted, last-human: inbound, hours: 2, critical-enabled: true, critical-hours: 4 }
      expected: { outcomeId: confirmed, kind: answer, documentIds: [], contains: [Healthy, explicit] }
    - id: active-case
      title: Active case is not a healthy closed case
      inputs: { state: active, configured: true, complete: true, confirmation: absent, last-human: outbound, hours: null, critical-enabled: true, critical-hours: 4 }
      expected: { outcomeId: not-applicable, kind: answer, documentIds: [], contains: [Not Applicable] }
    - id: no-scenarios
      title: Empty scenario set
      inputs: { state: resolved, configured: false, complete: true, confirmation: absent, last-human: outbound, hours: 2, critical-enabled: true, critical-hours: 4 }
      expected: { outcomeId: not-applicable, kind: answer, documentIds: [], contains: [Not Applicable] }
    - id: slower-closure
      title: Unanswered closure outside rapid threshold
      inputs: { state: resolved, configured: true, complete: true, confirmation: absent, last-human: outbound, hours: 8, critical-enabled: true, critical-hours: 4 }
      expected: { outcomeId: strained, kind: answer, documentIds: [], contains: [Strained] }
    - id: threshold-changed
      title: Same two-hour closure with a one-hour threshold
      inputs: { state: resolved, configured: true, complete: true, confirmation: absent, last-human: outbound, hours: 2, critical-enabled: true, critical-hours: 1 }
      expected: { outcomeId: strained, kind: answer, documentIds: [], contains: [Strained] }
    - id: boundary
      title: Exact four-hour boundary is inclusive
      inputs: { state: resolved, configured: true, complete: true, confirmation: absent, last-human: outbound, hours: 4, critical-enabled: true, critical-hours: 4 }
      expected: { outcomeId: critical, kind: answer, documentIds: [], contains: [Critical] }
    - id: unknown-interval
      title: Missing interval cannot prove rapid closure
      inputs: { state: resolved, configured: true, complete: true, confirmation: absent, last-human: outbound, hours: null, critical-enabled: true, critical-hours: 4 }
      expected: { outcomeId: strained, kind: answer, documentIds: [], contains: [Strained, Interval not measured] }
    - id: disabled-tier
      title: Only the Strained tier is configured
      inputs: { state: resolved, configured: true, complete: true, confirmation: absent, last-human: outbound, hours: 2, critical-enabled: false, critical-hours: 4 }
      expected: { outcomeId: strained, kind: answer, documentIds: [], contains: [Strained] }
    - id: incomplete-history
      title: Incomplete history blocks the exercise
      inputs: { state: resolved, configured: true, complete: false, confirmation: absent, last-human: outbound, hours: 2, critical-enabled: true, critical-hours: 4 }
      expected: { outcomeId: insufficient-evidence, kind: answer, documentIds: [], contains: [Exercise blocked] }
    - id: unknown-confirmation
      title: Unknown confirmation is not absent confirmation
      inputs: { state: resolved, configured: true, complete: true, confirmation: unknown, last-human: outbound, hours: 2, critical-enabled: true, critical-hours: 4 }
      expected: { outcomeId: insufficient-evidence, kind: answer, documentIds: [], contains: [Exercise blocked] }
    - id: customer-question
      title: Last reply asks a question rather than accepting
      inputs: { state: resolved, configured: true, complete: true, confirmation: absent, last-human: inbound, hours: 2, critical-enabled: true, critical-hours: 4 }
      expected: { outcomeId: no-match, kind: answer, documentIds: [], contains: [not proof of satisfaction, question is not confirmation] }
    - id: cancelled-case
      title: Cancelled is also a closed state
      inputs: { state: cancelled, configured: true, complete: true, confirmation: absent, last-human: outbound, hours: 2, critical-enabled: true, critical-hours: 4 }
      expected: { outcomeId: critical, kind: answer, documentIds: [], contains: [Critical, cancelled] }
    - id: missing-threshold
      title: Enabled tier without a threshold is incomplete policy
      inputs: { state: resolved, configured: true, complete: true, confirmation: absent, last-human: outbound, hours: 2, critical-enabled: true, critical-hours: null }
      expected: { outcomeId: insufficient-evidence, kind: answer, documentIds: [], contains: [Exercise blocked] }
    - id: contradictory-acceptance
      title: Acceptance with no human messages needs correction
      inputs: { state: resolved, configured: true, complete: true, confirmation: accepted, last-human: none, hours: null, critical-enabled: true, critical-hours: 4 }
      expected: { outcomeId: insufficient-evidence, kind: answer, documentIds: [], contains: [Exercise blocked] }
journey:
  - { id: rapid, title: Inspect an unconfirmed closure, description: "Open the skill reference in Build, then run the two-hour closure example and read its finding.", tab: overview, completeWhen: { type: case-tested, caseId: rapid-closure } }
  - { id: acceptance, title: Distinguish acceptance from silence, description: Run explicit customer acceptance and compare Healthy with the prior Critical finding., tab: overview, completeWhen: { type: case-tested, caseId: confirmed-closure } }
  - { id: applicability, title: Do not count unassessed cases as healthy, description: Run the active-case example and inspect Not Applicable., tab: overview, completeWhen: { type: case-tested, caseId: active-case } }
  - { id: policy, title: Change policy without changing the case, description: Use the one-hour threshold example; the same two-hour closure is now Strained., tab: overview, completeWhen: { type: case-tested, caseId: threshold-changed } }
  - { id: unknown, title: Preserve unknown measurements, description: Run the missing-interval example. It supports Strained but cannot prove rapid closure., tab: overview, completeWhen: { type: case-tested, caseId: unknown-interval } }
  - { id: gaps, title: Avoid false confidence from incomplete history, description: Run incomplete history and inspect the teaching guard rather than accepting a healthy verdict., tab: overview, completeWhen: { type: case-tested, caseId: incomplete-history } }
  - { id: evaluate, title: Compare all expected outcomes, description: Create an evaluation and run every supplied example. Review the boundaries before planning a native implementation., tab: activity, completeWhen: { type: evaluation-passed } }
test:
  suggestedQuestions: [How do I run the closure example?]
  handoffKeywords: []
  unknownAnswer: This local adaptation does not accept natural-language case analysis or native JSON dispatch. Open Review > Try this example to edit fictional evidence and run the closure exercise. Inspect Skills in Build for the seven-skill inventory.
  missingKnowledgeAnswer: This exercise uses declared skill rules and supplied evidence, not connected knowledge.
  handoffBlockedAnswer: No external actions or handoff tools are implemented.
  handoffReadyAnswer: No real follow-up or case update is available.
implementation:
  - title: Source and observed harness
    description: Based on the user-provided Customer Service Optimize Agent YAML and read-only inspection on 17 November 2026. The managed agent displayed seven skills, no connected tools or knowledge, and Teams + Microsoft 365 channels. Nothing was saved, published or executed on the original.
  - title: Model configuration is not execution fidelity
    description: An exported model setting can differ from the model currently available in the product. Confirm the current configuration when implementing a real agent. This exercise calls no model and makes no claim of output equivalence.
  - title: One bounded teaching slice
    description: Only closure-without-confirmation has executable teaching rules. The other six skills are read-only paraphrased references. No original tenant identifiers, source instructions, live records or proprietary package are included in this recipe.
  - title: Adaptations versus native behaviour
    description: The original selects one exact skill via a JSON dispatch envelope and returns JSON. This recipe instead uses manually supplied observations, an entered interval, one fictional configured scenario and explanatory output. It does not interpret emails, calculate timestamps, execute the native contract or aggregate multiple scenarios.
  - title: Reconstruct an authorised native implementation separately
    description: Use the original authorised skill package, exact dispatch fields and result contracts in the correct harness. Provide validated retrieval windows, explicit email directions, ordered deduplicated evidence and configured scenario definitions. Do not import this teaching YAML as a native agent.
  - title: Keep policy and incomplete evidence explicit
    description: The four-hour Critical maximum is invented for the exercise and editable; it is not a threshold discovered in the environment. The incomplete-evidence block is a teaching guard, not a native health label. Evaluate all real scenario definitions independently and roll up only applicable results.
  - title: Simulation scope
    description: This recipe is part of the main Cookbook catalogue. One skill has a bounded teaching exercise; six are reference-only. All examples and thresholds are fictional. Results run in your browser without model calls, customer contact or case updates. Catalogue availability does not change hosting access restrictions.
