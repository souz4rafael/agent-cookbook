knowledge:
  - id: audit-reading-protocol
    title: Audit reading protocol · AR-11
    summary: "AR-11 separates three questions: what was declared, what was posted, and what basis was used. It contains no taxpayer rows."
    connectionId: evidence-library
    resourceId: alderfen-library
    file: documents/audit-reading-protocol.txt
  - id: landing-declaration
    title: Landing declaration · LD-27
    summary: Declaration LD-27 is the declarant’s line for landing case LK-27, season Siltfall 4. Column G is the gross seasonal amount in crowns, not a remittance.
    connectionId: evidence-library
    resourceId: alderfen-library
    file: documents/landing-declaration.txt
  - id: remittance-journal
    title: Remittance journal · RJ-44
    summary: RJ-44 links a remittance row to LK-27. Use its allocation period, not the calendar day on which the row was entered.
    connectionId: evidence-library
    resourceId: alderfen-library
    file: documents/remittance-journal.txt
  - id: units-justification
    title: Signed basis note · JN-18
    summary: "Justification JN-18, LK-27, Siltfall 4: the declaration uses gross seasonal crowns; the declarant claims no carry-forward. This describes the basis; it does not account for every difference or establish liability."
    connectionId: evidence-library
    resourceId: alderfen-library
    file: documents/units-justification.txt
facts:
  - id: pair-periods
    documentId: audit-reading-protocol
    keywords:
      - Which period belongs in a reconciliation
    answer: Use the declaration period and the allocation period on the payment row. Read the period on the justification too; the day money was entered is not enough.
    detail: If the periods differ, request a like-period source rather than offsetting one season against another.
  - id: read-posting
    documentId: audit-reading-protocol
    keywords:
      - How should I treat a pending payment row
    answer: Mark it pending and leave reconciliation open. A pending amount is not a posted amount; a missing row is not a posted zero.
    detail: Look for a confirmed posting tied to the same case and period before comparing it with the declaration.
  - id: neutral-note
    documentId: audit-reading-protocol
    keywords:
      - How do I describe amounts that differ
    answer: State the declared amount, the posted amount and what the justification says about their basis. Ask the auditor to resolve the difference.
    detail: A numerical mismatch alone establishes neither wrongdoing nor an assessed amount.
