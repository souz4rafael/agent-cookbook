lab:
  title: Arrange three records on the audit desk
  description: Set the scope, then read the period and evidence states before reading the amounts. Change one cell or status at a time to see when a comparison is justified.
  fields:
    - id: assignment
      label: Audit assignment
      type: select
      options:
        - value: assigned
          label: Assigned to this exercise
        - value: denied
          label: Access denied
        - value: unknown
          label: Assignment not verified
      defaultValue: unknown
      hint: No case details without an assigned audit view.
    - id: bundle
      label: Case key across sources
      type: select
      options:
        - value: same
          label: Matches assigned case
        - value: other
          label: Different case
        - value: unknown
          label: Key not confirmed
      defaultValue: unknown
      hint: All rows must belong to the same assigned case.
    - id: period
      label: Allocation period compared with declaration and note
      type: select
      options:
        - value: same
          label: Same season
        - value: different
          label: Journal is for the prior season
        - value: unknown
          label: Period label unavailable
      defaultValue: same
      hint: The allocation period is distinct from the posting date.
    - id: posting
      label: Payment evidence
      type: select
      options:
        - value: posted
          label: Posted row
        - value: pending
          label: Pending row
        - value: absent
          label: No row supplied
      defaultValue: posted
      hint: Digits left on screen do not make a pending or absent row posted.
    - id: memo
      label: Justification evidence
      type: select
      options:
        - value: filed
          label: Signed note filed
        - value: expected
          label: Requested, not received
        - value: missing
          label: No note supplied
      defaultValue: filed
      hint: Equal numbers cannot replace the basis note.
    - id: declared
      label: Declared seasonal crowns
      type: number
      defaultValue: 84
      min: 0
      max: 100000
      hint: Read column G; clear it for an unavailable amount.
    - id: paid
      label: Journal amount in crowns
      type: number
      defaultValue: 60
      min: 0
      max: 100000
      hint: Use a posted amount only; enter 0 for an explicit posted zero.
  checks:
    - id: assigned
      label: Current audit assignment
      field: assignment
      operator: eq
      value: assigned
    - id: same-case
      label: Case keys confirmed
      field: bundle
      operator: eq
      value: same
    - id: prior-season
      label: Different allocation period
      field: period
      operator: eq
      value: different
    - id: same-period
      label: Common period verified
      field: period
      operator: eq
      value: same
    - id: pending-row
      label: Journal row unsettled
      field: posting
      operator: eq
      value: pending
    - id: posted-row
      label: Journal row posted
      field: posting
      operator: eq
      value: posted
    - id: requested-note
      label: Justification requested
      field: memo
      operator: eq
      value: expected
    - id: filed-note
      label: Signed justification available
      field: memo
      operator: eq
      value: filed
    - id: declared-cell
      label: Declaration amount supplied
      field: declared
      operator: present
    - id: paid-cell
      label: Journal amount supplied
      field: paid
      operator: present
    - id: agree
      label: Declared and paid amounts equal
      field: declared
      operator: eq
      otherField: paid
    - id: differ
      label: Declared and paid amounts differ
      field: declared
      operator: neq
      otherField: paid
  rules:
    - id: check-assignment
      label: Require audit assignment
      all:
        - checkId: assigned
          equals: false
      outcomeId: no-audit-view
    - id: check-case
      label: Require the assigned case key
      all:
        - checkId: same-case
          equals: false
      outcomeId: no-audit-view
    - id: require-declaration
      label: A blank return amount supplies no comparison
      all:
        - checkId: declared-cell
          equals: false
      outcomeId: missing-declaration
    - id: require-payment-row
      label: Check for a journal row before reading its period
      all:
        - checkId: posted-row
          equals: false
        - checkId: pending-row
          equals: false
      outcomeId: missing-payment
    - id: separate-seasons
      label: Set unlike periods aside
      all:
        - checkId: prior-season
          equals: true
      outcomeId: period-mismatch
    - id: check-period
      label: Require a verified period
      all:
        - checkId: same-period
          equals: false
      outcomeId: unverified-period
    - id: wait-for-posting
      label: Pending payment is not a posted figure
      all:
        - checkId: pending-row
          equals: true
      outcomeId: posting-pending
    - id: require-paid-amount
      label: Do not substitute zero for a blank
      all:
        - checkId: paid-cell
          equals: false
      outcomeId: missing-payment
    - id: wait-for-note
      label: Recognise an outstanding request
      all:
        - checkId: requested-note
          equals: true
      outcomeId: note-pending
    - id: require-note
      label: Require the signed justification
      all:
        - checkId: filed-note
          equals: false
      outcomeId: missing-note
    - id: compare-like-amounts
      label: Record reconciliation on complete evidence
      all:
        - checkId: agree
          equals: true
      outcomeId: reconciled
    - id: report-variance
      label: Record an unexplained numerical difference
      all:
        - checkId: differ
          equals: true
      outcomeId: amounts-differ
    - id: leave-open
      label: "No supported conclusion: leave the comparison open"
      all: []
      outcomeId: review-open
  outcomes:
    - id: amounts-differ
      title: Amounts differ for the same period
      summary: "Declaration LD-27: {{declared}} crowns. Payment RJ-44: {{paid}} crowns posted. Justification JN-18: gross seasonal amount, no carry-forward claimed. Ask the auditor to reconcile the difference. It is not a finding of fraud or an assessment."
      documentIds:
        - landing-declaration
        - remittance-journal
        - units-justification
    - id: reconciled
      title: Amounts reconciled for this period
      summary: "Declaration LD-27: {{declared}} crowns. Payment RJ-44: {{paid}} crowns posted. Justification JN-18: gross seasonal amount, no carry-forward claimed. These amounts reconcile on the filed basis for this period only. This is not a tax assessment."
      documentIds:
        - landing-declaration
        - remittance-journal
        - units-justification
    - id: period-mismatch
      title: "Different periods: do not compare"
      summary: LD-27 is for Siltfall 4; the selected RJ-44 allocation is for Siltfall 3. Obtain a Siltfall 4 allocation before reconciling, even if the numbers look equal.
      documentIds:
        - landing-declaration
        - remittance-journal
    - id: unverified-period
      title: Period not verified
      summary: Obtain the period labels before comparing. A posting date does not establish an allocation period.
      documentIds:
        - audit-reading-protocol
    - id: posting-pending
      title: Payment posting pending
      summary: LD-27 declares {{declared}} crowns. The corresponding RJ-44 row is pending, not posted. Wait for a posted row; neither a shortfall nor reconciliation can yet be established.
      documentIds:
        - landing-declaration
        - remittance-journal
    - id: note-pending
      title: Justification requested
      summary: "Declaration: {{declared}} crowns. Posted payment: {{paid}} crowns. Justification: requested, not received. Leave the comparison open until the auditor has the signed basis note."
      documentIds:
        - landing-declaration
        - remittance-journal
        - audit-reading-protocol
    - id: missing-note
      title: Justification missing
      summary: "Declaration: {{declared}} crowns. Posted payment: {{paid}} crowns. Justification: no note supplied. Ask for the basis note rather than treating the numbers alone as a completed review."
      documentIds:
        - landing-declaration
        - remittance-journal
        - audit-reading-protocol
    - id: missing-declaration
      title: Declaration amount unavailable
      summary: There is no declared amount to compare. Obtain the completed declaration rather than reading a blank as zero.
      documentIds:
        - audit-reading-protocol
    - id: missing-payment
      title: Posted amount unavailable
      summary: No usable posted amount is supplied. Ask for a journal row with a posted figure; do not infer non-payment from missing evidence.
      documentIds:
        - audit-reading-protocol
    - id: no-audit-view
      title: Process guidance only
      summary: No audit details are available in this view. The public protocol explains the reading sequence.
      documentIds:
        - audit-reading-protocol
    - id: review-open
      title: Audit comparison open
      summary: The evidence does not support a reconciliation note. Refer the unresolved sources to the auditor.
      documentIds:
        - audit-reading-protocol
  cases:
    - id: like-period-difference
      title: Describe a difference without assessing it
      inputs:
        assignment: assigned
        bundle: same
        period: same
        posting: posted
        memo: filed
        declared: 84
        paid: 60
      expected:
        outcomeId: amounts-differ
        documentIds:
          - landing-declaration
          - remittance-journal
          - units-justification
        kind: answer
        contains:
          - "LD-27: 84 crowns"
          - "RJ-44: 60 crowns posted"
          - "JN-18: gross seasonal amount"
          - not a finding of fraud or an assessment
    - id: like-period-equal
      title: Reconcile the edited posted amount
      inputs:
        assignment: assigned
        bundle: same
        period: same
        posting: posted
        memo: filed
        declared: 84
        paid: 84
      expected:
        outcomeId: reconciled
        documentIds:
          - landing-declaration
          - remittance-journal
          - units-justification
        kind: answer
        contains:
          - "LD-27: 84 crowns"
          - "RJ-44: 84 crowns posted"
          - for this period only
    - id: prior-season
      title: Equal numbers from different seasons
      inputs:
        assignment: assigned
        bundle: same
        period: different
        posting: posted
        memo: filed
        declared: 84
        paid: 84
      expected:
        outcomeId: period-mismatch
        documentIds:
          - landing-declaration
          - remittance-journal
        kind: answer
        contains:
          - Siltfall 4
          - Siltfall 3
          - do not compare
    - id: unknown-period
      title: No period label
      inputs:
        assignment: assigned
        bundle: same
        period: unknown
        posting: posted
        memo: filed
        declared: 84
        paid: 60
      expected:
        outcomeId: unverified-period
        documentIds:
          - audit-reading-protocol
        kind: answer
        contains:
          - Period not verified
    - id: unsettled-payment
      title: Pending entry carries a number
      inputs:
        assignment: assigned
        bundle: same
        period: same
        posting: pending
        memo: filed
        declared: 84
        paid: 84
      expected:
        outcomeId: posting-pending
        documentIds:
          - landing-declaration
          - remittance-journal
        kind: answer
        contains:
          - pending, not posted
          - neither a shortfall nor reconciliation
    - id: justification-awaited
      title: A requested note has not been received
      inputs:
        assignment: assigned
        bundle: same
        period: same
        posting: posted
        memo: expected
        declared: 84
        paid: 60
      expected:
        outcomeId: note-pending
        documentIds:
          - landing-declaration
          - remittance-journal
          - audit-reading-protocol
        kind: answer
        contains:
          - "Justification: requested, not received"
    - id: justification-missing
      title: Agreement without the basis note is incomplete
      inputs:
        assignment: assigned
        bundle: same
        period: same
        posting: posted
        memo: missing
        declared: 84
        paid: 84
      expected:
        outcomeId: missing-note
        documentIds:
          - landing-declaration
          - remittance-journal
          - audit-reading-protocol
        kind: answer
        contains:
          - "Justification: no note supplied"
    - id: no-return-amount
      title: Declaration amount left blank
      inputs:
        assignment: assigned
        bundle: same
        period: same
        posting: posted
        memo: filed
        declared: null
        paid: 60
      expected:
        outcomeId: missing-declaration
        documentIds:
          - audit-reading-protocol
        kind: answer
        contains:
          - no declared amount to compare
    - id: no-payment-row
      title: No payment source supplied
      inputs:
        assignment: assigned
        bundle: same
        period: same
        posting: absent
        memo: filed
        declared: 84
        paid: 0
      expected:
        outcomeId: missing-payment
        documentIds:
          - audit-reading-protocol
        kind: answer
        contains:
          - do not infer non-payment
    - id: blank-posted-cell
      title: Posted row without an amount
      inputs:
        assignment: assigned
        bundle: same
        period: same
        posting: posted
        memo: filed
        declared: 84
        paid: null
      expected:
        outcomeId: missing-payment
        documentIds:
          - audit-reading-protocol
        kind: answer
        contains:
          - No usable posted amount
    - id: recorded-zero
      title: A posted zero can be compared
      inputs:
        assignment: assigned
        bundle: same
        period: same
        posting: posted
        memo: filed
        declared: 84
        paid: 0
      expected:
        outcomeId: amounts-differ
        documentIds:
          - landing-declaration
          - remittance-journal
          - units-justification
        kind: answer
        contains:
          - "RJ-44: 0 crowns posted"
          - Ask the auditor
    - id: basis-source-off
      title: Require the source for the justification
      inputs:
        assignment: assigned
        bundle: same
        period: same
        posting: posted
        memo: filed
        declared: 84
        paid: 60
