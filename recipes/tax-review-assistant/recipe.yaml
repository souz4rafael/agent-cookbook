    description: A mismatch is a question for the auditor, not evidence of fraud or an assessment. No balance, penalty or tax determination is produced. This local exercise uses fictional evidence; it does not access a live system or make an official determination. The Microsoft Learn reference is about agent authoring, not municipal policy.
