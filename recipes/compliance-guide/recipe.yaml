facts:
  - id: service-clock
    documentId: notice-reading-key
    keywords:
      - Which date starts the response period on a served notice
    answer: Use the service endorsement and the counting instruction on the served copy, then check the result against its printed deadline.
    detail: If the copy is absent, service is disputed or the deadline has passed, ask the Notice Review Officer for a human review. Do not restart the clock.
  - id: proof-format
    documentId: notice-reading-key
    keywords:
      - How can a recipient tell which proof to prepare
    answer: Read the proof list attached to the operative clause. Use a listed format and keep the date and location needed to tie the item to the corrective step.
    detail: A receipt records delivery, not acceptance. Ask a reviewer about an alternative format rather than promising it will be sufficient.
