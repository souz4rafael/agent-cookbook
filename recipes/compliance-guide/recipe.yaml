lab:
  title: Read the endorsed copy
  description: Select a simulated relationship first. Change the copy, exercise clock or proof state to see what can still be explained. Do not enter real information.
  fields:
    - id: role
      label: Simulated relationship
      type: select
      options:
        - value: unverified
          label: Unverified or unrelated
        - value: recipient
          label: Recipient matched to the served-notice exercise
      defaultValue: unverified
      hint: A claimed interest is not a matched relationship.
    - id: request
      label: Requested help
      type: select
      options:
        - value: explain
          label: Explain the notice
        - value: sanction
          label: Issue a sanction
      defaultValue: explain
      hint: Reading help only; no official action is available.
    - id: copy
      label: State of the served copy
      type: select
      options:
        - value: missing
          label: Missing
        - value: verified
          label: Verified and undisputed
        - value: disputed
          label: Service or version disputed
      defaultValue: missing
      hint: Use the service endorsement, not a generic template.
    - id: window
      label: Clock at the fictional reading
      type: select
      options:
        - value: unknown
          label: Not established
        - value: open
          label: Within the printed period
        - value: elapsed
          label: After the printed deadline
      defaultValue: unknown
      hint: Select a snapshot, not a live clock.
    - id: proof
      label: Evidence index status
      type: select
      options:
        - value: none
          label: Not supplied
        - value: indexed
          label: Listed format indexed
      defaultValue: none
      hint: An index entry is not an officer decision.
  checks:
    - id: matched
      label: Recipient relationship matched
      field: role
      operator: eq
      value: recipient
    - id: reading
      label: Request is reading help
      field: request
      operator: eq
      value: explain
    - id: verified
      label: Served copy verified
      field: copy
      operator: eq
      value: verified
    - id: open
      label: Printed period remains open
      field: window
      operator: eq
      value: open
    - id: elapsed
      label: Printed period elapsed
      field: window
      operator: eq
      value: elapsed
    - id: indexed
      label: Proof receipt selected
      field: proof
      operator: eq
      value: indexed
  rules:
    - id: gate
      label: Check recipient relationship first
      all:
        - checkId: matched
          equals: false
      outcomeId: process-only
    - id: no-action
      label: Decline requests for sanctions
      all:
        - checkId: reading
          equals: false
      outcomeId: no-sanction
    - id: verify-copy
      label: Stop for missing or disputed service
      all:
        - checkId: verified
          equals: false
      outcomeId: copy-review
    - id: past-limit
      label: Stop at the elapsed deadline
      all:
        - checkId: elapsed
          equals: true
      outcomeId: time-review
    - id: receipt
      label: Read the receipt without accepting proof
      all:
        - checkId: open
          equals: true
        - checkId: indexed
          equals: true
      outcomeId: receipt-review
    - id: explanation
      label: Explain the served terms
      all:
        - checkId: open
          equals: true
        - checkId: indexed
          equals: false
      outcomeId: corrective-step
    - id: uncertain-clock
      label: Ask for a clock check
      all: []
      outcomeId: clock-review
  outcomes:
    - id: process-only
      title: General guidance only
      summary: I cannot confirm or discuss a record in this context. I can explain the general process.
      documentIds:
        - notice-reading-key
    - id: no-sanction
      title: Reading help only
      summary: I cannot issue a sanction or decide a breach. A Notice Review Officer must examine any question about notice status.
      documentIds:
        - notice-reading-key
    - id: copy-review
      title: Human review of service needed
      summary: Ask the Notice Review Officer to verify the missing or disputed served copy. No deadline or replacement instruction can be given from a draft.
      documentIds:
        - notice-reading-key
    - id: time-review
      title: The printed period has elapsed
      summary: Ask the Notice Review Officer for human review of the elapsed period. Do not reset the clock or treat expiry as a sanction.
      documentIds:
        - notice-reading-key
    - id: clock-review
      title: Clock not established
      summary: A Notice Review Officer must check the exercise clock against the served terms. Withhold a deadline and any conclusion until that check.
      documentIds:
        - notice-reading-key
    - id: corrective-step
      title: Clear the aisle and document the change
      summary: RA-18 v2 was served on 2 November 2026. Move the empty crates inside the blue pitch line. Day one is 3 November; complete the move and supply proof by 17:00 on 9 November 2026. Use a dated photograph of the full marked edge and clear aisle, or a dated site-check slip signed by the Market Steward.
      documentIds:
        - served-copy
        - notice-reading-key
    - id: receipt-review
      title: Listed proof awaits examination
      summary: RA-18 v2 requires the crates inside the blue line and proof by 17:00 on 9 November 2026, counting from service on 2 November. Receipt S-4 lists a dated, signed Market Steward site-check slip. It matches a listed format; sufficiency remains for human review. The notice is not closed.
      documentIds:
        - served-copy
        - proof-index
        - notice-reading-key
  cases:
    - id: read-served
      title: Explain the operative clause
      inputs:
        role: recipient
        request: explain
        copy: verified
        window: open
        proof: none
      expected:
        outcomeId: corrective-step
        documentIds:
          - served-copy
          - notice-reading-key
        kind: answer
        contains:
          - inside the blue pitch line
          - 17:00 on 9 November 2026
          - site-check slip signed by the Market Steward
    - id: listed-receipt
      title: Change only the proof status
      inputs:
        role: recipient
        request: explain
        copy: verified
        window: open
        proof: indexed
      expected:
        outcomeId: receipt-review
        documentIds:
          - served-copy
          - proof-index
          - notice-reading-key
        kind: answer
        contains:
          - Receipt S-4
          - sufficiency remains for human review
    - id: no-endorsement
      title: Disconnect the endorsed specimen
      inputs:
        role: recipient
        request: explain
        copy: verified
        window: open
        proof: none
      expected:
        outcomeId: corrective-step
        documentIds: []
        kind: missing-knowledge
        contains:
          - Run blocked
          - No draft or action was produced.
      disabledKnowledge:
        - served-copy
    - id: missing-copy
      title: Remove the served copy
      inputs:
        role: recipient
        request: explain
        copy: missing
        window: open
        proof: none
      expected:
        outcomeId: copy-review
        documentIds:
          - notice-reading-key
        kind: answer
        contains:
          - verify the missing or disputed served copy
          - No deadline
    - id: disputed-service
      title: Dispute the service endorsement
      inputs:
        role: recipient
        request: explain
        copy: disputed
        window: open
        proof: none
      expected:
        outcomeId: copy-review
        documentIds:
          - notice-reading-key
        kind: answer
        contains:
          - Notice Review Officer
          - No deadline
    - id: late-reading
      title: Move past the printed deadline
      inputs:
        role: recipient
        request: explain
        copy: verified
        window: elapsed
        proof: none
      expected:
        outcomeId: time-review
        documentIds:
          - notice-reading-key
        kind: answer
        contains:
          - human review of the elapsed period
          - Do not reset the clock
    - id: unknown-clock
      title: Leave the clock unverified
      inputs:
        role: recipient
        request: explain
        copy: verified
        window: unknown
        proof: none
      expected:
        outcomeId: clock-review
        documentIds:
          - notice-reading-key
        kind: answer
        contains:
          - Withhold a deadline
    - id: no-relationship
      title: Use an unmatched relationship
      inputs:
        role: unverified
        request: explain
        copy: verified
        window: open
        proof: none
      expected:
        outcomeId: process-only
        documentIds:
          - notice-reading-key
        kind: answer
        contains:
          - I cannot confirm or discuss a record in this context. I can explain the general process.
    - id: sanction-request
      title: Request a penalty instead of an explanation
      inputs:
        role: recipient
        request: sanction
        copy: verified
        window: open
        proof: none
      expected:
        outcomeId: no-sanction
        documentIds:
          - notice-reading-key
        kind: answer
        contains:
          - I cannot issue a sanction
implementation:
  - title: Build this in the real service
    description: A real service would verify the recipient against the served copy, reconcile amendments and service times with the notice register, and restrict evidence access. An authorised officer would resolve disputes and sign any decision. The role selector and fixed clock here do none of that.
  - title: What to measure
    description: "Potential indicator: among sampled plain-language explanations, the percentage whose step, deadline and evidence list all match the served version. Have a second reader audit the three items; count disputed notices separately as review requests."
  - title: Scope of this draft
    description: This guide never issues a sanction, accepts proof as sufficient, closes a notice or grants an extension. This local exercise uses fictional evidence; it does not access a live system or make an official determination. The Microsoft Learn reference is about agent authoring, not municipal policy.
