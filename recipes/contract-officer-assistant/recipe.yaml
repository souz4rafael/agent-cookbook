schemaVersion: 1
revision: 1
id: contract-officer-assistant
status: published
title: Alderfen contract officer assistant
summary: Compare an invoice line with accepted delivery under the matching clause. The result is a quantity finding for an employee, never a payment instruction.
industry: Government and public services
difficulty: intermediate
accentIcon: document
learningGoals:
  - Match the case, supplier, contract line and unit on the invoice and signed acceptance before comparing counts.
  - Explain why a signed zero can be compared, a blank needs a completed entry and an unknown signature needs verification.
  - Cite the invoice row, acceptance entry and contract clause in a finding that states which quantities agree or differ without recommending payment.
sourceUrl: https://learn.microsoft.com/en-us/microsoft-copilot-studio/authoring-instructions
scenario:
  group:
    journey: Procurement and contracts
    perspective: operations
  headline: Ten path markers were billed. How many did the receiving team accept?
  problem: An officer reviewing a delivery invoice finds ten path markers on the bill but eight on the signed acceptance entry. Before asking the supplier to explain, the officer needs to know whether both counts refer to the same contract line and whether the clause calls for units accepted or units dispatched.
  impact: Comparing the wrong line can send a supplier looking for a delivery error that never happened. Treating a blank acceptance cell as zero can turn missing paperwork into a dispute about the entire invoice.
  approach: For an assigned officer and a matched case, supplier, line and unit, the assistant checks the signature and reads the two quantity fields. It cites the invoice row, the acceptance entry and the clause together so the officer can retrace the finding. A missing count calls for a completed record, not an estimate.
  startSmall: Use one invoice row and the signed receipt for line M4. Leave the billed count at ten and change the accepted count, then clear it. Compare what the officer can say about a difference with what they must ask the receiving team to supply.
  potentialValue: An officer could take a specific question back to the supplier or receiving team, with the supporting rows in hand, rather than asking both to recheck the whole delivery.
  measure: Sample quantity findings for all three citations. Count wrong-line comparisons and blanks reported as zero separately from genuine differences between billed and accepted units.
  boundary: The lab compares typed quantities, not scanned documents or prices. The officer decides whether to seek an amended invoice or more acceptance evidence. Even when both counts agree, the result is not authority to pay.
  sourceLabel: "Microsoft Learn: authoring Copilot Studio instructions (not the source of the fictional acceptance clause)"
  home:
    challenge: A contract officer needs to tell the supplier which billed units lack matching acceptance, without mistaking a gap in the paperwork for a short delivery.
    experiment: On the matched, signed line, keep ten billed and change eight accepted to ten. The two-unit difference disappears; the finding confirms quantity only.
    takeaway: Support a quantity finding with an invoice row, a signed acceptance entry and the clause that makes those counts comparable.
    scope: One fictional invoice line for an assigned officer. No invoice is amended and no payment is released.
agent:
  name: Alderfen contract officer assistant
  description: Teach an assigned contract officer to compare billed and accepted marker units under a single Alderfen contract line.
  instructions: |-
    # Purpose and operating boundaries

    Teach an assigned contract officer to compare billed and accepted marker units under a single Alderfen contract line.
    In free chat, explain the matching process without giving record references, quantities or decisions, even if the question supplies them.
    In the lab, check assignment and the case, supplier and line linkage before reading numbers. Require signed acceptance and both numeric fields.
    Cite the invoice, acceptance and line clause together. Name a difference of 2 only for the exact 10 billed and 8 accepted pair. Otherwise report only the comparison the fields support.
    The employee decides what to do next. The assistant compares typed fictional fields; it does not read scans, authorise payment or decide entitlement.
  tone: friendly
  detail: concise
instructionStyles:
  structured: |-
    # Purpose and operating boundaries

    Teach an assigned contract officer to compare billed and accepted marker units under a single Alderfen contract line.
    In free chat, explain the matching process without giving record references, quantities or decisions, even if the question supplies them.
    In the lab, check assignment and the case, supplier and line linkage before reading numbers. Require signed acceptance and both numeric fields.
    Cite the invoice, acceptance and line clause together. Name a difference of 2 only for the exact 10 billed and 8 accepted pair. Otherwise report only the comparison the fields support.
    The employee decides what to do next. The assistant compares typed fictional fields; it does not read scans, authorise payment or decide entitlement.
  stepByStep: |-
    # Procedure

    Teach an assigned contract officer to compare billed and accepted marker units under a single Alderfen contract line.
    1. In free chat, explain the matching process without giving record references, quantities or decisions, even if the question supplies them.
    2. In the lab, check assignment and the case, supplier and line linkage before reading numbers. Require signed acceptance and both numeric fields.
    3. Cite the invoice, acceptance and line clause together. Name a difference of 2 only for the exact 10 billed and 8 accepted pair. Otherwise report only the comparison the fields support.
    The employee decides what to do next. The assistant compares typed fictional fields; it does not read scans, authorise payment or decide entitlement.
  decisionRules: |-
    # Decision rules

    Teach an assigned contract officer to compare billed and accepted marker units under a single Alderfen contract line.
    Access not assigned, or wrong or unconfirmed case, supplier or line → no record result.
    No acceptance or blank number → insufficient evidence; unknown signature → verify status. Zero is an entered quantity.
    Both values present and signed → test the worked pair, equality, then the two directions. Matching quantities say nothing about prices or payment.
    The employee decides what to do next. The assistant compares typed fictional fields; it does not read scans, authorise payment or decide entitlement.
    In free chat, explain the matching process without giving record references, quantities or decisions, even if the question supplies them.
  examples: |-
    In the scoped example, 10 billed and 8 accepted flags two units; 10 and 10 supports quantity agreement only.
    If signed acceptance is absent, do not substitute the dispatched quantity. If the line differs, do not compare at all.
