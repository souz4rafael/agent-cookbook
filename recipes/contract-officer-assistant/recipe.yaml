lab:
  title: Check one marker invoice line
  description: Use the employee assignment and matching status as simulated gates. Quantities are editable cells in alternate copies of the same training bundle, not extracted data.
  fields:
    - id: access
      label: Employee’s simulated assignment
      type: select
      options:
        - value: assigned
          label: Assigned officer
        - value: denied
          label: Access denied
        - value: unknown
          label: Assignment unknown
      defaultValue: unknown
      hint: A role title alone does not grant an assignment.
    - id: linkage
      label: Case, supplier and clause-line linkage
      type: select
      options:
        - value: matched
          label: All keys and units match
        - value: line
          label: Different contract line
        - value: supplier
          label: Different supplier
        - value: case
          label: Different case
        - value: unknown
          label: Linkage unresolved
      defaultValue: unknown
      hint: A match includes the clause line, not just the contract header.
    - id: endorsement
      label: Acceptance evidence
      type: select
      options:
        - value: signed
          label: Signed entry available
        - value: absent
          label: No acceptance entry
        - value: unknown
          label: Entry status unknown
      defaultValue: signed
      hint: An unsigned or missing entry cannot support a comparison.
    - id: billed
      label: Billed marker units
      type: number
      defaultValue: 10
      min: 0
      max: 10000
      hint: Type the invoice quantity; leave blank if it is not supplied.
    - id: accepted
      label: Accepted marker units
      type: number
      defaultValue: 8
      min: 0
      max: 10000
      hint: Zero is an entered quantity. Clear the cell to represent a missing quantity.
  checks:
    - id: assigned
      label: Employee assigned
      field: access
      operator: eq
      value: assigned
    - id: matches
      label: Bundle keys match
      field: linkage
      operator: eq
      value: matched
    - id: signed
      label: Acceptance signed
      field: endorsement
      operator: eq
      value: signed
    - id: unknown-status
      label: Endorsement unknown
      field: endorsement
      operator: eq
      value: unknown
    - id: has-billed
      label: Invoice quantity supplied
      field: billed
      operator: present
    - id: has-accepted
      label: Accepted quantity supplied
      field: accepted
      operator: present
    - id: billed-ten
      label: Invoice field is ten
      field: billed
      operator: eq
      value: 10
    - id: accepted-eight
      label: Acceptance field is eight
      field: accepted
      operator: eq
      value: 8
    - id: equal
      label: Same quantity
      field: billed
      operator: eq
      otherField: accepted
    - id: higher
      label: More billed than accepted
      field: billed
      operator: gt
      otherField: accepted
    - id: lower
      label: Fewer billed than accepted
      field: billed
      operator: lt
      otherField: accepted
  rules:
    - id: assignment-first
      label: Require the staff assignment
      all:
        - checkId: assigned
          equals: false
      outcomeId: no-case-view
    - id: keys-before-cells
      label: Require matching keys and units
      all:
        - checkId: matches
          equals: false
      outcomeId: no-case-view
    - id: verify-signature
      label: Keep unknown endorsement distinct
      all:
        - checkId: unknown-status
          equals: true
      outcomeId: unknown-acceptance
    - id: require-entry
      label: "No signed entry: stop"
      all:
        - checkId: signed
          equals: false
      outcomeId: missing-acceptance
    - id: require-accepted-cell
      label: A blank is not zero
      all:
        - checkId: has-accepted
          equals: false
      outcomeId: missing-accepted-cell
    - id: require-billed-cell
      label: Require the invoice quantity
      all:
        - checkId: has-billed
          equals: false
      outcomeId: missing-billed-cell
    - id: worked-pair
      label: Use the two-unit finding only for this exact pair
      all:
        - checkId: billed-ten
          equals: true
        - checkId: accepted-eight
          equals: true
      outcomeId: two-unit-difference
    - id: compare-equality
      label: Check agreement of quantities only
      all:
        - checkId: equal
          equals: true
      outcomeId: quantity-agrees
    - id: compare-higher
      label: Billed field exceeds the accepted field
      all:
        - checkId: higher
          equals: true
      outcomeId: billed-higher
    - id: compare-lower
      label: Billed field is below the accepted field
      all:
        - checkId: lower
          equals: true
      outcomeId: billed-lower
    - id: stop-unresolved
      label: No supported comparison
      all: []
      outcomeId: no-comparison
  outcomes:
    - id: two-unit-difference
      title: Flag a difference of 2 units
      summary: "Invoice IV-730 and acceptance AC-512, read against CT-73 line M4, clause 7.2. 10 billed versus 8 accepted: flag the two unmatched units for review. The employee decides whether to request an amended invoice or more acceptance evidence."
      documentIds:
        - marker-invoice
        - marker-acceptance
        - marker-contract-line
    - id: quantity-agrees
      title: Quantity agrees only
      summary: Invoice IV-730 and acceptance AC-512, read against CT-73 line M4, clause 7.2. {{billed}} billed and {{accepted}} accepted. This establishes agreement of quantity only. Price, tax and payment are separate; the employee decides next steps.
      documentIds:
        - marker-invoice
        - marker-acceptance
        - marker-contract-line
    - id: billed-higher
      title: Billed quantity is higher
      summary: Invoice IV-730 and acceptance AC-512, read against CT-73 line M4, clause 7.2. {{billed}} billed exceeds {{accepted}} accepted. Flag the mismatch without substituting a quantity. The employee decides how to follow up.
      documentIds:
        - marker-invoice
        - marker-acceptance
        - marker-contract-line
    - id: billed-lower
      title: Billed quantity is lower
      summary: Invoice IV-730 and acceptance AC-512, read against CT-73 line M4, clause 7.2. {{billed}} billed is below {{accepted}} accepted. The employee decides whether the invoice covers only part of the delivery.
      documentIds:
        - marker-invoice
        - marker-acceptance
        - marker-contract-line
    - id: missing-acceptance
      title: "Insufficient evidence: no acceptance entry"
      summary: A billed figure cannot stand in for signed acceptance. Ask for a signed entry on the matched line; give no comparison.
      documentIds:
        - quantity-desk-card
    - id: unknown-acceptance
      title: Acceptance status unknown
      summary: The entry’s endorsement has not been verified. Its numbers cannot support a finding yet; do not treat them as zero or as a confirmed missing entry.
      documentIds:
        - quantity-desk-card
    - id: missing-accepted-cell
      title: "Insufficient evidence: accepted quantity is blank"
      summary: A signed entry with a blank quantity is not evidence of zero accepted. Obtain the completed entry before comparing.
      documentIds:
        - quantity-desk-card
    - id: missing-billed-cell
      title: "Insufficient evidence: billed quantity is blank"
      summary: The invoice quantity is not supplied. Obtain the completed invoice row; do not fill it from the delivery count.
      documentIds:
        - quantity-desk-card
    - id: no-case-view
      title: No case finding
      summary: No case result is available in this view. The desk card describes the matching process.
      documentIds:
        - quantity-desk-card
    - id: no-comparison
      title: Comparison unresolved
      summary: Do not infer an amount. Ask the employee to check the evidence before making a finding.
      documentIds:
        - quantity-desk-card
  cases:
    - id: ten-versus-eight
      title: Compare ten billed with eight accepted
      inputs:
        access: assigned
        linkage: matched
        endorsement: signed
        billed: 10
        accepted: 8
      expected:
        outcomeId: two-unit-difference
        documentIds:
          - marker-invoice
          - marker-acceptance
          - marker-contract-line
        kind: answer
        contains:
          - difference of 2 units
          - IV-730
          - AC-512
          - line M4, clause 7.2
          - The employee decides
    - id: ten-versus-ten
      title: Change accepted to ten
      inputs:
        access: assigned
        linkage: matched
        endorsement: signed
        billed: 10
        accepted: 10
      expected:
        outcomeId: quantity-agrees
        documentIds:
          - marker-invoice
          - marker-acceptance
          - marker-contract-line
        kind: answer
        contains:
          - Quantity agrees only
          - 10 billed and 10 accepted
          - the employee decides
    - id: zero-is-a-number
      title: Zero accepted is a signed count
      inputs:
        access: assigned
        linkage: matched
        endorsement: signed
        billed: 10
        accepted: 0
      expected:
        outcomeId: billed-higher
        documentIds:
          - marker-invoice
          - marker-acceptance
          - marker-contract-line
        kind: answer
        contains:
          - 10 billed exceeds 0 accepted
    - id: two-zeroes
      title: Both rows explicitly record zero
      inputs:
        access: assigned
        linkage: matched
        endorsement: signed
        billed: 0
        accepted: 0
      expected:
        outcomeId: quantity-agrees
        documentIds:
          - marker-invoice
          - marker-acceptance
          - marker-contract-line
        kind: answer
        contains:
          - 0 billed and 0 accepted
    - id: not-the-worked-pair
      title: Use nine and seven rather than the printed pair
      inputs:
        access: assigned
        linkage: matched
        endorsement: signed
        billed: 9
        accepted: 7
      expected:
        outcomeId: billed-higher
        documentIds:
          - marker-invoice
          - marker-acceptance
          - marker-contract-line
        kind: answer
        contains:
          - 9 billed exceeds 7 accepted
    - id: lower-than-accepted
      title: Reverse the direction
      inputs:
        access: assigned
        linkage: matched
        endorsement: signed
        billed: 6
        accepted: 8
      expected:
        outcomeId: billed-lower
        documentIds:
          - marker-invoice
          - marker-acceptance
          - marker-contract-line
        kind: answer
        contains:
          - 6 billed is below 8 accepted
    - id: entry-absent
      title: An old number is not an acceptance entry
      inputs:
        access: assigned
        linkage: matched
        endorsement: absent
        billed: 10
        accepted: 8
      expected:
        outcomeId: missing-acceptance
        documentIds:
          - quantity-desk-card
        kind: answer
        contains:
          - "Insufficient evidence: no acceptance entry"
    - id: null-accepted
      title: Clear a signed acceptance cell
      inputs:
        access: assigned
        linkage: matched
        endorsement: signed
        billed: 10
        accepted: null
      expected:
        outcomeId: missing-accepted-cell
        documentIds:
          - quantity-desk-card
        kind: answer
        contains:
          - blank quantity is not evidence of zero
    - id: null-billed
      title: Clear the invoice cell
      inputs:
        access: assigned
        linkage: matched
        endorsement: signed
        billed: null
        accepted: 8
      expected:
        outcomeId: missing-billed-cell
        documentIds:
          - quantity-desk-card
        kind: answer
        contains:
          - invoice quantity is not supplied
    - id: unknown-endorsement
      title: Do not use a count with unknown status
      inputs:
        access: assigned
        linkage: matched
        endorsement: unknown
        billed: 10
        accepted: 0
      expected:
        outcomeId: unknown-acceptance
        documentIds:
          - quantity-desk-card
        kind: answer
        contains:
          - Acceptance status unknown
    - id: without-marker-invoice
      title: Block the comparison without marker-invoice
      inputs:
        access: assigned
        linkage: matched
        endorsement: signed
        billed: 10
        accepted: 8
      expected:
        outcomeId: two-unit-difference
        documentIds: []
        kind: missing-knowledge
        contains:
          - "Run blocked:"
          - No draft or action was produced.
      disabledKnowledge:
