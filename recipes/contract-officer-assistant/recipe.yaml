implementation:
  - title: Build this in the real service
    description: Bind access to the employee’s assignment. Retain row keys, units, source versions and signed status alongside the numeric cells. Keep review of a discrepancy separate from the authority to release funds.
  - title: What to measure
    description: Count findings backed by all three sources. Repeat with zero, blank, unknown endorsement and mismatched identifiers; none should silently become a payable quantity.
  - title: Scope of this draft
    description: The employee decides what to do next. The assistant compares typed fictional fields; it does not read scans, authorise payment or decide entitlement. This local exercise uses fictional evidence; it does not access a live system or make an official determination. The Microsoft Learn reference is about agent authoring, not municipal policy.
