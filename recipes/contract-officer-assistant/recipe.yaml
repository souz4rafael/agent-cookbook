    connectionId: evidence-library
    resourceId: alderfen-library
    file: documents/quantity-desk-card.txt
  - id: marker-contract-line
    title: Marker contract line · CT-73
    summary: "Case key K-730; supplier S-MOSS; contract CT-73, line M4 (path markers, unit: each)."
    connectionId: evidence-library
    resourceId: alderfen-library
    file: documents/marker-contract-line.txt
  - id: marker-invoice
    title: Marker invoice · IV-730
    summary: IV-730, row 04, carries K-730 / S-MOSS / CT-73 / M4. The field “billed units” counts individual markers.
    connectionId: evidence-library
    resourceId: alderfen-library
    file: documents/marker-invoice.txt
  - id: marker-acceptance
    title: Marker acceptance entry · AC-512
    summary: AC-512, receipt row M4, uses K-730 / S-MOSS / CT-73. “Accepted units” is the signed count, not the carrier’s tally.
    connectionId: evidence-library
    resourceId: alderfen-library
    file: documents/marker-acceptance.txt
facts:
  - id: pair-records
    documentId: quantity-desk-card
    keywords:
      - Which references must agree before I compare quantities
    answer: Match the case, supplier and contract line on the invoice and signed acceptance to the current clause. Compare the same unit of measure on both rows.
    detail: A delivery description, dispatch count or similar supplier name is not a substitute for that match.
  - id: read-blank
    documentId: quantity-desk-card
    keywords:
      - Does a blank acceptance quantity mean zero
    answer: No. A blank supplies no quantity. A recorded zero is a number, but it still needs a signed acceptance entry on the matched line.
    detail: If the signature status is unknown, verify it before using any number.
  - id: word-finding
    documentId: quantity-desk-card
    keywords:
      - What can a quantity finding tell an employee
    answer: Say whether the two quantities agree or differ. Cite the invoice row, the acceptance entry and the clause that links them.
    detail: Leave the next step to the employee. A quantity match does not establish price, tax or permission to pay.
