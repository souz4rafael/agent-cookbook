implementation:
  - title: Original agent and package
    description: "Adapted from Contract Compliance Reviewer v1.0.0.1 by Adriana Trujillo. In the inspected ZIP, two skill definitions direct the reviews; their Python helpers add supplied findings to a new Word copy. The helpers do not decide what the law requires. See Recipe reference for the Gallery submission."
  - title: Going beyond the lab
    description: Replace or remove the upstream placeholder SharePoint folder, confirm permissible source sites for the real jurisdiction, check currency and file handling, and test with non-sensitive documents in an approved environment. A qualified legal professional must confirm the findings and omissions.
  - title: What this exercise covers
    description: Original fictional text, editable day counts and selected sources only. An editable local review slip is not an annotated contract. No AI inference, legal research, DOCX/PDF creation, uploads or changes to the original; no advice or authorisation to sign.

lab:
  title: One draft, three possible bases for a finding
  description: Edit the terms as if the drafter had revised the quoted passages. Choose the review scope; the legal fixture only applies to Grey Quay during 2025. Disconnect P7 or T12 to see what can still be supported. Both external standards are fictional.
  fields:
    - id: pass
      label: Requested review
      type: select
      defaultValue: internal
      options:
        - value: internal
          label: Internal consistency only
        - value: external
          label: Legal and optional policy review
        - value: both
          label: Both reviews
      hint: Select what the reviewer asked for; do not silently run the other pass.
    - id: body
      label: Section 4 period (days)
      type: number
      defaultValue: 30
      min: 0
      max: 120
      hint: Calendar days from signed acceptance. Leave blank for an unfilled term; zero means same day.
    - id: annex
      label: Schedule B period (days)
      type: number
      defaultValue: 45
      min: 0
      max: 120
      hint: Calendar days from signed acceptance. Leave blank for an unfilled term; zero means same day.
    - id: area
      label: Governing area in the draft
      type: select
      defaultValue: unstated
      options:
        - value: unstated
          label: Not stated
        - value: grey-quay
          label: Grey Quay exercise district
        - value: elsewhere
          label: Another jurisdiction
      hint: If absent, ask the requester. Do not infer an area from the title.
    - id: date
      label: Date for the legal review
      type: select
      defaultValue: within
      options:
        - value: within
          label: 15 June 2025 (inside fixture window)
        - value: outside
          label: 15 June 2026 (outside fixture window)
        - value: unknown
          label: Review date unknown
      hint: T12 is a fictional dated source; no current law is available.
  checks:
    - id: internal
      label: Internal pass only
      field: pass
      operator: eq
      value: internal
    - id: both
      label: Both passes requested
      field: pass
      operator: eq
      value: both
    - id: external
      label: External pass only
      field: pass
      operator: eq
      value: external
    - id: known-area
      label: Area matches T12
      field: area
      operator: eq
      value: grey-quay
    - id: unstated
      label: Governing area not stated
      field: area
      operator: eq
      value: unstated
    - id: in-window
      label: Review date within T12 window
      field: date
      operator: eq
      value: within
    - id: match
      label: Both terms present and equal
      field: body
      operator: eq
      otherField: annex
    - id: conflict
      label: Both terms present but different
      field: body
      operator: neq
      otherField: annex
    - id: has-body
      label: Section 4 has a stated period
      field: body
      operator: present
    - id: body-desk-over
      field: body
      label: Section 4 over 30-day exercise threshold
      operator: gt
      value: 30
    - id: body-desk-within
      field: body
      label: Section 4 within 30-day exercise threshold
      operator: lte
      value: 30
    - id: body-notice-over
      field: body
      label: Section 4 over 60-day exercise threshold
      operator: gt
      value: 60
    - id: body-notice-within
      field: body
      label: Section 4 within 60-day exercise threshold
      operator: lte
      value: 60
    - id: has-annex
      label: Schedule B has a stated period
      field: annex
      operator: present
    - id: annex-desk-over
      field: annex
      label: Schedule B over 30-day exercise threshold
      operator: gt
      value: 30
    - id: annex-desk-within
      field: annex
      label: Schedule B within 30-day exercise threshold
      operator: lte
      value: 30
    - id: annex-notice-over
      field: annex
      label: Schedule B over 60-day exercise threshold
      operator: gt
      value: 60
    - id: annex-notice-within
      field: annex
      label: Schedule B within 60-day exercise threshold
      operator: lte
      value: 60
  rules:
    - id: route-internal-only
      label: Compare only the two draft passages
      all:
        - checkId: internal
          equals: true
      outcomeId: internal-only
    - id: route-both-notice-playbook
      label: Both passes; applicable T12; P7 available
      all:
        - checkId: both
          equals: true
        - checkId: known-area
          equals: true
        - checkId: in-window
          equals: true
      requiresKnowledge:
        - desk-playbook
        - authority-card
      outcomeId: both-notice-playbook
    - id: route-both-notice
      label: Both passes; applicable T12; without P7
      all:
        - checkId: both
          equals: true
        - checkId: known-area
          equals: true
        - checkId: in-window
          equals: true
      requiresKnowledge:
        - authority-card
      outcomeId: both-notice
    - id: route-both-playbook
      label: Both passes; no applicable T12; P7 available
      all:
        - checkId: both
          equals: true
      requiresKnowledge:
        - desk-playbook
      outcomeId: both-playbook
    - id: route-both-draft
      label: Both passes; no applicable T12; without P7
      all:
        - checkId: both
          equals: true
      outcomeId: both-draft
    - id: route-external-notice-playbook
      label: External only; applicable T12; P7 available
      all:
        - checkId: external
          equals: true
        - checkId: known-area
          equals: true
        - checkId: in-window
          equals: true
      requiresKnowledge:
        - desk-playbook
        - authority-card
      outcomeId: external-notice-playbook
    - id: route-external-notice
      label: External only; applicable T12; without P7
      all:
        - checkId: external
          equals: true
        - checkId: known-area
          equals: true
        - checkId: in-window
          equals: true
      requiresKnowledge:
        - authority-card
      outcomeId: external-notice
    - id: route-external-playbook
      label: External only; no applicable T12; P7 available
      all:
        - checkId: external
          equals: true
      requiresKnowledge:
        - desk-playbook
      outcomeId: external-playbook
    - id: route-external-draft
      label: External only; no applicable T12; without P7
      all: []
      outcomeId: external-draft
  outcomes:
    - id: internal-only
      title: Internal consistency | reviewer findings
      summary: Only the two D2 passages were compared. Policy and law were not requested. Retain the original unchanged. Send outstanding questions to a qualified reviewer, not for automatic signature.
      documentIds:
        - draft-extract
      skillId: internal-comparison
      recommendations:
        - when:
            checkId: has-body
            equals: false
          title: Missing text | section 4
          description: Ask for the written period before drawing a conclusion about section 4. A blank is not a zero.
        - when:
            checkId: has-annex
            equals: false
          title: Missing text | schedule B
          description: Ask for the written period before drawing a conclusion about schedule B. A blank is not a zero.
        - when:
            checkId: conflict
            equals: true
          title: CONSISTENCY ISSUE | section 4 v schedule B
          description: "Same trigger and unit, different periods: {{body}} and {{annex}} days. Ask the drafter which text governs. Source: D2, section 4 and schedule B."
        - when:
            checkId: match
            equals: true
          title: Internal comparison | section 4 v schedule B
          description: "Both state {{body}} days. No discrepancy on this comparison only; no conclusion about the rest of the contract. Source: D2."
      draft:
        title: Counsel review slip (editable working note)
        body: |-
          Original: Lantern Hire D2, section 4 and schedule B, both measured from signed acceptance.
          Section 4: {{body}} days. Schedule B: {{annex}} days.
          Requested pass: {{pass}}. Only the two D2 passages were compared. Policy and law were not requested.
          Reviewer: record the location and source for each finding above. For each outstanding question, name who can supply the evidence. No signature or document change is authorised.
    - id: both-notice-playbook
      title: Both reviews | reviewer findings
      summary: Legal comparison uses only fictional T12.3 for the specified area and exercise date. Policy comparison uses the internal playbook, P7.2. Retain the original unchanged. Send outstanding questions to a qualified reviewer, not for automatic signature.
      documentIds:
        - draft-extract
        - desk-playbook
        - authority-card
      skillId: source-scoped-review
      recommendations:
        - when:
            checkId: has-body
            equals: false
