  cases:
    - id: internal-30-45
      title: Different deadlines for one acceptance event
      inputs:
        pass: internal
        body: 30
        annex: 45
        area: unstated
        date: within
      expected:
        outcomeId: internal-only
        kind: answer
        documentIds:
          - draft-extract
        contains:
          - CONSISTENCY ISSUE
          - 30 and 45 days
    - id: aligned-but-over-policy
      title: Matching 45-day clauses, separate desk exception
      inputs:
        pass: both
        body: 45
        annex: 45
        area: grey-quay
        date: within
      expected:
        outcomeId: both-notice-playbook
        kind: answer
        documentIds:
          - draft-extract
          - desk-playbook
          - authority-card
        contains:
          - No discrepancy on this comparison only
          - ORG POLICY CONFLICT | section 4
          - does not exceed the maximum in invented training notice
    - id: no-jurisdiction
      title: No governing area, drafting conflict still stands
      inputs:
        pass: both
        body: 30
        annex: 45
        area: unstated
        date: within
      expected:
        outcomeId: both-playbook
        kind: answer
        documentIds:
          - draft-extract
          - desk-playbook
        contains:
          - Legal review not assessed
          - Ask the requester which jurisdiction governs
          - CONSISTENCY ISSUE
    - id: no-official-source
      title: Unselected authority is not replaced by internal guidance
      inputs:
        pass: both
        body: 30
        annex: 45
        area: grey-quay
        date: within
      expected:
        outcomeId: both-playbook
        kind: answer
        documentIds:
          - draft-extract
          - desk-playbook
        contains:
          - Legal review not assessed
          - CONSISTENCY ISSUE
      disabledKnowledge:
        - authority-card
    - id: notice-only
      title: Internal playbook absent, fictional authority still applicable
      inputs:
        pass: both
        body: 30
        annex: 75
        area: grey-quay
        date: within
      expected:
        outcomeId: both-notice
        kind: answer
        documentIds:
          - draft-extract
          - authority-card
        contains:
          - Policy review skipped
          - LEGAL CONFLICT (fictional provision only) | schedule B
          - CONSISTENCY ISSUE
      disabledKnowledge:
        - desk-playbook
    - id: no-supplements
      title: Both supplemental sources unavailable
      inputs:
        pass: both
        body: 30
        annex: 45
        area: grey-quay
        date: within
      expected:
        outcomeId: both-draft
        kind: answer
        documentIds:
