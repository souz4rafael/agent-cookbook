schemaVersion: 1
revision: 1
id: gallery-contract-compliance-reviewer
status: published
title: "Contract Compliance Reviewer: which source supports the finding?"
summary: Two payment periods in a lantern hire draft do not agree. Compare the clauses before signature, then see why an internal exception and a legal question need different evidence and different reviewers.
industry: Legal and procurement
difficulty: intermediate
accentIcon: document
learningGoals:
  - Compare two written periods only when both are present and run from the same acceptance event.
  - Separate a drafting inconsistency, an exception to an internal standard and a conflict with a dated training provision.
  - Retain an independently supported finding when jurisdiction, date or an external source is missing; route unanswered questions to counsel.
sourceUrl: https://microsoft.github.io/copilot-studio-gallery/solutions/contract-compliance-reviewer/
scenario:
  headline: If two clauses agree, is the contract ready to sign?
  problem: The purchasing team has received a hire agreement. Section 4 gives the authority 30 days after signed acceptance to pay, while schedule B gives it 45. The drafter can fix that contradiction without knowing the law. The question of which period is acceptable to the procurement desk or a regulator is different.
  impact: Calling an internal standard a law sends a supplier the wrong objection. Calling two matching clauses compliant can hide an exception that still needs the policy owner's or legal reviewer's attention.
  approach: Compare the two passages, then report each external check under its own heading. A finding identifies the passage, the basis for comparison and what a person must decide. When the governing area or applicable dated authority is unknown, leave the legal question open.
  startSmall: Use one unsigned hire agreement, one internal standard and one dated training notice. Start with the consistency pass. Set both periods to 45 days and run both passes; then disconnect the internal playbook and compare what can still be supported.
  potentialValue: A drafter could fix a textual discrepancy while sending only the actual policy and legal questions to the right reviewers.
  measure: Sample pre-signature review notes. Count findings with a traceable clause and the correct basis; record unfounded legal conclusions and unresolved questions separately. Do not count a quiet review as a compliant contract.
  boundary: The learner edits two structured payment periods, not an uploaded contract. The authority card represents an invented provision, never live law. Qualified counsel must independently verify real legal conclusions. No original document is modified.
  sourceLabel: "Gallery: Contract Compliance Reviewer v1.0.0.1 by Adriana Trujillo | original agent, not this teaching fixture"
  home:
    challenge: A buyer spots two payment deadlines but needs to know whether the objection is about the wording, the desk's policy or applicable law.
    experiment: Change clause 4 from 30 to 45 days to match schedule B. Run both reviews with the playbook selected, then remove it and see which findings survive.
    takeaway: Support each finding with the right evidence. Agreement between two passages is not proof of policy or legal compliance.
    scope: One unsigned fictional contract and dated teaching sources; no legal research, file upload, Word/PDF annotation or approval.
agent:
  name: Contract Compliance Reviewer
  description: Prepare a first-pass finding on payment terms for a drafter or legal professional.
  instructions: |-
    # Review mandate and sources

    Establish the requested review: internal consistency, external checks, or both. Keep the original agreement unchanged.
    For consistency, compare section 4 and schedule B only when both periods are stated for the same acceptance event. Name the passages; never treat a blank as zero.
    Use the desk playbook only for policy findings. For legal review, establish the governing jurisdiction and review date before using a relevant official provision. Ask when the jurisdiction is not stated. A desk rule cannot substitute for law.
    Report each supported finding and its source separately. Keep unsupported checks unassessed. Refer conclusions to qualified counsel before anyone relies on them.
  tone: formal
  detail: concise
instructionStyles:
  structured: |-
    # Review mandate and sources

    Establish the requested review: internal consistency, external checks, or both. Keep the original agreement unchanged.
    For consistency, compare section 4 and schedule B only when both periods are stated for the same acceptance event. Name the passages; never treat a blank as zero.
    Use the desk playbook only for policy findings. For legal review, establish the governing jurisdiction and review date before using a relevant official provision. Ask when the jurisdiction is not stated. A desk rule cannot substitute for law.
    Report each supported finding and its source separately. Keep unsupported checks unassessed. Refer conclusions to qualified counsel before anyone relies on them.
  stepByStep: |-
    # Procedure for the review team

    1. Ask which passes are needed and identify the two passages in the unsigned copy.
    2. Check the payment trigger, unit and both values before reporting a drafting difference.
    3. Read the selected desk standard for a policy check. Separately establish the applicable area, date and authoritative provision for a legal check.
    4. Record the basis, location and reviewer question for each finding; never amend the contract or infer an overall pass.
    5. If a source cannot be read, state which comparison was not assessed and what the requester must provide. Keep any independent comparison that is still supported by the signed-acceptance wording. When two terms agree, report agreement only for those terms; a policy exception or an outstanding question can still require review.
  decisionRules: |-
    # Evidence and decision boundaries

    Missing period: ask for the text; zero is a stated value. Different periods on the same trigger: flag an internal inconsistency.
    Internal cap exceeded: cite the playbook and refer the exception to the policy owner. Do not label this a breach of law.
    Jurisdiction missing: ask for it. Source inapplicable, undated or unavailable: withhold the legal conclusion. Preserve any independent consistency finding.
    Even a fully matched set of figures is not authority to sign. Counsel owns the legal review.
    If the request covers both passes, keep the finding for each basis separate. Do not use an internal policy to fill a gap in the legal source or treat a dated provision for one area as authoritative elsewhere. For each unresolved issue identify the passage, the missing evidence and the person who can clarify it.
  examples: |-
    Section 4 and schedule B both say 45 days. There is no difference between those numbers. An internal cap of 30 days still needs its own policy finding.
    The contract omits the governing area. Ask which area governs, do not choose one, and do not suppress a supported comparison between the clauses.
editable: [name, instructions, tone, detail]
connections:
  - id: review-library
    type: sharepoint
    title: Demo review library
    description: Connect the local library, then select the individual documents for the requested passes.
    accountLabel: Grey Quay learning environment
    resources: [{id: training-packet, label: Grey Quay training packet, description: Three fictional sources for a pre-signature review.}]
    realWorldNote: The Gallery sample can search official sites and can use an organisational SharePoint source. This local library does neither.
knowledge:
  - {id: draft-extract, title: "D2: Lantern Hire draft, section 4 and schedule B", summary: Two editable terms measured from signed acceptance., connectionId: review-library, resourceId: training-packet, file: documents/draft-extract.txt}
  - {id: desk-playbook, title: "P7: Grey Quay desk playbook", summary: Fictional internal standard for the written payment interval., connectionId: review-library, resourceId: training-packet, file: documents/desk-playbook.txt}
  - {id: authority-card, title: "T12: dated training authority (invented)", summary: A fictional jurisdiction and time window for practising source selection; not actual law., connectionId: review-library, resourceId: training-packet, file: documents/authority-card.txt}
facts:
  - id: internal-method
    documentId: draft-extract
    keywords: [compare the two passages]
    answer: Both passages concern the same payer, item, acceptance event and calendar-day unit. Two different periods therefore warrant an editorial question for the drafter.
    detail: A matching pair resolves this comparison only; it cannot settle other drafting issues, policy or law.
  - id: policy-method
    documentId: desk-playbook
    keywords: [distinguish a desk exception]
    answer: The playbook governs the desk's internal position, not a country's law. For example, two matching periods of 45 days can agree with each other and still exceed P7.2.
    detail: If the playbook is not connected and selected, no policy finding is supported.
  - id: legal-method
    documentId: authority-card
    keywords: [establish the governing area]
    answer: First identify the governing area and review date. If either is unknown or outside the fixture, the legal check is not assessed.
    detail: Ask a qualified reviewer for the applicable official provision and effective version. An internal playbook, blog or a second clause is not a substitute.
tools: []
skills:
  - id: internal-comparison
    title: Internal consistency comparison
    description: Compares two typed intervals and identifies a missing passage. It does not parse arbitrary contracts.
    instructions: Use the same signed acceptance event and calendar-day unit; cite both locations before asking the drafter to reconcile them.
    coverage: simulated
  - id: source-scoped-review
    title: Source-scoped external review
    description: Distinguishes an internal playbook from a dated fictional authority card. No current law is researched.
    instructions: Separate each finding by source. Withhold a legal finding if area, date or authority cannot support it. Leave the decision to counsel.
    coverage: simulated
conversations:
  - schemaVersion: 1
    revision: 1
    id: pre-signature
    title: Before the draft goes to counsel
    mode: simulated
    starter: {label: "Which clauses need a second look?", prompt: "Before I send this draft for signature, which clauses need a second look?"}
    variationPolicy: stable-per-session
    onUnexpectedInput: stay-and-guide
    variables: {}
    steps:
      - id: choose-basis
        role: assistant
        variants:
          - {id: direct, text: "Are you comparing the agreement with itself, the desk's standard, or an applicable legal source?"}
          - {id: conversational, text: "Let's start with the evidence. Which question would you like the drafter to put to the reviewer?"}
      - id: basis
        role: user
        choices:
          - {id: internal, label: Compare the two clauses, acceptedTexts: [Internal consistency], next: internal-note}
          - {id: policy, label: Check the desk standard, acceptedTexts: [Policy], next: policy-note}
          - {id: legal, label: Ask about legal authority, acceptedTexts: [Legal compliance], next: legal-note}
      - {id: internal-note, role: simulation, prompt: How do we compare the two passages?, end: true}
      - {id: policy-note, role: simulation, prompt: How do we distinguish a desk exception from law?, end: true}
      - {id: legal-note, role: simulation, prompt: Why establish the governing area before citing a rule?, end: true}
test:
  suggestedQuestions:
    - How do we compare the two passages?
    - How do we distinguish a desk exception from law?
    - Why establish the governing area before citing a rule?
  handoffKeywords: []
  unknownAnswer: Choose a question about a review method, or change the periods in Review > Try this example. No contract can be uploaded or approved here.
  missingKnowledgeAnswer: The note needed for that question has not been selected. Do not replace it with a different kind of evidence.
  handoffBlockedAnswer: No filing, annotation or approval tool is configured.
  handoffReadyAnswer: The reviewer must decide; no action can be executed here.
