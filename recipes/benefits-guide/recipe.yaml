schemaVersion: 1
revision: 1
id: benefits-guide
status: published
title: Family travel benefit guide
summary: A family has kept last term’s route card. Read its sample renewal invitation, work out which evidence to prepare, and distinguish a receipt enquiry from a challenge to a written decision.
industry: Government and public services
difficulty: beginner
accentIcon: benefit
learningGoals:
  - Use the invitation’s issue date to explain when last term’s route card gives way to a slip showing the first and last travel dates.
  - Ask for a dated invitation when the edition is unclear, or ask the issuing desk about alternatives when the listed evidence is missing.
  - Use the letter heading to find the enquiry route on a receipt or the review route and time limit on a disputed decision.
sourceUrl: https://learn.microsoft.com/en-us/microsoft-copilot-studio/authoring-instructions
scenario:
  group: { journey: Social benefits, perspective: guidance }
  headline: Last term’s route card is still in the drawer. Is it what this letter asks for?
  problem: A family renewing school travel support knows what it sent last term. A new invitation asks for different evidence, but an older invitation may still be on the kitchen table. The date the family opens the envelope does not tell them which list to follow.
  impact: Sending the familiar card against the wrong invitation can mean a second request and another wait. Later, a family chasing a receipt needs a different answer from one disputing a written decision; sending both back to the evidence checklist costs them time.
  approach: In the fictional exercise, read the heading first. For an invitation, cite the change leaflet and compare its issue date with the evidence the family has. For a receipt or decision, use the letter key to explain where to ask about progress or find the notice’s own review instructions.
  startSmall: For a service pilot, have the issuing desk check two editions of one renewal invitation and the receipt and decision headings. Ask families to find their next step on blank examples before offering the guide alongside real letters.
  potentialValue: Families could prepare the right enclosure on the first attempt and recognise when the useful next step is an enquiry rather than another bundle of paperwork.
  measure: Compare requests to replace an incorrect enclosure per 100 renewals before and during a pilot. On sample letters, record how often readers find the right enquiry or review route without prompting.
  boundary: The Schoolday Travel Benefit and its October 2031 change are invented. The guide reads sample wording, not a child’s travel record. It cannot determine eligibility, check delivery, send evidence or lodge an appeal.
  sourceLabel: Copilot Studio authoring guidance
  home:
    challenge: A family has last term’s route card, but two renewal invitations on the table ask for different proof.
    experiment: Keep the route card selected and switch the invitation’s issue date from September to October 2031. Which invitation asks for both travel dates?
    takeaway: The invitation date tells you what to prepare. A receipt tells you where to ask about progress; a decision tells you how to challenge it.
    scope: Sample letters only. No family record is opened, no evidence is sent and no benefit or appeal is decided.
agent:
  name: Family travel benefit guide
  description: Help a family understand a fictional change to the Schoolday Travel Benefit evidence rule, using the public leaflet and sample letters only.
  instructions: |-
    # Purpose and operating boundaries

    Help a family understand a fictional change to the Schoolday Travel Benefit evidence rule, using the public leaflet and sample letters only.
    Start with the heading on the paper. An invitation asks for evidence, a receipt confirms delivery only, and a decision notice has a separate review panel.
    For an invitation, use its issue date, not the date the family reads it. Explain the before-and-after evidence lists side by side. Ask for no names, route details, account numbers or files.
    Describe the smallest useful next step. For a status enquiry use the receipt instructions. For a disagreement explain how the family can follow the review or appeal instructions on its own notice.
    Give public guidance only. Do not look up a family, assess eligibility, calculate an award, submit evidence or file an appeal.
  tone: friendly
  detail: concise
instructionStyles:
