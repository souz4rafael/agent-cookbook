lab:
  title: What should the family do with this paper?
  description: Use only the three descriptions on the practice card. Keep the enclosure fixed and change the invitation edition to see what changed. Then switch the type of paper.
  fields:
    - id: invitation
      label: Issue date on the renewal invitation
      type: select
      options:
        - value: old
          label: Through 30 September 2031
        - value: new
          label: 1 October 2031 or later
        - value: unknown
          label: Date not visible
      defaultValue: new
      hint: Not the date of delivery. This field does not date a receipt or a decision.
    - id: enclosure
      label: Evidence the family has to hand
      type: select
      options:
        - value: route-card
          label: Last term’s route card
        - value: term-slip
          label: Term slip with both dates
        - value: unclear
          label: No usable document described
      defaultValue: route-card
      hint: Choose an example type; do not enter personal travel information.
    - id: paper
      label: Paper the family wants help with
      type: select
      options:
        - value: invitation
          label: Evidence invitation
        - value: receipt
          label: Delivery receipt
        - value: decision
          label: Written decision the family disputes
        - value: unknown
          label: Heading missing
      defaultValue: invitation
      hint: A receipt and a decision have different routes.
  checks:
    - id: invited
      label: This is an invitation
      field: paper
      operator: eq
      value: invitation
    - id: received
      label: This is a receipt
      field: paper
      operator: eq
      value: receipt
    - id: disputed
      label: This is a disputed written decision
      field: paper
      operator: eq
      value: decision
    - id: later
      label: Later edition
      field: invitation
      operator: eq
      value: new
    - id: earlier
      label: Earlier edition
      field: invitation
      operator: eq
      value: old
    - id: card
      label: Route card to hand
      field: enclosure
      operator: eq
      value: route-card
    - id: slip
      label: Dated term slip to hand
      field: enclosure
      operator: eq
      value: term-slip
  rules:
    - id: decision-route
      label: Read the review panel first
      all:
        - checkId: disputed
          equals: true
      outcomeId: review-panel
    - id: receipt-route
      label: Track delivery rather than resubmit
      all:
        - checkId: received
          equals: true
      outcomeId: enquire
    - id: later-packed
      label: Both date labels available
      all:
        - checkId: invited
          equals: true
        - checkId: later
          equals: true
        - checkId: slip
          equals: true
      outcomeId: prepare-slip
    - id: later-gap
      label: Later evidence still needed
      all:
        - checkId: invited
          equals: true
        - checkId: later
          equals: true
      outcomeId: seek-slip
    - id: earlier-packed
      label: Earlier evidence to hand
      all:
        - checkId: invited
          equals: true
        - checkId: earlier
          equals: true
        - checkId: card
          equals: true
      outcomeId: prepare-card
    - id: earlier-gap
      label: Earlier evidence not to hand
      all:
        - checkId: invited
          equals: true
        - checkId: earlier
          equals: true
      outcomeId: seek-card
    - id: unidentified
      label: Do not infer an edition or route
      all: []
      outcomeId: clarify-letter
  outcomes:
    - id: seek-slip
      title: Check the two travel dates
      summary: The later invitation calls for a term slip showing the first and last travel dates. A route card alone does not show that period. If the slip is unavailable, ask the issuing desk about an alternative.
      documentIds:
        - travel-change
    - id: prepare-card
      title: Use the earlier evidence list
      summary: For the earlier invitation, the route card is the listed evidence. Follow the return instructions on that invitation; this does not decide the benefit.
      documentIds:
        - travel-change
    - id: prepare-slip
      title: Prepare the dated term slip
      summary: Check that both dates are legible on the term slip and follow the return instructions on the invitation. Do not share the slip here.
      documentIds:
        - travel-change
    - id: seek-card
      title: Check the earlier invitation
      summary: The earlier list names the route card, not the later term slip. Ask the issuing desk about an alternative if the card cannot be supplied.
      documentIds:
        - travel-change
    - id: enquire
      title: Use the receipt to follow up
      summary: Use the enquiry route printed on the receipt to ask about progress. Do not send a duplicate bundle. A receipt does not tell you whether the family will receive a benefit.
      documentIds:
        - letter-key
    - id: review-panel
      title: Start with the reasons on the decision
      summary: Use the review or appeal panel on the decision, note the stated time limit and identify the reason disputed. If the panel is missing, ask the issuer promptly for a complete copy.
      documentIds:
        - letter-key
    - id: clarify-letter
      title: Identify the paper before choosing a list
      summary: Ask the issuing desk to confirm the heading and, for an invitation, its issue date. Do not infer a deadline, a decision or an evidence requirement from an unidentified letter.
      documentIds:
        - letter-key
        - travel-change
  cases:
    - id: october-card
      title: The October invitation and last term’s card
      inputs:
        invitation: new
        enclosure: route-card
        paper: invitation
      expected:
        outcomeId: seek-slip
        documentIds:
          - travel-change
        kind: answer
        contains:
          - first and last travel dates
    - id: september-card
      title: Same card, September invitation
      inputs:
        invitation: old
        enclosure: route-card
        paper: invitation
      expected:
        outcomeId: prepare-card
        documentIds:
          - travel-change
        kind: answer
        contains:
          - route card is the listed evidence
    - id: october-slip
      title: Both dates are on the term slip
      inputs:
        invitation: new
        enclosure: term-slip
        paper: invitation
      expected:
        outcomeId: prepare-slip
        documentIds:
          - travel-change
        kind: answer
        contains:
          - both dates are legible
    - id: earlier-no-card
      title: No route card for the earlier invitation
      inputs:
        invitation: old
        enclosure: unclear
        paper: invitation
      expected:
        outcomeId: seek-card
        documentIds:
          - travel-change
        kind: answer
        contains:
          - Ask the issuing desk about an alternative
    - id: receipt-only
      title: The family wants an update, not a second application
      inputs:
        invitation: new
        enclosure: route-card
        paper: receipt
      expected:
        outcomeId: enquire
        documentIds:
          - letter-key
        kind: answer
        contains:
          - enquiry route printed on the receipt
    - id: disputed-notice
      title: The family disputes a reason on the decision
      inputs:
        invitation: unknown
        enclosure: route-card
        paper: decision
      expected:
        outcomeId: review-panel
        documentIds:
          - letter-key
        kind: answer
        contains:
          - review or appeal panel
          - stated time limit
    - id: date-missing
      title: An invitation has no legible issue date
      inputs:
        invitation: unknown
        enclosure: route-card
        paper: invitation
      expected:
        outcomeId: clarify-letter
        documentIds:
          - letter-key
          - travel-change
        kind: answer
        contains:
          - confirm the heading
    - id: missing-leaflet
      title: The change leaflet is not selected
      inputs:
        invitation: new
        enclosure: route-card
        paper: invitation
      expected:
        outcomeId: seek-slip
        documentIds: []
        kind: missing-knowledge
        contains:
          - Run blocked
      disabledKnowledge:
        - travel-change
implementation:
  - title: Build this in the real service
    description: Have the service owner sign off each public leaflet and its effective-date trigger. Keep the resident-facing guide separate from any authenticated benefits service or appeals intake.
  - title: What to measure
    description: In labelled practice letters, count correct evidence lists by invitation edition and correct enquiry-versus-review routes by document type. Track any award assertion separately as an error.
  - title: Scope of this draft
    description: Give public guidance only. Do not look up a family, assess eligibility, calculate an award, submit evidence or file an appeal. This local exercise uses fictional evidence; it does not access a live system or make an official determination. The Microsoft Learn reference is about agent authoring, not municipal policy.
