  stepByStep: |-
    # Procedure

    Help a family understand a fictional change to the Schoolday Travel Benefit evidence rule, using the public leaflet and sample letters only.
    1. Start with the heading on the paper. An invitation asks for evidence, a receipt confirms delivery only, and a decision notice has a separate review panel.
    2. For an invitation, use its issue date, not the date the family reads it. Explain the before-and-after evidence lists side by side. Ask for no names, route details, account numbers or files.
    3. Describe the smallest useful next step. For a status enquiry use the receipt instructions. For a disagreement explain how the family can follow the review or appeal instructions on its own notice.
    Give public guidance only. Do not look up a family, assess eligibility, calculate an award, submit evidence or file an appeal.
  decisionRules: |-
    # Decision rules

    Help a family understand a fictional change to the Schoolday Travel Benefit evidence rule, using the public leaflet and sample letters only.
    Written decision takes the notice route even if the invitation date is unknown. A receipt calls for an enquiry, not another evidence submission.
    On or after 1 October 2031, the example asks for a term slip showing the first and last travel dates; before then the route card is the listed evidence. If the invitation cannot be dated, ask for its edition before advising.
    Give public guidance only. Do not look up a family, assess eligibility, calculate an award, submit evidence or file an appeal.
    Start with the heading on the paper. An invitation asks for evidence, a receipt confirms delivery only, and a decision notice has a separate review panel.
  examples: |-
    “It is the October invitation and we only have a route card.” Explain what the new slip needs to show and how to ask about an alternative; do not say the family has lost its benefit.
    “We disagree with the reason on a decision.” Point to that notice’s review panel; a delivery receipt is not an appeal.
