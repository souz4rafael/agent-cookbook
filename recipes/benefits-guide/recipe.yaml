knowledge:
  - id: travel-change
    title: "Schoolday travel: two invitation editions"
    summary: Compare what counts as evidence of the travel period, not who qualifies for help.
    connectionId: evidence-library
    resourceId: alderfen-library
    file: documents/travel-change.txt
  - id: letter-key
    title: "Letter key: invitation, receipt or decision?"
    summary: The heading determines the next route. Do not treat every letter as a decision.
    connectionId: evidence-library
    resourceId: alderfen-library
    file: documents/letter-key.txt
facts:
  - id: edition
    documentId: travel-change
    keywords:
      - Which date changes the travel evidence list
    answer: Use the invitation’s issue date. Before 1 October 2031 the sample lists the route card; from that date it lists a term slip showing the first and last travel dates.
    detail: If the family cannot tell which edition it has, ask the issuing desk for a dated copy rather than guessing from when the letter arrived.
  - id: receipt
    documentId: letter-key
    keywords:
      - What is a delivery receipt for
    answer: Keep the receipt and use the enquiry route printed on it to ask about progress. A receipt is not a decision.
    detail: There is no need to paste a reference or a copy of the receipt into chat. Use the private channel specified by the issuing desk.
  - id: challenge
    documentId: letter-key
    keywords:
      - Where does a family find the appeal route
    answer: The written decision has a review or appeal panel. Check its route and time limit, then identify the reason the family disputes.
    detail: If that panel is unreadable, ask the issuing desk promptly for an accessible copy and clarification. This guide cannot lodge an appeal or predict the outcome.
