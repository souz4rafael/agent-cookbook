connections:
  - id: evidence-library
    type: sharepoint
    title: Demo SharePoint
    description: Choose the library that holds the fictional guidance for this exercise.
    accountLabel: Alderfen learning environment
    resources:
      - id: alderfen-library
        label: Alderfen guidance library
        description: Evidence selected for Social caseworker review assistant.
    realWorldNote: A local library selection demonstrates grounding, not authentication. In a real service, validate the source owner, currency and access controls.
knowledge:
  - id: review-method
    title: "Public method: writing a review brief"
    summary: A review brief is a working note for a human technician; it is not a finding or a booking instruction.
    connectionId: evidence-library
    resourceId: alderfen-library
    file: documents/review-method.txt
  - id: bridge-room-cards
    title: "Bridge Room: fictional handover and desk cards"
    summary: These synthetic source cards model alternate copies of the same appointment history for a technician’s exercise. They contain no resident identifiers.
    connectionId: evidence-library
    resourceId: alderfen-library
    file: documents/bridge-room-cards.txt
facts:
  - id: scope
    documentId: review-method
    keywords:
      - What is the scope check for a case review
    answer: Verify the technician’s assignment to the specific case and the permitted purpose. A job title or membership of the same service is not enough.
    detail: If scope cannot be verified, give only the access requirement. Do not confirm that a file or appointment exists.
  - id: sources
    documentId: review-method
    keywords:
      - How should a brief record conflicting accounts
    answer: Attribute each statement to its source and leave the difference visible as a question for the assigned reviewer.
    detail: A handover that repeats a contact entry does not provide independent corroboration. A blank field is missing information, not an adverse finding.
