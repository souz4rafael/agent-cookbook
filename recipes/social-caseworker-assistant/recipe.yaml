    - How should a brief record conflicting accounts?
  handoffKeywords: []
  unknownAnswer: I can explain the public brief-writing method. I cannot confirm that a person, case or appointment exists. Use the fictional scoped exercise to practise.
  missingKnowledgeAnswer: The source needed for that question is unavailable. Connect the learning library and select the matching document; do not infer the answer from an absent source.
  handoffBlockedAnswer: The review tool is unavailable. No request was created.
  handoffReadyAnswer: Review the fictional request and confirm it separately. No external action has been performed.
