lab:
  title: Two periods and one provenance mark
  description: Practise the case-review policy on prewritten source cards. Change only the time on the desk slip, then change only its provenance; those are different reasons for review.
  fields:
    - id: clearance
      label: Simulated assignment and purpose
      type: select
      options:
        - value: assigned
          label: "Verified: assigned technician, this fixture, brief preparation"
        - value: elsewhere
          label: Technician assigned elsewhere
        - value: unverified
          label: Assignment or purpose not verified
      defaultValue: assigned
      hint: A learning input, not a login or real access grant.
    - id: intake
      label: Period on the contact card
      type: select
      options:
        - value: morning
          label: Morning
        - value: afternoon
          label: Afternoon
        - value: absent
          label: Not recorded
      defaultValue: afternoon
      hint: A reported preference. Never enter a name or free text.
    - id: slip
      label: Period on the desk slip
      type: select
      options:
        - value: morning
          label: Morning
        - value: afternoon
          label: Afternoon
        - value: absent
          label: Not recorded
      defaultValue: afternoon
      hint: A desk proposal, not a statement by the resident.
    - id: stamp
      label: Slip provenance
      type: select
      options:
        - value: current
          label: Current copy verified by planning desk
        - value: draft
          label: Marked draft
        - value: unknown
          label: No usable mark
      defaultValue: current
      hint: A draft and a current blank slip are different evidence problems.
  checks:
    - id: permitted
      label: Assignment and purpose verified
      field: clearance
      operator: eq
      value: assigned
    - id: verified
      label: Current copy verified
      field: stamp
      operator: eq
      value: current
    - id: intake-blank
      label: Contact period missing
      field: intake
      operator: eq
      value: absent
    - id: slip-blank
      label: Desk period missing
      field: slip
      operator: eq
      value: absent
    - id: same-period
      label: Contact and desk periods match
      field: intake
      operator: eq
      otherField: slip
  rules:
    - id: deny-first
      label: Stop without case-specific disclosure
      all:
        - checkId: permitted
          equals: false
      outcomeId: no-access
    - id: source-check
      label: Establish which slip can be used
      all:
        - checkId: verified
          equals: false
      outcomeId: verify-copy
    - id: complete-match
      label: Two known periods agree
      all:
        - checkId: intake-blank
          equals: false
        - checkId: slip-blank
          equals: false
        - checkId: same-period
          equals: true
      outcomeId: brief
    - id: complete-conflict
      label: Two known periods differ
      all:
        - checkId: intake-blank
          equals: false
        - checkId: slip-blank
          equals: false
        - checkId: same-period
          equals: false
      outcomeId: contrast
    - id: leave-open
      label: Do not compare missing periods
      all: []
      outcomeId: gap
  outcomes:
    - id: no-access
      title: Scope not verified
      summary: Use the authorised assignment route. No case information can be provided.
      documentIds:
        - review-method
    - id: brief
      title: Draft note for technician review
      summary: "Day 2 contact: preference {{intake}}. Day 3 handover: repeats the day 2 entry. Day 4 current desk slip: proposal {{slip}}. The periods agree; this does not confirm a booking. Technician: check with the resident before treating the proposal as agreed."
      documentIds:
        - review-method
        - bridge-room-cards
    - id: contrast
      title: Leave the two accounts visible
      summary: "Day 2 contact: {{intake}}. Day 3 handover repeats it. Day 4 desk-verified slip: {{slip}}. The periods differ. Question for the assigned technician: which period is currently intended? Preserve both sources and do not move the appointment."
      documentIds:
        - review-method
        - bridge-room-cards
    - id: verify-copy
      title: Establish which copy is current
      summary: The contact history is not verification of a desk slip. Ask the planning desk custodian for the current, verified copy before comparing periods. Leave the proposal unresolved.
      documentIds:
        - review-method
        - bridge-room-cards
    - id: gap
      title: A comparison is not yet possible
      summary: Leave missing periods unfilled. The assigned technician needs the missing source entry, not a guess copied from the other card.
      documentIds:
        - review-method
        - bridge-room-cards
      recommendations:
        - when:
            checkId: intake-blank
            equals: true
          title: Contact entry
          description: Clarify the stated preference rather than repeating the desk proposal.
        - when:
            checkId: slip-blank
            equals: true
          title: Desk slip
          description: Ask the planning desk to clarify its proposed period.
  cases:
    - id: aligned-window
      title: An assigned technician compares two afternoon entries
      inputs:
        clearance: assigned
        intake: afternoon
        slip: afternoon
        stamp: current
      expected:
        outcomeId: brief
        documentIds:
          - review-method
          - bridge-room-cards
        kind: answer
        contains:
          - preference afternoon
          - proposal afternoon
          - does not confirm a booking
    - id: different-window
      title: Only the desk period moves to morning
      inputs:
        clearance: assigned
        intake: afternoon
        slip: morning
        stamp: current
      expected:
        outcomeId: contrast
        documentIds:
          - review-method
          - bridge-room-cards
        kind: answer
        contains:
          - "Day 2 contact: afternoon"
          - "desk-verified slip: morning"
          - periods differ
    - id: superseded-slip
      title: A different period appears only on a draft
      inputs:
        clearance: assigned
        intake: afternoon
        slip: morning
        stamp: draft
      expected:
        outcomeId: verify-copy
        documentIds:
          - review-method
          - bridge-room-cards
        kind: answer
        contains:
          - current, verified copy
    - id: blank-slip
      title: A current copy lacks its proposed period
      inputs:
        clearance: assigned
        intake: afternoon
        slip: absent
        stamp: current
      expected:
        outcomeId: gap
        documentIds:
          - review-method
          - bridge-room-cards
        kind: answer
        contains:
          - Ask the planning desk to clarify
    - id: both-blank
      title: Two empty time fields are not agreement
      inputs:
        clearance: assigned
        intake: absent
        slip: absent
        stamp: current
      expected:
        outcomeId: gap
        documentIds:
          - review-method
          - bridge-room-cards
        kind: answer
        contains:
          - Clarify the stated preference
          - Ask the planning desk to clarify
    - id: different-case
      title: A technician is assigned elsewhere
      inputs:
        clearance: elsewhere
        intake: afternoon
        slip: afternoon
        stamp: current
      expected:
        outcomeId: no-access
        documentIds:
          - review-method
        kind: answer
        contains:
          - No case information can be provided
    - id: no-scope
      title: An assignment claim cannot be verified
      inputs:
        clearance: unverified
        intake: afternoon
        slip: absent
        stamp: current
      expected:
        outcomeId: no-access
        documentIds:
          - review-method
        kind: answer
        contains:
          - Use the authorised assignment route
    - id: source-absent
      title: The desk and handover cards are unavailable
      inputs:
        clearance: assigned
        intake: afternoon
        slip: afternoon
        stamp: current
      expected:
        outcomeId: brief
        documentIds: []
        kind: missing-knowledge
        contains:
          - Run blocked
      disabledKnowledge:
        - bridge-room-cards
implementation:
  - title: Build this in the real service
    description: Enforce identity, case assignment and purpose outside the model. Show source timestamps and versions to authorised staff, retain the technician’s edits separately and require human sign-off on any subsequent action.
  - title: What to measure
    description: For reviewer-labelled packets, count correctly attributed source pairs and conflicts preserved as open questions. In wrong-scope tests check separately for any case detail or case-specific citation.
  - title: Scope of this draft
    description: Only an assigned technician reviews the fictional brief. Do not disclose case information without scope, decide a service, rank a resident, or change a case record. This local exercise uses fictional evidence; it does not access a live system or make an official determination. The Microsoft Learn reference is about agent authoring, not municipal policy.
