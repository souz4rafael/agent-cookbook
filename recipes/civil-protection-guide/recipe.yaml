knowledge:
  - id: regional-bulletin-archive
    title: "Regional bulletin archive: reading the edition line"
    summary: This archive is a historical publishing exercise, not an alert feed.
    connectionId: evidence-library
    resourceId: alderfen-library
    file: documents/regional-bulletin-archive.txt
  - id: shelter-notice-guide
    title: Where official shelter notices come from
    summary: A shelter directory and an opening notice answer different questions. A directory describes a service; only the responsible local authority can issue current information about its availability.
    connectionId: evidence-library
    resourceId: alderfen-library
    file: documents/shelter-notice-guide.txt
  - id: recovery-enquiry-guide
    title: "After the event: questions for the support desk"
    summary: Post-event support is an information service, not a route to urgent help. In the Alderfen exercise, residents may ask the municipal recovery desk which public services are accepting enquiries and how to request information in an accessible format.
    connectionId: evidence-library
    resourceId: alderfen-library
    file: documents/recovery-enquiry-guide.txt
facts:
  - id: date-check
    documentId: regional-bulletin-archive
    keywords:
      - How do I tell whether this archived alert was replaced
    answer: If you are in immediate danger, contact local emergency services now. In the historical Alderfen exercise on 14 May 2025, the Regional Civil Protection Desk replaced the 09:00 UTC edition at 10:10 UTC. Neither is a current alert.
    detail: The exercise window ended at 12:00 UTC that day. Check the issuer, coverage, issue time and later revisions on the authority's own channel. For current local alerts and shelter information, use the official channels of your local emergency management authority.
  - id: shelter-check
    documentId: shelter-notice-guide
    keywords:
      - Where should I check current official shelter information
    answer: If you are in immediate danger, contact local emergency services now. For current local alerts and shelter information, use the official channels of your local emergency management authority. This exercise cannot confirm a shelter location or opening.
    detail: Check that the authority covers your area and that its notice has not expired or been replaced. A directory entry or screenshot is not an opening notice.
  - id: support-enquiry
    documentId: recovery-enquiry-guide
    keywords:
      - What can I ask a municipal recovery desk after an event
    answer: If you are in immediate danger, contact local emergency services now. For a nonurgent enquiry, ask the current official municipal recovery desk which support services are accepting enquiries and what accessible formats are available.
    detail: Check the date, service area and publisher before relying on a support notice. An archived programme description cannot promise assistance or determine eligibility.
