lab:
  title: Which part of a notice can you rely on?
  description: Change the public request and the evidence available in a historical exercise. Even the last archived edition is not current. No live information is available here.
  fields:
    - id: danger
      label: Immediate danger reported?
      type: boolean
      defaultValue: false
      hint: An immediate-danger message takes priority over every other field.
    - id: scope
      label: Request scope
      type: select
      options:
        - value: public
          label: Public regional information
        - value: restricted
          label: Private roster, live location or dispatch request
      defaultValue: public
      hint: Only public information for this exercise is in scope.
    - id: topic
      label: Information requested
      type: select
      options:
        - value: alert
          label: Regional alert
        - value: shelter
          label: Shelter notice
        - value: support
          label: Post-event support
      defaultValue: alert
      hint: Select the kind of public notice.
    - id: publisher
      label: Publisher evidence
      type: select
      options:
        - value: official
          label: Archived original from the regional desk
        - value: copy
          label: Forwarded copy only
        - value: unknown
          label: Issuer not shown
      defaultValue: unknown
      hint: A logo on a copy does not establish who issued the notice.
    - id: edition
      label: Edition evidence
      type: select
      options:
        - value: last-archived
          label: Last edition in the historical archive
        - value: replaced
          label: Marked as replaced
        - value: undated
          label: No usable edition or time
      defaultValue: undated
      hint: Last archived never means current.
  checks:
    - id: urgent
      label: Immediate danger reported
      field: danger
      operator: eq
      value: true
    - id: in-scope
      label: Public regional request
      field: scope
      operator: eq
      value: public
    - id: official
      label: Issuing desk established
      field: publisher
      operator: eq
      value: official
    - id: last-edition
      label: Last archived edition established
      field: edition
      operator: eq
      value: last-archived
    - id: superseded
      label: Notice marked as replaced
      field: edition
      operator: eq
      value: replaced
    - id: alert
      label: Alert question
      field: topic
      operator: eq
      value: alert
    - id: shelter
      label: Shelter question
      field: topic
      operator: eq
      value: shelter
    - id: support
      label: Post-event question
      field: topic
      operator: eq
      value: support
  rules:
    - id: danger-first
      label: Show urgent direction even without sources
      all:
        - checkId: urgent
          equals: true
      outcomeId: emergency-now
    - id: scope-stop
      label: Decline non-public or operational requests
      all:
        - checkId: in-scope
          equals: false
      outcomeId: public-only
    - id: old-edition
      label: Do not reuse a replaced edition
      all:
        - checkId: official
          equals: true
        - checkId: superseded
          equals: true
      outcomeId: not-current
    - id: archived-alert
      label: Explain the final historical edition
      all:
        - checkId: official
          equals: true
        - checkId: last-edition
          equals: true
        - checkId: alert
          equals: true
      outcomeId: read-archive
    - id: archived-shelter
      label: Distinguish an archive from present availability
      all:
        - checkId: official
          equals: true
        - checkId: last-edition
          equals: true
        - checkId: shelter
          equals: true
      outcomeId: check-shelter-channel
    - id: archived-support
      label: Separate recovery from immediate response
      all:
        - checkId: official
          equals: true
        - checkId: last-edition
          equals: true
        - checkId: support
          equals: true
      outcomeId: ask-recovery-desk
    - id: uncertain
      label: Do not fill gaps in a notice
      all: []
      outcomeId: unverified-notice
  outcomes:
    - id: emergency-now
      title: Contact local emergency services now
      summary: If you are in immediate danger, contact local emergency services now. Do not wait for this guide. It cannot dispatch assistance or provide locations.
      documentIds: []
      skillId: immediate-danger-message
    - id: public-only
      title: Request outside public scope
      summary: I cannot share private information, verify live locations or dispatch help. If you are in immediate danger, contact local emergency services now. For current local alerts and shelter information, use the official channels of your local emergency management authority.
      documentIds:
        - shelter-notice-guide
    - id: not-current
      title: Do not rely on the replaced notice
      summary: The exercise publisher marked this edition as replaced. Do not present it as active or use it to infer an opening. For current local alerts and shelter information, use the official channels of your local emergency management authority.
      documentIds:
        - regional-bulletin-archive
    - id: read-archive
      title: Read the historical edition, not a live alert
      summary: "Historical exercise: Alderfen Regional Civil Protection Desk, 14 May 2025, 10:10 UTC. This replaced the 09:00 UTC edition; the exercise window ended at 12:00 UTC. For current local alerts and shelter information, use the official channels of your local emergency management authority."
      documentIds:
        - regional-bulletin-archive
    - id: check-shelter-channel
      title: An archive cannot establish an opening
      summary: The historical notice does not establish current shelter availability. For current local alerts and shelter information, use the official channels of your local emergency management authority. On that channel, check issuer, area, issue time and later updates. No location is provided here.
      documentIds:
        - shelter-notice-guide
    - id: ask-recovery-desk
      title: Prepare a nonurgent recovery question
      summary: "Ask the current official municipal recovery desk: “Which post-event support services are accepting enquiries, and can I get the information in writing?” A historical notice does not establish eligibility or an award. No enquiry was sent."
      documentIds:
        - recovery-enquiry-guide
    - id: unverified-notice
      title: Currency not established
      summary: The issuer or edition cannot be established from the supplied evidence. Do not treat the notice as current. For current local alerts and shelter information, use the official channels of your local emergency management authority.
      documentIds:
        - regional-bulletin-archive
  cases:
    - id: last-edition
      title: Read the edition held in the archive
      inputs:
        danger: false
        scope: public
        topic: alert
        publisher: official
        edition: last-archived
      expected:
        outcomeId: read-archive
        documentIds:
          - regional-bulletin-archive
        kind: answer
        contains:
          - Historical exercise
          - 10:10 UTC
          - For current local alerts and shelter information, use the official channels of your local emergency management authority.
    - id: replaced-copy
      title: Read an edition marked replaced
      inputs:
        danger: false
        scope: public
        topic: alert
        publisher: official
        edition: replaced
      expected:
        outcomeId: not-current
        documentIds:
          - regional-bulletin-archive
        kind: answer
        contains:
          - marked this edition as replaced
    - id: current-shelter
      title: Ask about current shelter availability
      inputs:
        danger: false
        scope: public
        topic: shelter
        publisher: official
        edition: last-archived
      expected:
        outcomeId: check-shelter-channel
        documentIds:
          - shelter-notice-guide
        kind: answer
        contains:
          - does not establish current shelter availability
          - For current local alerts and shelter information, use the official channels of your local emergency management authority.
    - id: recovery-help
      title: Prepare a nonurgent question
      inputs:
        danger: false
        scope: public
        topic: support
        publisher: official
        edition: last-archived
      expected:
        outcomeId: ask-recovery-desk
        documentIds:
          - recovery-enquiry-guide
        kind: answer
        contains:
          - No enquiry was sent
    - id: unattributed
      title: Evaluate an undated forwarded notice
      inputs:
        danger: false
        scope: public
        topic: alert
        publisher: copy
        edition: undated
      expected:
        outcomeId: unverified-notice
        documentIds:
          - regional-bulletin-archive
        kind: answer
        contains:
          - Do not treat the notice as current
    - id: decline-roster
      title: Decline a request for private information
      inputs:
        danger: false
        scope: restricted
        topic: alert
        publisher: official
        edition: last-archived
      expected:
        outcomeId: public-only
        documentIds:
          - shelter-notice-guide
        kind: answer
        contains:
          - I cannot share private information
    - id: immediate-danger
      title: Give urgent direction without a verified notice
      inputs:
        danger: true
        scope: restricted
        topic: alert
        publisher: unknown
        edition: undated
      expected:
        outcomeId: emergency-now
        documentIds: []
        kind: answer
        contains:
          - If you are in immediate danger, contact local emergency services now.
          - Do not wait
    - id: no-bulletin
      title: Try the archive question with its document removed
      inputs:
        danger: false
        scope: public
        topic: alert
        publisher: official
        edition: last-archived
      expected:
        outcomeId: read-archive
        documentIds: []
        kind: missing-knowledge
        contains:
          - Run blocked
      disabledKnowledge:
        - regional-bulletin-archive
implementation:
  - title: Build this in the real service
    description: Have the responsible public information office specify official publishers, regional coverage and expiry handling; have safety reviewers test the immediate-danger message independently of source availability.
  - title: What to measure
    description: Check whether learners reject a superseded notice, distinguish support from emergency response, and give the same immediate-danger direction with the library disconnected.
  - title: Scope of this draft
    description: No live or unverified locations, shelter availability, dispatch, routes or operational hazard instructions. This local exercise uses fictional evidence; it does not access a live system or make an official determination. The Microsoft Learn reference is about agent authoring, not municipal policy.
