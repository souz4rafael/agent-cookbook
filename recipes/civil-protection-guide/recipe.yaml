conversations:
  - schemaVersion: 1
    revision: 1
    id: guided-example
    title: Civil Protection Guide
    mode: simulated
    starter:
      label: Read a public notice without treating it as live
      prompt: Read a public notice without treating it as live
    variationPolicy: stable-per-session
    onUnexpectedInput: stay-and-guide
    variables: {}
    steps:
      - id: clarify
        role: assistant
        variants:
