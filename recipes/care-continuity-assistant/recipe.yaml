lab:
  title: Is a no-return enquiry justified?
  description: Use synthetic day numbers on one exercise clock. Change the review day, return checks or permission and compare which entries warrant an unsent question. Do not supply personal information.
  fields:
    - id: assignment
      label: Coordinator assignment
      type: select
      options:
        - value: assigned
          label: Assigned to this exercise item
        - value: unassigned
          label: Not assigned, or assignment unconfirmed
      defaultValue: unassigned
      hint: Being able to see a worksheet does not imply an assignment.
    - id: permission
      label: Permission for this follow-up purpose?
      type: boolean
      defaultValue: false
      hint: Recorded permission must cover this exercise review and potential draft.
    - id: status
      label: Referral ledger state
      type: select
      options:
        - value: open
          label: Open for follow-up
        - value: inactive
          label: Paused or closed
        - value: unclear
          label: Ledger state unresolved
      defaultValue: unclear
      hint: Only an open item can qualify.
    - id: due-day
      label: Last on-time day
      type: number
      defaultValue: null
      min: 0
      max: 365
      hint: Exercise day count from the start of the ledger period; leave empty if no deadline is documented.
    - id: review-day
      label: Day of review
      type: number
      defaultValue: null
      min: 0
      max: 365
      hint: Use the same exercise clock as the due day; leave empty if unavailable.
    - id: returns
      label: Return evidence at the review cut-off
      type: select
      options:
        - value: none-verified
          label: Both intake log and return tray checked; no return
        - value: received
          label: Acknowledgement recorded in at least one source
        - value: incomplete
          label: A source is blank or not checked
      defaultValue: incomplete
      hint: A single unchecked source prevents a no-return conclusion.
    - id: channel
      label: Contact route for review
      type: select
      options:
        - value: approved
          label: Approved private receiving-desk channel
        - value: unverified
          label: Missing or unapproved channel
      defaultValue: unverified
      hint: No contact details are entered, and no message can be sent.
  checks:
    - id: assigned
      label: Coordinator assigned to item
      field: assignment
      operator: eq
      value: assigned
    - id: permitted
      label: Follow-up purpose permitted
      field: permission
      operator: eq
      value: true
    - id: open
      label: Open for follow-up
      field: status
      operator: eq
      value: open
    - id: inactive
      label: Paused or closed
      field: status
      operator: eq
      value: inactive
    - id: known-due
      label: Due day recorded
      field: due-day
      operator: present
    - id: known-review
      label: Review day recorded
      field: review-day
      operator: present
    - id: past-due
      label: Review day strictly after due day
      field: review-day
      operator: gt
      otherField: due-day
    - id: returned
      label: A return is documented
      field: returns
      operator: eq
      value: received
    - id: no-return
      label: Both sources checked with no return
      field: returns
      operator: eq
      value: none-verified
    - id: approved-channel
      label: Private channel approved
      field: channel
      operator: eq
      value: approved
  rules:
    - id: assignment-first
      label: Decline outside assigned scope
      all:
        - checkId: assigned
          equals: false
      outcomeId: withhold
    - id: permission-first
      label: Decline without purpose permission
      all:
        - checkId: permitted
          equals: false
      outcomeId: withhold
    - id: inactive-stop
      label: Exclude a paused or closed item
      all:
        - checkId: inactive
          equals: true
      outcomeId: not-active
    - id: return-found
      label: Stop the no-return workflow
      all:
        - checkId: open
          equals: true
        - checkId: returned
          equals: true
      outcomeId: return-recorded
    - id: within-window
      label: Do not draft on or before a known due day
      all:
        - checkId: open
          equals: true
        - checkId: known-due
          equals: true
        - checkId: known-review
          equals: true
        - checkId: past-due
          equals: false
      outcomeId: not-overdue
    - id: draft-only
      label: Prepare a minimum unsent enquiry
      all:
        - checkId: open
          equals: true
        - checkId: past-due
          equals: true
        - checkId: no-return
          equals: true
        - checkId: approved-channel
          equals: true
      outcomeId: review-contact
    - id: route-hold
      label: Do not improvise a contact route
      all:
        - checkId: open
          equals: true
        - checkId: past-due
          equals: true
        - checkId: no-return
          equals: true
        - checkId: approved-channel
          equals: false
      outcomeId: verify-route
    - id: reconcile
      label: Do not infer missing ledger evidence
      all: []
      outcomeId: reconcile-first
  outcomes:
    - id: withhold
      title: Outside the permitted coordination review
      summary: I cannot confirm whether a referral exists or disclose queue information for this request. No contact draft was prepared.
      documentIds:
        - minimum-contact-note
    - id: not-active
      title: Not an active follow-up item
      summary: The ledger marks this item paused or closed. Exclude it from routine no-return follow-up. No contact draft was prepared.
      documentIds:
        - return-reconciliation-sheet
    - id: return-recorded
      title: A return is present
      summary: An acknowledgement is recorded. This excludes the item from no-return follow-up; it does not establish that care is finished. No contact draft was prepared.
      documentIds:
        - return-reconciliation-sheet
    - id: not-overdue
      title: The response window has not passed
      summary: Review day {{review-day}} is on or before due day {{due-day}}. Due today does not mean overdue. No contact draft was prepared.
      documentIds:
        - return-reconciliation-sheet
    - id: review-contact
      title: "Overdue with no return: review the unsent wording"
      summary: Review day {{review-day}} is later than due day {{due-day}}. The referral remains open; both the intake log and the return tray were checked with no return. An approved private receiving-desk channel is recorded. Review the wording separately; no contact was sent.
      documentIds:
        - return-reconciliation-sheet
        - minimum-contact-note
      draft:
        title: Unsent question for coordinator review
        body: Could your desk confirm whether a response is available through the agreed referral channel?
    - id: verify-route
      title: An overdue item is not permission to use any route
      summary: The due day has passed and both sources show no return, but there is no approved private channel for the receiving desk. Verify the route separately; do not substitute another. No contact draft was prepared.
      documentIds:
        - return-reconciliation-sheet
        - minimum-contact-note
    - id: reconcile-first
      title: No established basis for contact
      summary: "The supplied ledger does not establish all the required facts: an open item, a known deadline already passed and no return in both checked sources. Reconcile the missing or conflicting evidence before considering contact. No contact draft was prepared."
      documentIds:
        - return-reconciliation-sheet
  cases:
    - id: past-due-no-return
      title: Prepare a review copy for an overdue unanswered referral
      inputs:
        assignment: assigned
        permission: true
        status: open
        due-day: 10
        review-day: 13
        returns: none-verified
        channel: approved
      expected:
        outcomeId: review-contact
        documentIds:
          - return-reconciliation-sheet
          - minimum-contact-note
        kind: answer
        contains:
          - Review day 13 is later than due day 10
          - Unsent question for coordinator review
          - Could your desk confirm whether a response is available through the agreed referral channel?
          - no contact was sent
    - id: due-today
      title: Stop on the last on-time day
      inputs:
        assignment: assigned
        permission: true
        status: open
        due-day: 10
        review-day: 10
        returns: none-verified
        channel: approved
      expected:
        outcomeId: not-overdue
        documentIds:
          - return-reconciliation-sheet
        kind: answer
        contains:
          - Due today does not mean overdue
          - No contact draft was prepared.
    - id: returned-after-deadline
      title: Exclude an item with a recorded acknowledgement
      inputs:
        assignment: assigned
        permission: true
        status: open
        due-day: 10
        review-day: 13
        returns: received
        channel: approved
      expected:
        outcomeId: return-recorded
        documentIds:
          - return-reconciliation-sheet
        kind: answer
        contains:
          - An acknowledgement is recorded
          - No contact draft was prepared.
    - id: unchecked-tray
      title: Do not infer no return from one empty source
      inputs:
        assignment: assigned
        permission: true
        status: open
        due-day: 10
        review-day: 13
        returns: incomplete
        channel: approved
      expected:
        outcomeId: reconcile-first
        documentIds:
          - return-reconciliation-sheet
        kind: answer
        contains:
          - Reconcile the missing or conflicting evidence
          - No contact draft was prepared.
    - id: missing-due-day
      title: Do not invent a deadline
      inputs:
        assignment: assigned
        permission: true
        status: open
        due-day: null
        review-day: 13
        returns: none-verified
        channel: approved
      expected:
        outcomeId: reconcile-first
        documentIds:
          - return-reconciliation-sheet
        kind: answer
        contains:
          - known deadline already passed
          - No contact draft was prepared.
    - id: paused-referral
      title: Exclude an inactive referral
      inputs:
        assignment: assigned
        permission: true
        status: inactive
        due-day: 10
        review-day: 13
        returns: none-verified
        channel: approved
      expected:
        outcomeId: not-active
        documentIds:
          - return-reconciliation-sheet
        kind: answer
        contains:
          - paused or closed
          - No contact draft was prepared.
    - id: unverified-route
      title: Hold contact without an approved route
      inputs:
        assignment: assigned
        permission: true
        status: open
        due-day: 10
        review-day: 13
        returns: none-verified
        channel: unverified
      expected:
        outcomeId: verify-route
        documentIds:
          - return-reconciliation-sheet
          - minimum-contact-note
        kind: answer
        contains:
          - do not substitute another
          - No contact draft was prepared.
    - id: wrong-assignment
      title: Decline someone outside the assigned review
      inputs:
        assignment: unassigned
        permission: true
        status: open
        due-day: 10
        review-day: 13
        returns: none-verified
        channel: approved
      expected:
        outcomeId: withhold
        documentIds:
          - minimum-contact-note
        kind: answer
        contains:
          - I cannot confirm whether a referral exists
          - No contact draft was prepared.
    - id: no-purpose-permission
      title: Decline an assigned role without permission
      inputs:
        assignment: assigned
        permission: false
        status: open
        due-day: 10
        review-day: 13
        returns: none-verified
        channel: approved
      expected:
        outcomeId: withhold
        documentIds:
          - minimum-contact-note
        kind: answer
        contains:
          - I cannot confirm whether a referral exists
          - No contact draft was prepared.
    - id: ledger-guide-removed
      title: Try drafting without the reconciliation guide
      inputs:
        assignment: assigned
        permission: true
        status: open
        due-day: 10
        review-day: 13
        returns: none-verified
        channel: approved
      expected:
        outcomeId: review-contact
        documentIds: []
        kind: missing-knowledge
        contains:
          - Run blocked
      disabledKnowledge:
        - return-reconciliation-sheet
implementation:
  - title: Build this in the real service
    description: Have the responsible coordination team define due-day conventions, what constitutes a return, permitted channels and who may review a draft. Exercise these rules with synthetic queue items before considering any operational design.
  - title: What to measure
    description: Count false overdue labels on the due day, drafts despite an unchecked return source, details copied unnecessarily into a draft and any contact implied to have been sent.
  - title: Scope of this draft
    description: No personal health identifiers, diagnosis, clinical prioritisation or contact sent. The reviewer alone decides what to do outside this exercise. This local exercise uses fictional evidence; it does not access a live system or make an official determination. The Microsoft Learn reference is about agent authoring, not municipal policy.
