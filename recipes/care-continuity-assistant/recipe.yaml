knowledge:
  - id: return-reconciliation-sheet
    title: How to reconcile the follow-up ledger
    summary: Start with the review assignment, then check whether the referral remains open for follow-up. A paused or closed item is not eligible for routine contact. Do not infer an assignment or due date from position in the queue.
    connectionId: evidence-library
    resourceId: alderfen-library
    file: documents/return-reconciliation-sheet.txt
  - id: minimum-contact-note
    title: Minimum wording for a contact review
    summary: Only the assigned exercise coordinator with permission for this purpose may review a particular queue item. Outside that scope, decline without confirming if a referral exists. Role and permission switches are training inputs, not evidence of identity or a live authorization check.
    connectionId: evidence-library
    resourceId: alderfen-library
    file: documents/minimum-contact-note.txt
facts:
  - id: due-rule
    documentId: return-reconciliation-sheet
    keywords:
      - Is a referral overdue on its recorded due day
    answer: No. The due day is the last on-time day. An open referral is past due only when the review day is later than its recorded due day.
    detail: Use the same clock for both fields. An absent deadline or review day is missing evidence; it is not permission to guess a date.
  - id: return-check
    documentId: return-reconciliation-sheet
    keywords:
      - How do I establish that no return was received
    answer: Reconcile both the intake log and the receiving desk’s return tray through the review cut-off. One blank or unchecked source does not establish no return.
    detail: A recorded acknowledgement in either source counts as a return for this review, not proof that care is finished. Do not draft a no-return enquiry for that item.
  - id: draft-contact
    documentId: minimum-contact-note
    keywords:
      - What belongs in a contact draft for coordinator review
    answer: For an eligible item with an approved private channel, write only a neutral question asking whether the receiving desk has a response. Label the question unsent.
    detail: Omit identifying and clinical details, case history and elapsed days. Do not infer a diagnosis, choose another contact route or send the review copy.
