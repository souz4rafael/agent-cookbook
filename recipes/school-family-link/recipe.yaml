lab:
  title: Build a confidential joint read-back
  description: Choose a simulated relationship first, then select a fictional family statement or pass. Change the confirmation to see why a proposal is not an agreement.
  fields:
    - id: relationship
      label: Simulated meeting relationship
      type: select
      options:
        - value: unverified
          label: Unverified or not a participant
        - value: carer
          label: Recorded carer matched to this meeting
        - value: link-worker
          label: School link worker assigned to this meeting
      defaultValue: unverified
      hint: Being at the school or knowing the family is insufficient.
    - id: use
      label: Use of the note
      type: select
      options:
        - value: review
          label: Private read-back
        - value: send
          label: Send a message
        - value: label
          label: Assign a student label
      defaultValue: review
      hint: The note is for participants to check together.
    - id: choice
      label: Fictional family choice
      type: select
      options:
        - value: pass
          label: I would rather not say
        - value: bus
          label: Our first bus gets us to the gate after it closes
        - value: starts
          label: The two school start times overlap on Tuesdays
      defaultValue: pass
      hint: These are optional role-play choices, not information about a real child.
    - id: agreement
      label: State of the read-back
      type: select
      options:
        - value: pending
          label: Terms not yet discussed
        - value: school-only
          label: Only the school confirmed
        - value: joint
          label: Both confirmed actions and check-in
        - value: withdrawn
          label: A participant withdrew agreement
      defaultValue: pending
      hint: Joint means both parties agreed to the same commitments and check-in.
  checks:
    - id: carer
      label: Family participant matched
      field: relationship
      operator: eq
      value: carer
    - id: worker
      label: Assigned meeting worker matched
      field: relationship
      operator: eq
      value: link-worker
    - id: private-use
      label: Private read-back requested
      field: use
      operator: eq
      value: review
    - id: withdrawn
      label: Confirmation withdrawn
      field: agreement
      operator: eq
      value: withdrawn
    - id: pass
      label: No statement chosen
      field: choice
      operator: eq
      value: pass
    - id: confirmed
      label: Both sides confirmed
      field: agreement
      operator: eq
      value: joint
    - id: first-card
      label: First trial card selected
      field: choice
      operator: eq
      value: bus
    - id: second-card
      label: Second trial card selected
      field: choice
      operator: eq
      value: starts
  rules:
    - id: gate
      label: Match a participant to the meeting first
      all:
        - checkId: carer
          equals: false
        - checkId: worker
          equals: false
      outcomeId: process-only
    - id: no-distribution
      label: Decline messaging or labelling
      all:
        - checkId: private-use
          equals: false
      outcomeId: private-only
    - id: stop-on-withdrawal
      label: Withhold a withdrawn read-back
      all:
        - checkId: withdrawn
          equals: true
      outcomeId: withdrawal
    - id: respect-pass
      label: Respect a choice not to share
      all:
        - checkId: pass
          equals: true
      outcomeId: not-shared
    - id: journey-trial
      label: Read the confirmed journey card
      all:
        - checkId: confirmed
          equals: true
        - checkId: first-card
          equals: true
      outcomeId: journey-plan
    - id: starts-trial
      label: Read the confirmed two-starts card
      all:
        - checkId: confirmed
          equals: true
        - checkId: second-card
          equals: true
      outcomeId: starts-plan
    - id: leave-pending
      label: Wait for both confirmations
      all: []
      outcomeId: proposal-only
  outcomes:
    - id: process-only
      title: General guidance only
      summary: I cannot confirm or discuss a record in this context. I can explain the general process.
      documentIds:
        - family-meeting-method
    - id: private-only
      title: Keep the conversation private
      summary: I cannot send a message or label a student. Keep any discussion within the matched meeting; no note is distributed.
      documentIds:
        - family-meeting-method
    - id: withdrawal
      title: Do not use a withdrawn agreement
      summary: A participant withdrew agreement. Withhold the commitments and check-in; do not circulate an earlier read-back.
      documentIds:
        - family-meeting-method
    - id: not-shared
      title: No explanation shared
      summary: The family chose not to share a barrier. Leave the reason blank and do not attach a trial plan to this choice.
      documentIds:
        - family-meeting-method
    - id: proposal-only
      title: No joint plan yet
      summary: The actions and check-in are not jointly confirmed. Invite both participants to review a proposal privately; leave commitments and the next check-in unset.
      documentIds:
        - family-meeting-method
    - id: journey-plan
      title: Confidential joint read-back
      summary: "The family explained, “Our first bus gets us to the gate after it closes.” Both sides agreed to try a change: the family will try the library-stop bus on Wednesday and Thursday; the school will have the welcome lead meet them at the side entrance. Next private check-in: 20 November 2026 at 08:40. No message is sent."
      documentIds:
        - journey-meeting-card
        - family-meeting-method
    - id: starts-plan
      title: Confidential joint read-back
      summary: "The family explained, “The two school start times overlap on Tuesdays.” Both sides agreed: the school will open the breakfast room from 08:15 on Tuesday, and the family will try the earlier drop-off once. Next private check-in: 19 November 2026 at 15:20. No message is sent."
      documentIds:
        - two-starts-meeting-card
        - family-meeting-method
  cases:
    - id: journey-readback
      title: Read a two-sided trial agreement
      inputs:
        relationship: carer
        use: review
        choice: bus
        agreement: joint
      expected:
        outcomeId: journey-plan
        documentIds:
          - journey-meeting-card
          - family-meeting-method
        kind: answer
        contains:
          - Our first bus
          - library-stop bus
          - side entrance
          - 20 November 2026 at 08:40
          - No message is sent.
    - id: only-school
      title: Keep the same choice but change who agreed
      inputs:
        relationship: carer
        use: review
        choice: bus
        agreement: school-only
      expected:
        outcomeId: proposal-only
        documentIds:
          - family-meeting-method
        kind: answer
        contains:
          - not jointly confirmed
          - next check-in unset
    - id: card-off
      title: Disconnect the matching choice card
      inputs:
        relationship: carer
        use: review
        choice: bus
        agreement: joint
      expected:
        outcomeId: journey-plan
        documentIds: []
        kind: missing-knowledge
        contains:
          - Run blocked
          - No draft or action was produced.
      disabledKnowledge:
        - journey-meeting-card
    - id: second-choice
      title: Change only the family’s explanation
      inputs:
        relationship: carer
        use: review
        choice: starts
        agreement: joint
      expected:
        outcomeId: starts-plan
        documentIds:
          - two-starts-meeting-card
          - family-meeting-method
        kind: answer
        contains:
          - two school start times overlap
          - breakfast room from 08:15
          - earlier drop-off once
          - 19 November 2026 at 15:20
    - id: pass-choice
      title: Choose not to share an explanation
      inputs:
        relationship: carer
        use: review
        choice: pass
        agreement: joint
      expected:
        outcomeId: not-shared
        documentIds:
          - family-meeting-method
        kind: answer
        contains:
          - Leave the reason blank
    - id: withdrawn
      title: Withdraw the read-back
      inputs:
        relationship: carer
        use: review
        choice: bus
        agreement: withdrawn
      expected:
        outcomeId: withdrawal
        documentIds:
          - family-meeting-method
        kind: answer
        contains:
          - Withhold the commitments and check-in
    - id: not-a-participant
      title: Try without a matched participant
      inputs:
        relationship: unverified
        use: review
        choice: bus
        agreement: joint
      expected:
        outcomeId: process-only
        documentIds:
          - family-meeting-method
        kind: answer
        contains:
          - I cannot confirm or discuss a record in this context. I can explain the general process.
    - id: assigned-worker
      title: Read back as the assigned link worker
      inputs:
        relationship: link-worker
        use: review
        choice: bus
        agreement: joint
      expected:
        outcomeId: journey-plan
        documentIds:
          - journey-meeting-card
          - family-meeting-method
        kind: answer
        contains:
          - Both sides agreed
          - Next private check-in
    - id: dont-send
      title: Ask to send the note
      inputs:
        relationship: carer
        use: send
        choice: bus
        agreement: joint
      expected:
        outcomeId: private-only
        documentIds:
          - family-meeting-method
        kind: answer
        contains:
          - I cannot send a message or label a student
    - id: dont-label
      title: Ask for a student label
      inputs:
        relationship: carer
        use: label
        choice: bus
        agreement: joint
      expected:
        outcomeId: private-only
        documentIds:
          - family-meeting-method
        kind: answer
        contains:
          - no note is distributed
implementation:
  - title: Build this in the real service
    description: A school would need verified meeting participants, narrowly scoped access, an agreed purpose and retention period, and a way for the family to correct or withdraw the note. This selector cannot authenticate a carer, and this draft has no messaging or register connection.
  - title: What to measure
    description: "Potential indicator: percentage of sampled agreed notes in which both sides recognise their own commitment and the same dated check-in. Review pending or declined notes separately for invented commitments; do not use attendance change as proof of causation."
  - title: Scope of this draft
    description: A confidential meeting draft is not a message, attendance decision or student label. Nothing is sent, and the exercise does not verify a family relationship. This local exercise uses fictional evidence; it does not access a live system or make an official determination. The Microsoft Learn reference is about agent authoring, not municipal policy.
