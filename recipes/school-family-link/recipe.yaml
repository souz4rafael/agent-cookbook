facts:
  - id: hear-family
    documentId: family-meeting-method
    keywords:
      - How do we ask about an attendance barrier without assuming a cause
    answer: Invite the family to give its own explanation or to pass. Use their words and keep the register observation separate; it does not tell you why the morning was difficult.
    detail: If a family prefers not to share, record that no explanation was shared. Do not ask for identifying details, add a label or turn silence into a reason.
  - id: check-together
    documentId: family-meeting-method
    keywords:
      - When can a proposed attendance plan be called jointly agreed
    answer: Read back what the family will try, what the school will do and when both will check in. Call it agreed only if both participants confirm those same terms.
    detail: If only one side confirms, keep it as a proposal. A private read-back is not permission to send a message or share a record outside the meeting.
