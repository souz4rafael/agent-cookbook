implementation:
  - title: Build this in the real service
    description: Before any real process study, agree the unit, event definitions, clock, intake windows and completion cutoff. Verify coverage and matched work types. Compare process-level outcomes only and design a separate evaluation to test a causal hypothesis.
  - title: What to measure
    description: Report affected jobs / matched jobs and total intake-to-release days / matched jobs, with units and both periods. State which packet was used and why any pair was excluded. Do not use staff, demographic or resident-level measures.
  - title: Scope of this draft
    description: Compare only fictional process steps. Do not profile or rank a person or group, access operational logs, infer causation or claim an actual measured improvement. This local exercise uses fictional evidence; it does not access a live system or make an official determination. The Microsoft Learn reference is about agent authoring, not municipal policy.
