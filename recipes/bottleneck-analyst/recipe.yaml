lab:
  title: Audit the paper replays
  description: Hand-count the affected jobs and elapsed job-days in the before register and ONE after packet. Enter the four totals; leave an unknown total blank. The lab checks the entries and compares them only for a complete matching cohort. It does not read or aggregate logs.
  fields:
    - id: packet
      label: After packet to compare
      type: select
      options:
        - value: copy
          label: "Copy: carry the seal forward"
        - value: plain
          label: "Plain: replay the old slip"
        - value: mixed
          label: "Mixed stock: replace one job"
        - value: two
          label: "Two pairs: partial registers"
        - value: torn
          label: "Torn slip: no final stamp"
      defaultValue: copy
      hint: All after packets use days 11–20. The before period is days 1–10. Each exception packet is described in the after register.
    - id: lens
      label: Subject of the comparison
      type: select
      options:
        - value: process
          label: The desk-to-desk workflow
        - value: profile
          label: A person or group
      defaultValue: process
      hint: Only the process is in scope. Do not enter personal data.
    - id: before-loops
      label: "Before: jobs returned for the edition seal"
      type: number
      defaultValue: 3
      min: 0
      max: 4
      hint: Manually count distinct jobs with the named return, not the number of transfers.
    - id: after-loops
      label: "After: jobs returned for the edition seal"
      type: number
      defaultValue: 1
      min: 0
      max: 4
      hint: Tally the selected packet only.
    - id: before-days
      label: "Before: sum of elapsed job-days"
      type: number
      defaultValue: 18
      min: 0
      max: 36
      hint: For each paired job subtract the intake day from the release day, then add.
    - id: after-days
      label: "After: sum of elapsed job-days"
      type: number
      defaultValue: 14
      min: 0
      max: 36
      hint: Do not average before entering. Clear the total if a required endpoint is unknown.
  checks:
    - id: out-of-scope
      label: A profile was requested
      field: lens
      operator: eq
      value: profile
    - id: mixed-packet
      label: "Selected packet: mixed"
      field: packet
      operator: eq
      value: mixed
    - id: two-packet
      label: "Selected packet: two"
      field: packet
      operator: eq
      value: two
    - id: torn-packet
      label: "Selected packet: torn"
      field: packet
      operator: eq
      value: torn
    - id: copy-packet
      label: "Selected packet: copy"
      field: packet
      operator: eq
      value: copy
    - id: plain-packet
      label: "Selected packet: plain"
      field: packet
      operator: eq
      value: plain
    - id: have-before-loops
      label: "A hand total is present: before-loops"
      field: before-loops
      operator: present
    - id: have-after-loops
      label: "A hand total is present: after-loops"
      field: after-loops
      operator: present
    - id: have-before-days
      label: "A hand total is present: before-days"
      field: before-days
      operator: present
    - id: have-after-days
      label: "A hand total is present: after-days"
      field: after-days
      operator: present
    - id: base-three
      label: Before return tally agrees with A, B and C
      field: before-loops
      operator: eq
      value: 3
    - id: base-eighteen
      label: Before elapsed tally agrees with all four slips
      field: before-days
      operator: eq
      value: 18
    - id: copy-one
      label: Copy return tally agrees with C only
      field: after-loops
      operator: eq
      value: 1
    - id: copy-fourteen
      label: Copy elapsed tally agrees with its four slips
      field: after-days
      operator: eq
      value: 14
    - id: plain-three
      label: Plain return tally agrees with A, B and C
      field: after-loops
      operator: eq
      value: 3
    - id: plain-eighteen
      label: Plain elapsed tally agrees with its four slips
      field: after-days
      operator: eq
      value: 18
    - id: fewer-returns
      label: Fewer affected jobs at the same denominator
      field: after-loops
      operator: lt
      otherField: before-loops
    - id: less-time
      label: Lower elapsed total at the same denominator
      field: after-days
      operator: lt
      otherField: before-days
    - id: same-returns
      label: Same affected-job tally
      field: after-loops
      operator: eq
      otherField: before-loops
    - id: same-time
      label: Same elapsed total
      field: after-days
      operator: eq
      otherField: before-days
  rules:
    - id: process-only
      label: Do not profile a person or group
      all:
        - checkId: out-of-scope
          equals: true
      outcomeId: no-profile
    - id: match-stock
      label: Require the same work type and paired templates
      all:
        - checkId: mixed-packet
          equals: true
      outcomeId: unmatched
    - id: minimum-pairs
      label: Check for all four pairs
      all:
        - checkId: two-packet
          equals: true
      outcomeId: too-thin
    - id: require-release
      label: A missing release stamp cannot end the clock
      all:
        - checkId: torn-packet
          equals: true
      outcomeId: missing-endpoint
    - id: need-entries
      label: Blank worksheet cells are not zero
      all: []
      outcomeId: missing-total
      any:
        - checkId: have-before-loops
          equals: false
        - checkId: have-after-loops
          equals: false
        - checkId: have-before-days
          equals: false
        - checkId: have-after-days
          equals: false
    - id: audit-copy
      label: Match the Copy slips, then compare both totals
      all:
        - checkId: copy-packet
          equals: true
        - checkId: base-three
          equals: true
        - checkId: base-eighteen
          equals: true
        - checkId: copy-one
          equals: true
        - checkId: copy-fourteen
          equals: true
        - checkId: fewer-returns
          equals: true
        - checkId: less-time
          equals: true
      outcomeId: copy-comparison
    - id: audit-plain
      label: Match the Plain slips, then compare both totals
      all:
        - checkId: plain-packet
          equals: true
        - checkId: base-three
          equals: true
        - checkId: base-eighteen
          equals: true
        - checkId: plain-three
          equals: true
        - checkId: plain-eighteen
          equals: true
        - checkId: same-returns
          equals: true
        - checkId: same-time
          equals: true
      outcomeId: plain-comparison
    - id: recount
      label: Withhold an interpretation when the manual totals disagree with the slips
      all: []
      outcomeId: audit-again
  outcomes:
    - id: copy-comparison
      title: "Copy packet: fewer repeat requests and a shorter mean"
      summary: "The same four standard jobs ran in days 1–10 and 11–20. Before, Print sent A, B and C back to Intake for the already accepted edition seal: the slip’s seal box was blank. After, only C came back for it. Affected jobs: {{before-loops}}/4 = 75% before; {{after-loops}}/4 = 25% after (50 percentage points lower). Mean intake-to-release: {{before-days}}/4 = 4.5 days before; {{after-days}}/4 = 3.5 days after (1 day shorter). These hand counts describe the fictional Copy replay. They do not establish causation or measure a real improvement."
      documentIds:
        - before-desk-register
        - after-desk-register
        - paired-counting-sheet
    - id: plain-comparison
      title: "Plain packet: both measures unchanged"
      summary: "Same four jobs, same old form, same clock. The edition-seal loop affects A, B and C in each window: {{before-loops}}/4 = 75% before and {{after-loops}}/4 = 75% after (0 percentage-point difference). Mean duration is {{before-days}}/4 = 4.5 days before and {{after-days}}/4 = 4.5 days after (0 days difference). These are hand counts of the Plain replay, not operating results."
      documentIds:
        - before-desk-register
        - after-desk-register
        - paired-counting-sheet
    - id: unmatched
      title: Four jobs does not mean four pairs
      summary: The after packet replaces standard template D with oversize foldout X. Equal totals or equal window lengths do not fix a changed cohort. Restore a comparable D run before reporting a paired difference.
      documentIds:
        - before-desk-register
        - after-desk-register
        - paired-counting-sheet
    - id: too-thin
      title: Only two paired histories
      summary: Only A and B can be followed in both periods (2 of 4 required pairs). Keep their slips, but do not present a full-cohort rate or mean. The minimum is a worksheet rule, not a claim of statistical significance.
      documentIds:
        - before-desk-register
        - after-desk-register
        - paired-counting-sheet
    - id: missing-endpoint
      title: A clock has no endpoint
      summary: C’s after slip stops at Print receipt on day 16, not release. A return can still be identified, but the complete four-job duration cannot be computed. Withhold the two-measure comparison; do not impute zero or drop C.
      documentIds:
        - before-desk-register
        - after-desk-register
        - paired-counting-sheet
    - id: missing-total
      title: A hand total is missing
      summary: At least one worksheet total is blank. Read the slips and supply the count or elapsed sum if known; a blank is not a zero. There is no calculated comparison.
      documentIds:
        - paired-counting-sheet
    - id: audit-again
      title: Recount the selected paper packet
      summary: The entered hand totals do not match the selected slips. Mark each affected job once, sum release day minus intake day per job, and use only the named after packet. Do not interpret a difference until the audit agrees.
      documentIds:
        - before-desk-register
        - after-desk-register
        - paired-counting-sheet
    - id: no-profile
      title: Process analysis only
      summary: These exercise sheets describe a workflow, not people. No person or group profile, ranking or performance inference is produced.
      documentIds:
        - paired-counting-sheet
  cases:
    - id: paired-copy
      title: Compare the four paired Copy slips
      inputs:
        lens: process
        packet: copy
        before-loops: 3
        after-loops: 1
        before-days: 18
        after-days: 14
      expected:
        outcomeId: copy-comparison
        documentIds:
          - before-desk-register
          - after-desk-register
          - paired-counting-sheet
        kind: answer
        contains:
          - 3/4 = 75%
          - 1/4 = 25%
          - 18/4 = 4.5 days
          - 14/4 = 3.5 days
          - seal box was blank
          - do not establish causation
    - id: paired-plain
      title: Check the old form against its unchanged replay
      inputs:
        lens: process
        packet: plain
        before-loops: 3
        after-loops: 3
        before-days: 18
        after-days: 18
      expected:
        outcomeId: plain-comparison
        documentIds:
          - before-desk-register
          - after-desk-register
          - paired-counting-sheet
        kind: answer
        contains:
          - both measures unchanged
          - 0 percentage-point difference
          - 0 days difference
    - id: mixed-stock
      title: Four after jobs, but the fourth is different
      inputs:
        lens: process
        packet: mixed
        before-loops: 3
        after-loops: 1
        before-days: 18
        after-days: 14
      expected:
        outcomeId: unmatched
        documentIds:
          - before-desk-register
          - after-desk-register
          - paired-counting-sheet
        kind: answer
        contains:
          - replaces standard template D with oversize foldout X
    - id: thin-packet
      title: Two complete pairs are not the whole cohort
      inputs:
        lens: process
        packet: two
        before-loops: 2
        after-loops: 0
        before-days: 11
        after-days: 7
      expected:
        outcomeId: too-thin
        documentIds:
          - before-desk-register
          - after-desk-register
          - paired-counting-sheet
        kind: answer
        contains:
          - 2 of 4 required pairs
          - do not present a full-cohort rate
    - id: torn-stamp
      title: Find the missing release stamp
      inputs:
        lens: process
        packet: torn
        before-loops: 3
        after-loops: 1
        before-days: 18
        after-days: null
      expected:
