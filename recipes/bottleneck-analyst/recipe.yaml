knowledge:
  - id: before-desk-register
    title: "Before register: the edition-seal return"
    summary: Window one covers exercise days 1–10 inclusive. A, B, C and D are four dummy, standard single-sheet map reprint templates. Each visits Intake and then Print. These are job shapes, not resident identifiers. Each “release” below ends that job’s clock.
    connectionId: evidence-library
    resourceId: alderfen-library
    file: documents/before-desk-register.txt
  - id: after-desk-register
    title: "After register: alternative paper packets"
    summary: Window two covers exercise days 11–20 inclusive. Use ONE packet with the before register, never both after packets together. Copy and Plain replay the same four standard single-sheet templates A–D. Copy tests a slip that carries the accepted edition seal forward. Plain is an alternative fictional run of the old form.
    connectionId: evidence-library
    resourceId: alderfen-library
    file: documents/after-desk-register.txt
  - id: paired-counting-sheet
    title: "Counting sheet: pair first, then divide"
    summary: "Unit: one standard single-sheet reprint template run once in each period. Pair A with A, B with B, C with C, and D with D. Include arrivals in days 1–10 before and 11–20 after, each observed through the end of its own ten-day window. To compare both measures this classroom exercise requires all four pairs, no work-type substitutions and a release for each job. Four pairs is a teaching rule, not a statistical significance threshold."
    connectionId: evidence-library
    resourceId: alderfen-library
    file: documents/paired-counting-sheet.txt
facts:
  - id: trace-return
    documentId: before-desk-register
    keywords:
      - Why did Print ask for the edition seal again
    answer: Intake had accepted the edition seal on job A on day 1. On day 2 Print saw a blank seal box on its own slip and returned the job to Intake for the same seal. The requirement was repeated because the acceptance did not travel with the packet.
    detail: On day 3 Intake copied the same seal and on day 4 Print received it. Count one affected job, not two handoffs or two approvals. The before register also shows job D reaching release without this return.
  - id: paired-result
    documentId: paired-counting-sheet
    keywords:
      - How do the four paired reprints compare
    answer: In the fictional Copy replay, jobs returned for the edition seal went from 3/4 (75%) to 1/4 (25%). Mean intake-to-release time went from 18/4 = 4.5 days to 14/4 = 3.5 days. These are manual totals from two sets of four paired paper histories.
    detail: The difference is 50 percentage points fewer affected jobs and one day less in the mean for these scripted replays. The figures are an association, not proof the form caused the change or that any actual service improved.
  - id: check-coverage
    documentId: paired-counting-sheet
    keywords:
      - Can a missing release stamp count as zero days
    answer: No. Without a release stamp the endpoint is unknown, even if the job reached Print. Withhold the full comparison rather than setting a duration to zero or silently dropping a job.
    detail: "In Review > Try this example, compare Torn slip with Two pairs: the first lacks an endpoint for a named pair; the second has only two complete pairs. Neither supplies the four complete pairs required by this worksheet."
