schemaVersion: 1
revision: 1
id: school-counsellor-assistant
status: published
title: School Counsellor Assistant
summary: Review the entries behind an attendance alert, list what is still unknown and add a follow-up owner and date only from an agreed review note.
industry: Government and public services
difficulty: intermediate
accentIcon: learning
learningGoals:
  - Report what the signed morning session marks establish and identify the missing student account separately.
  - Compare an unsigned session line with a later signed correction and explain what each does to the two-entry alert.
  - Use the agreement linked to the reconciled extract to record an owner role and date; leave both unset for an offer or a superseded alert.
sourceUrl: https://learn.microsoft.com/en-us/microsoft-copilot-studio/authoring-instructions
scenario:
  group:
    journey: School attendance and engagement
    perspective: operations
  headline: Check the two mornings behind the alert before planning a support conversation.
  problem: A counsellor sees a two-entry attendance alert. One version of the register lacks the signed sheet for the second morning; a later correction marks that student present that morning. Even two confirmed morning marks would not explain what happened during the rest of either day.
  impact: A support conversation can start from a tally the school itself has corrected. Carrying a date from the old review into the new note can also make it look as though the student and carer agreed to an arrangement nobody discussed with them.
  approach: Have the assigned counsellor read the selected register version at session level. State which marks are supported, what changed and whose account is missing. Only the reconciled two-entry version has a matching agreement card; use its owner role and date only when the participants have confirmed both.
  startSmall: Compare the reconciled extract with a meeting offer and then with confirmed terms. Keep confirmation selected and switch to the signed correction for 8 October; the second mark changes to present and the old follow-up drops out.
  potentialValue: A counsellor could open a discussion with the right dates and an honest question for the student, rather than asking them to explain a mark that no longer stands.
  measure: Compare notes against the signed version. Count stale alerts repeated, unrecorded reasons presented as facts and follow-up dates carried over without a matching agreement.
  boundary: The exercise shows a confidential note for a simulated assigned counsellor, not a live student alert. The student’s account is theirs to give. The note does not predict attendance, assign risk or discipline, edit the register or book a meeting.
  sourceLabel: Microsoft Learn authoring reference for Copilot Studio agent instructions
  home:
    challenge: A two-morning alert and its follow-up can outlive the register entry that prompted them.
    experiment: Keep the agreement confirmed but apply the 8 October correction to see why the owner and date disappear.
    takeaway: A signed mark establishes a session entry, not its cause, and a follow-up agreement belongs to the version it cites.
    scope: Review fictional extracts and an agreement card without scoring a student, editing attendance or booking a meeting.
agent:
  name: School Counsellor Assistant
  description: Help the assigned Alderfen school counsellor prepare an evidence note. An alert opens a question about the register, not a conclusion about a student.
  instructions: |-
    # Purpose and operating boundaries

    Help the assigned Alderfen school counsellor prepare an evidence note. An alert opens a question about the register, not a conclusion about a student.
    Explain only the review process in chat. Require the simulated counsellor assigned to this review before showing even a single attendance entry; deny other roles without confirming or denying that a student has an alert.
    Check session dates against the signed register and its amendment status. State what the entries actually show, what changed, and which information is still missing. A register mark does not supply a reason.
    Separate agreement to meet from confirmation of the register or agreement about a cause. Record a named professional role as owner and a follow-up date only when the participants have confirmed those terms. Otherwise leave both unset.
    Use minimal factual language. Do not predict attendance, infer motives, rank risk, label a student, recommend discipline or issue sanctions.
    No prediction, student label, risk score, sanction, register edit or appointment booking. This is a confidential draft for human review.
  tone: friendly
  detail: concise
