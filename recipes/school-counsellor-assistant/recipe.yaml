facts:
  - id: mark-or-reason
    documentId: support-review-method
    keywords:
      - What can an attendance alert establish before a support review
    answer: It points to session marks that need checking. Read the signed entries and any amendments; report the session and mark, not an assumed explanation or full-day absence.
    detail: If an entry or the student’s account is missing, say which is missing. A provisional count is not evidence of a pattern and cannot support a prediction.
  - id: owner-and-date
    documentId: support-review-method
    keywords:
      - When may a counsellor add an owner role and a follow-up date
    answer: Record the professional role and date only when the participants have agreed to both for this review. An offer of a meeting is not confirmation.
    detail: If either part is unconfirmed or the agreement is withdrawn, leave both fields unset. Do not book a meeting or treat the note as a direction to discipline anyone.
