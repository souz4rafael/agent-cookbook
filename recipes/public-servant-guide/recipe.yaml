facts:
  - id: documents
    documentId: welcome-sheet
    keywords:
      - Where do I start reading on my first day
    answer: Ask the induction host for the welcome sheet and handling note in a format you can use. Read both before the supervised counter exercise.
    detail: Teams may be referenced as a way a host could distribute an approved welcome link. This exercise neither sends a message nor reads attendance or staff status.
  - id: index
    documentId: reading-room-card
    keywords:
      - What if the practice index will not open
    answer: Try the synthetic practice index with the host using your own training account. For unresolved access, use the service desk and continue with supervised orientation.
    detail: A colleague’s sign-in is not a workaround. Do not share credentials, seek live collection access or treat an access problem as a performance finding.
  - id: training
    documentId: reading-room-card
    keywords:
      - Does a reserved walk-through count as completed training
    answer: No. A reservation is a place to attend the handling walk-through, not proof of attendance. The room mentor owns that check.
    detail: Keep the item pending until the mentor can confirm completion. If no place is reserved, ask the mentor to arrange one.
