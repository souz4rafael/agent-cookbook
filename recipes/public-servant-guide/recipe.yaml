id: public-servant-guide
status: published
title: Public servant first-day guide
summary: A new reading-room assistant starts a first shift with a welcome pack, a practice index and a handling walk-through. Build a checklist that gives each pending item an owner.
industry: Government and public services
difficulty: beginner
accentIcon: learning
learningGoals:
  - Use the welcome sheet to explain the public first-day sequence. Switch the sample card to a colleague’s checklist and identify what must stay private.
  - Keep the mentor reservation fixed and change practice-index access from pending to tested. Explain why the next activity changes but the walk-through is still outstanding.
  - Match every open item to its owner for follow-up. Take a fully confirmed practice card to the host rather than treating it as clearance for independent work.
sourceUrl: https://learn.microsoft.com/en-us/microsoft-copilot-studio/authoring-instructions
scenario:
  group:
    journey: The public servant journey
    perspective: guidance
  headline: The walk-through is booked, but the practice index won’t open. What can a starter do now?
  problem: A new reading-room assistant has read the welcome sheet and handling note and reserved a place with the mentor. Their practice index is still unavailable. The invitation tells them when to attend, not how to spend the shift while they wait.
  impact: Waiting for access can mean missing supervised orientation that is available now. Treating the reservation as attendance can also hide a handling exercise the starter still needs.
  approach: Use the welcome sheet for general directions and the starter’s own fictional card for the checklist. While the index is pending, continue orientation with the host and take the access question to the service desk. Keep the mentor session on the list until the mentor confirms completion.
  startSmall: Start with both documents read, the index pending and the walk-through reserved. Change only the index entry to tested. Compare the recommended activity and name the person responsible for the item that is still open.
  potentialValue: The starter can keep learning without borrowing a sign-in. An explicit owner for each outstanding item gives the host more to work with at the end of the shift than a single “not ready” label.
  measure: On a card with all three items pending, look for three owners, not just the first blocker. The host handles the reading, the service desk handles index access and the mentor handles the walk-through. Check that an unclear entry stays open.
  boundary: The self-only setting is a teaching control; a colleague’s card yields general directions only. No staff records, sign-ins or Teams messages are accessed or changed. Even a completed sample card goes to the host, not straight to unsupervised work.
  sourceLabel: "Microsoft Learn: authoring instructions in Copilot Studio (product reference)"
  home:
    challenge: A first-day reading-room assistant has a mentor booking but no working practice index. What can they do while the service desk checks access?
    experiment: Keep the readings complete and the mentor place reserved. Switch the index from pending to tested and compare the next activity and the remaining checklist.
    takeaway: With the index pending, supervised orientation can go ahead. Once access is tested, attend the booked walk-through; the booking is not proof of completion.
    scope: Only the starter’s own fictional checklist is in scope. Even a completed card goes to the host for wrap-up, not to a personnel system for clearance.
agent:
  name: Public servant first-day guide
  description: Help a new public servant plan a first day at the fictional Alderfen reading room. Show general induction directions in chat and personal checklist examples only in the scoped lab.
  instructions: |-
    # Purpose and operating boundaries

    Help a new public servant plan a first day at the fictional Alderfen reading room. Show general induction directions in chat and personal checklist examples only in the scoped lab.
    Start with the welcome sheet and the handling note, then a test of the practice index under the starter’s own training account, then the mentor-led walk-through. Distinguish reserved training from completed training.
    For a personal checklist require simulated identity and own-induction scope. Never read a colleague’s status. Give an owner and next step for every pending item, not just the first blocker.
    Teams is a possible delivery reference for an approved welcome link. Do not claim a Teams post, grant access, request credentials, record attendance or mark a starter ready for unsupervised work.
    Offer induction guidance, not personnel decisions. Do not expose another starter’s checklist, provision access, update training records or send a Teams message.
  tone: friendly
  detail: concise
