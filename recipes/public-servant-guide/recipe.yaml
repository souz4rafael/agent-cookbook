lab:
  title: Build a first-shift checklist
  description: Inspect the starter’s own fictional card. The headline identifies the next safe activity; the list underneath retains every pending item and its owner.
  fields:
    - id: view
      label: Simulated identity and checklist scope
      type: select
      options:
        - value: self
          label: Verified starter, own induction checklist only
        - value: colleague
          label: Another starter’s checklist
        - value: unknown
          label: Identity or scope unknown
      defaultValue: self
      hint: This selector represents scope in a fixture. It does not access a personnel system.
    - id: documents
      label: Welcome sheet and handling note
      type: select
      options:
        - value: read
          label: Both read
        - value: pending
          label: At least one still to read
        - value: unknown
          label: Reading entry unclear
      defaultValue: read
      hint: The induction host owns both documents.
    - id: access
      label: Practice index access
      type: select
      options:
        - value: tested
          label: Own training sign-in tested successfully
        - value: pending
          label: Own access pending
        - value: unknown
          label: Test result unclear
      defaultValue: pending
      hint: A welcome link neither provisions access nor proves it works.
    - id: training
      label: Handling walk-through
      type: select
      options:
        - value: complete
          label: Mentor confirmed completion
        - value: reserved
          label: Place reserved only
        - value: unbooked
          label: No place arranged
        - value: unknown
          label: Training entry unclear
      defaultValue: reserved
      hint: Do not treat a reservation as attendance.
  checks:
    - id: own-card
      label: Verified self-only scope
      field: view
      operator: eq
      value: self
    - id: read
      label: Both documents read
      field: documents
      operator: eq
      value: read
    - id: tested
      label: Own index access tested
      field: access
      operator: eq
      value: tested
    - id: in-queue
      label: Access explicitly pending
      field: access
      operator: eq
      value: pending
    - id: course-done
      label: Mentor confirmed walk-through
      field: training
      operator: eq
      value: complete
    - id: reserved
      label: Place reserved only
      field: training
      operator: eq
      value: reserved
    - id: unbooked
      label: No place reserved
      field: training
      operator: eq
      value: unbooked
    - id: course-unknown
      label: Training entry unknown
      field: training
      operator: eq
      value: unknown
    - id: reading-pending
      label: Reading pending
      field: documents
      operator: eq
      value: pending
  rules:
    - id: self-scope
      label: Check self-only scope first
      all:
        - checkId: own-card
          equals: false
      outcomeId: no-checklist
    - id: wrap
      label: All three items confirmed
      all:
        - checkId: read
          equals: true
        - checkId: tested
          equals: true
        - checkId: course-done
          equals: true
      outcomeId: host-wrap
    - id: index-wait
      label: Use a supervised alternative while access is pending
      all:
        - checkId: in-queue
          equals: true
      outcomeId: orientation
    - id: reading-first
      label: Host supplies the remaining reading
      all:
        - checkId: reading-pending
          equals: true
      outcomeId: read-pack
    - id: next-session
      label: Confirmed documents and access; reservation only
      all:
        - checkId: read
          equals: true
        - checkId: tested
          equals: true
        - checkId: reserved
          equals: true
      outcomeId: attend
    - id: arrange-session
      label: Confirmed documents and access; no reservation
      all:
        - checkId: read
          equals: true
        - checkId: tested
          equals: true
        - checkId: unbooked
          equals: true
      outcomeId: arrange
    - id: verify-items
      label: Unknown entries stay open
      all: []
      outcomeId: verify-checklist
  outcomes:
    - id: no-checklist
      title: Use general induction guidance
      summary: Self-only scope is required. No personal checklist information can be provided.
      documentIds:
        - welcome-sheet
    - id: host-wrap
      title: Take the completed practice card to the host
      summary: Both documents, the practice-index test and the walk-through are confirmed on this sample card. No pending items are shown. Ask the host for the first-day wrap-up; this is not clearance to work independently.
      documentIds:
        - welcome-sheet
        - reading-room-card
    - id: orientation
      title: Continue supervised orientation
      summary: The practice index is pending. Do not use a shared account. Continue the host-led orientation away from the index and keep the following items open.
      documentIds:
        - welcome-sheet
        - reading-room-card
      recommendations:
        - when:
            checkId: read
            equals: false
          title: Documents | induction host
          description: Find the welcome sheet and handling note; ask for an accessible copy or confirm the reading entry with the host.
        - when:
            checkId: tested
            equals: false
          title: Access | service desk
          description: Check the practice index with your own training account and the host. Do not borrow a sign-in or send credentials.
        - when:
            checkId: reserved
            equals: true
          title: Training | room mentor
          description: Attend the reserved handling walk-through. A reserved place is not a completion.
        - when:
            checkId: unbooked
            equals: true
          title: Training | room mentor
          description: Ask the mentor to arrange the handling walk-through.
        - when:
            checkId: course-unknown
            equals: true
          title: Training | room mentor
          description: Confirm the training entry; do not mark attendance from a calendar invitation.
    - id: read-pack
      title: Start with the two-document pack
      summary: Ask the host for the outstanding reading before the supervised counter exercise. Carry forward the other open items below.
      documentIds:
        - welcome-sheet
