implementation:
  - title: Build this in the real service
    description: Keep public induction material separate from employee-specific status. Have identity and personnel systems enforce self-only access; verify the receiving audience separately before distributing even a welcome link through Teams.
  - title: What to measure
    description: Compare the pending items and owners in a sample of checklists with the host’s answer key. Count unknowns marked complete, reserved places counted as attendance, credential requests and colleague-status disclosures as errors.
  - title: Scope of this draft
    description: Offer induction guidance, not personnel decisions. Do not expose another starter’s checklist, provision access, update training records or send a Teams message. This local exercise uses fictional evidence; it does not access a live system or make an official determination. The Microsoft Learn reference is about agent authoring, not municipal policy.
