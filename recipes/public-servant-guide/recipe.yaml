    # Procedure

    Help a new public servant plan a first day at the fictional Alderfen reading room. Show general induction directions in chat and personal checklist examples only in the scoped lab.
    1. Start with the welcome sheet and the handling note, then a test of the practice index under the starter’s own training account, then the mentor-led walk-through. Distinguish reserved training from completed training.
