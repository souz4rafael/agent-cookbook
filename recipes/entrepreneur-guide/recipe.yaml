    title: Produce an ordered route
    description: In Review, open Try this example and run Mill Lane with no drawing. Which step must happen before the inspection team gets involved?
    tab: activity
    completeWhen: { type: case-tested, caseId: mill-needs-plan }
  - id: read-evidence
    title: Check the zoning evidence
    description: Open the ML-14 citation on the lab result in Preview. Find the sentence that distinguishes permission to apply from permission to open.
    tab: activity
    completeWhen: { type: citation-opened, documentId: mill-lane }
  - id: run-wharf
    title: Change just the premises
    description: Keep the activity and drawing unchanged; switch the address to 8 Wharf Yard and run the lab again. Notice why the next step is a question for Planning, not a licence filing.
