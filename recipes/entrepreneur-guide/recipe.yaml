  - id: select-wharf
    title: Select the unresolved site
    description: Select WY-08. An accessible note can still say that zoning is unknown.
    tab: knowledge
    completeWhen: { type: knowledge, documentId: wharf-yard }
  - id: select-intake
    title: Select the intake guide
    description: Select IN-01 for requests with no site or a different activity.
    tab: knowledge
    completeWhen: { type: knowledge, documentId: intake-guide }
