    connectionId: guidance-library
    resourceId: business-desk
    file: documents/mill-lane.txt
  - id: wharf-yard
    title: "WY-08: 8 Wharf Yard zoning query"
    summary: An available site note whose use classification is unresolved.
    connectionId: guidance-library
    resourceId: business-desk
    file: documents/wharf-yard.txt
  - id: intake-guide
    title: "IN-01: Business Desk intake guide"
