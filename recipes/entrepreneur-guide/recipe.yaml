lab:
  title: Same bakery, different premises
  description: Prepare a route for one retail bakery in fictional Alderfen. Change only the site to see why a zoning gap takes precedence over a completed drawing. No real register is searched.
  fields:
    - id: activity
      label: Proposed use
      type: select
      defaultValue: bakery
      hint: Only the retail bakery use is covered by these site notes.
      options:
        - { value: bakery, label: Retail bakery without seating }
        - { value: other, label: Another activity }
    - id: site
      label: Proposed premises
      type: select
      defaultValue: mill
      hint: Choose a fictional site; no address lookup takes place.
      options:
        - { value: mill, label: 14 Mill Lane }
        - { value: wharf, label: 8 Wharf Yard }
        - { value: unknown, label: Address not provided }
    - id: plan-ready
      label: Floor plan already prepared
      type: boolean
      defaultValue: false
      hint: A floor plan helps assemble the application. It does not establish the zoning classification.
  checks:
    - { id: bakery-use, label: Use is the covered retail bakery, field: activity, operator: eq, value: bakery }
    - { id: wharf-site, label: Premises match WY-08, field: site, operator: eq, value: wharf }
    - { id: mill-site, label: Premises match ML-14, field: site, operator: eq, value: mill }
    - { id: plan-present, label: Drawing already prepared, field: plan-ready, operator: eq, value: true }
  rules:
    - { id: outside-use, label: Use outside the guide, all: [ { checkId: bakery-use, equals: false } ], outcomeId: different-activity }
    - { id: documented-use, label: Follow the address-specific route, all: [ { checkId: mill-site, equals: true } ], outcomeId: bakery-roadmap }
    - { id: no-determination, label: Unresolved classification at Wharf Yard, all: [ { checkId: wharf-site, equals: true } ], outcomeId: planning-first }
    - { id: ask-address, label: No matching premises selected, all: [], outcomeId: missing-site }
  outcomes:
    - id: bakery-roadmap
      title: "14 Mill Lane: prepare the food-premises licence application"
      summary: |-
        1. Match the proposed retail bakery without seating to site note ML-14. The entry permits an application, not opening day.
        2. Assemble the floor plan and short activity description. Mark preparation, storage and sales areas on the drawing.
        3. Submit the packet to the Business Desk for a food-premises licence, quoting ML-14.
        4. After the completeness review, the inspection team invites the applicant to a pre-opening visit. Wait for a written licensing decision before opening.
      documentIds: [ mill-lane ]
      recommendations:
        - when: { checkId: plan-present, equals: false }
          title: What to do now
          description: Draw the missing floor plan before submitting the packet.
        - when: { checkId: plan-present, equals: true }
          title: What to do now
          description: Check the three areas on your existing floor plan; do not redraw it. Attach it to the activity description.
    - id: planning-first
      title: "8 Wharf Yard: clarify zoning before filing"
      summary: WY-08 does not establish whether this bakery use is eligible. Ask the Planning Desk for written clarification, quoting 8 Wharf Yard, WY-08 and the proposed on-site baking and counter sales without seating. Do not submit a licence application or arrange an inspection until the classification is known. This is neither approval nor refusal; having a floor plan does not change the next step.
      documentIds: [ wharf-yard ]
    - id: missing-site
      title: Which premises are you considering?
      summary: Before using a site note, ask for the premises address. A bakery description alone cannot identify the applicable route.
      documentIds: [ intake-guide ]
    - id: different-activity
      title: Use the guide for the actual business activity
      summary: These notes cover a retail bakery without seating. Ask the Business Desk for the matching activity guide instead of applying either bakery route.
      documentIds: [ intake-guide ]
  cases:
    - id: mill-needs-plan
      title: Mill Lane with no drawing
      inputs: { activity: bakery, site: mill, plan-ready: false }
      expected: { outcomeId: bakery-roadmap, kind: answer, documentIds: [ mill-lane ], contains: [ Draw the missing floor plan, After the completeness review, written licensing decision ] }
    - id: wharf-needs-ruling
      title: Same bakery and paperwork at Wharf Yard
      inputs: { activity: bakery, site: wharf, plan-ready: false }
      expected: { outcomeId: planning-first, kind: answer, documentIds: [ wharf-yard ], contains: [ written clarification, neither approval nor refusal ] }
    - id: mill-plan-ready
      title: Mill Lane with a prepared drawing
      inputs: { activity: bakery, site: mill, plan-ready: true }
      expected: { outcomeId: bakery-roadmap, kind: answer, documentIds: [ mill-lane ], contains: [ existing floor plan, do not redraw it ] }
    - id: wharf-plan-ready
      title: A completed floor plan cannot settle zoning
      inputs: { activity: bakery, site: wharf, plan-ready: true }
      expected: { outcomeId: planning-first, kind: answer, documentIds: [ wharf-yard ], contains: [ Do not submit, written clarification ] }
    - id: no-address
      title: Bakery without a chosen site
      inputs: { activity: bakery, site: unknown, plan-ready: false }
      expected: { outcomeId: missing-site, kind: answer, documentIds: [ intake-guide ], contains: [ ask for the premises address ] }
    - id: other-activity
      title: Known premises but a different use
      inputs: { activity: other, site: mill, plan-ready: true }
      expected: { outcomeId: different-activity, kind: answer, documentIds: [ intake-guide ], contains: [ matching activity guide ] }
    - id: unavailable-mill
      title: Cannot read the known site's note
      inputs: { activity: bakery, site: mill, plan-ready: false }
      disabledKnowledge: [ mill-lane ]
      expected: { outcomeId: bakery-roadmap, kind: missing-knowledge, documentIds: [], contains: [ Run blocked, ML-14 ] }
    - id: unavailable-wharf
      title: Missing source is not the same as unresolved zoning
      inputs: { activity: bakery, site: wharf, plan-ready: false }
      disabledKnowledge: [ wharf-yard ]
      expected: { outcomeId: planning-first, kind: missing-knowledge, documentIds: [], contains: [ Run blocked, WY-08 ] }
implementation:
  - title: Start with one licensed use and an accountable source owner
    description: Have planning and licensing officers agree the authority, premises identifiers, activity definition and inspection order. Replace every Alderfen note with approved local guidance carrying an owner, effective date and review date.
  - title: Keep public guidance separate from private applications
    description: Public instructions may explain an application route, not report on an individual's file. Any future status lookup needs authentication, record-level authorisation and a separate design for missing access. Do not use the visitor's identity or private documents in this pilot.
  - title: Measure first-time completeness
    description: In a real pilot, count bakery applications accepted as complete on the first intake review divided by all bakery applications first reviewed in the same period. Agree the definition and baseline with the Business Desk. A completed exercise does not measure this rate.
  - title: What this exercise actually does
    description: Local fictional sources and rules only. No map lookup, legal advice, upload, application, payment, inspection booking or licence decision. Microsoft Learn is a reference for writing agent instructions, not the source of the fictional municipal rules.
