facts:
  - id: mill-route
    documentId: mill-lane
    keywords: [ bakery at 14 Mill Lane, ML-14 ]
    answer: ML-14 lists a retail bakery without seating at 14 Mill Lane as eligible to apply, not approved to open. First, draw a floor plan showing preparation, storage and sales areas, and describe what you will bake and sell. Next, submit both documents to the Business Desk with the food-premises licence application, quoting ML-14. After the completeness review, the inspection team contacts you about a pre-opening visit. Wait for a written licensing decision before opening.
    detail: If you already have a floor plan, check that all three areas are marked; do not draw it again.
  - id: wharf-query
    documentId: wharf-yard
    keywords: [ bakery at 8 Wharf Yard, WY-08 ]
    answer: The current zoning entry for 8 Wharf Yard does not establish whether a retail bakery is an eligible use. Ask the Planning Desk for written clarification before submitting a food-premises licence application or arranging an inspection.
    detail: Quote WY-08 and the premises address. Describe the proposed on-site baking and counter sales, with no seating. Ask which use classification applies. Return to the licensing checklist when the Planning Desk replies in writing.
  - id: ask-site
    documentId: intake-guide
    keywords: [ not chosen a site, address not provided ]
    answer: Identify the proposed activity and the exact premises before choosing an address-specific route. If the site is not yet known, ask for the premises address; do not list permits or inspections as if the site had been checked.
    detail: General guidance does not open a case, book a visit or issue a licence.
tools: []
test:
  suggestedQuestions:
    - I want to open a bakery at 14 Mill Lane. Where do I start?
    - I want to open a bakery at 8 Wharf Yard. Can I book an inspection?
    - I have not chosen a site. What do you need first?
  handoffKeywords: []
  unknownAnswer: This example covers two retail bakery sites in Alderfen. Choose a sample question with the activity and one address rather than entering a real address.
  missingKnowledgeAnswer: I cannot read the guidance for this question. Connect the Alderfen business guidance library and select the matching note. No zoning conclusion can be drawn from an unavailable source.
  handoffBlockedAnswer: No filing or booking tool is available.
  handoffReadyAnswer: Public guidance only. This guide cannot submit an application or arrange an inspection.
conversations:
  - schemaVersion: 1
    revision: 1
    id: bakery-first-steps
    title: Where do I start with my bakery?
    mode: simulated
    starter:
      label: I want to open a bakery. Where do I start?
      prompt: I want to open a bakery at this address. Where do I start?
