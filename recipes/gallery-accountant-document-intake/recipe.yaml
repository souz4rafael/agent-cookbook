implementation:
  - title: Gallery reference and local adaptation
    description: "Accountant Document Intake & Q&A, v1.0 by Adriana Trujillo (Copilot Studio Gallery, MIT). This desk adapts the ZIP's table-first read and original-file fallback. The bindery, its rows and the learner exercises are new."
  - title: What runs here
    description: Six fixed combinations pair one inclusion decision with one evidence state. Local rules return the supported figures and citations; they do not parse an upload, execute SQL or calculate arbitrary sums. The guided questions read named fixtures rather than changing the lab inputs.
  - title: What stays in the reference
    description: The gallery workflow ingests files into Dataverse, and separate tools can read or write as the user. This draft connects to neither service. In a real implementation, review access, preview the exact correction and require confirmation and write approval separately from reading.
lab:
  title: Close the five-row July packet
  description: Choose a register and an inclusion basis. The figures on the five rows are fixed. Run once for trade, then include the training row. Try the partial capture first without, then with, the supplier page.
  fields:
    - id: evidence
      label: Evidence on the desk
      type: select
      defaultValue: full
      hint: The two registers are alternative captures of one batch. Add the supplier page only to investigate the partial capture.
      options:
        - {value: full, label: Full register only}
        - {value: partial, label: Partial register only}
        - {value: source, label: Partial register plus supplier page}
    - id: basis
      label: USD calculation basis
      type: select
      defaultValue: trade
      hint: Both bases count the original invoice once and keep E-14 in euros. Only the treatment of the test row changes.
      options:
        - {value: trade, label: Trade rows only}
        - {value: comparison, label: Include T-09 in a what-if}
  checks:
    - {id: lacks-credit, label: Partial capture without the page, field: evidence, operator: eq, value: partial}
    - {id: has-page, label: Partial capture with the supplier page, field: evidence, operator: eq, value: source}
    - {id: include-test, label: Test row requested for comparison, field: basis, operator: eq, value: comparison}
  rules:
    - id: partial-comparison
      label: A test-inclusive subtotal cannot supply a missing credit
      all: [{checkId: lacks-credit, equals: true}, {checkId: include-test, equals: true}]
      outcomeId: comparison-open
    - id: partial-trade
      label: Withhold the trade net until the credit has evidence
      all: [{checkId: lacks-credit, equals: true}]
      outcomeId: trade-open
    - id: source-comparison
      label: Use the page for the credit and include T-09 only in the comparison
      all: [{checkId: has-page, equals: true}, {checkId: include-test, equals: true}]
      outcomeId: comparison-with-page
    - id: source-trade
      label: Complete the trade reading with the original allowance
      all: [{checkId: has-page, equals: true}]
      outcomeId: trade-with-page
    - id: full-comparison
      label: Price the test-inclusive comparison from the full register
      all: [{checkId: include-test, equals: true}]
      outcomeId: comparison-stored
    - id: full-trade
      label: Use the full register for the ordinary trade close
      all: []
      outcomeId: trade-stored
  outcomes:
    - id: trade-stored
      title: Trade net from the full register
      summary: |-
        PQ-48 before credit: USD 684.50. Stored CN-12 credit: USD -54.50. Trade net: USD 630.00.
        Excluded: PQ-48-copy (USD 684.50, resend of the counted invoice); T-09 (USD 36.00, marked TEST); E-14 (EUR 82.00, outside USD). The full register supplies the sign and the amount; no source page is needed.
      documentIds: [full-register]
      skillId: read-stored-rows
    - id: comparison-stored
      title: What if the test row were included?
      summary: |-
        PQ-48 (USD 684.50) plus T-09 (USD 36.00) gives USD 720.50 before credit. Stored CN-12 credit: USD -54.50. Comparison net: USD 666.00.
        T-09 accounts for the entire USD 36.00 difference from the trade net of USD 630.00; it is not a purchase. Excluded: PQ-48-copy (USD 684.50, resend) and E-14 (EUR 82.00, outside USD).
      documentIds: [full-register]
      skillId: read-stored-rows
    - id: trade-open
      title: The register supports a subtotal, not a trade net
      summary: |-
        PQ-48 before credit: USD 684.50. Trade net: unknown. Row 04 has a blank CN-12 amount, not a zero credit. Do not settle on USD 684.50.
        Excluded: PQ-48-copy (USD 684.50, resend); T-09 (USD 36.00, marked TEST); E-14 (EUR 82.00, outside USD). The credit is unresolved, not excluded.
        Follow row 04 to CN-12.pdf, page 2, Return allowance. If the section is unreadable, ask for a legible copy.
      documentIds: [partial-register]
      skillId: read-stored-rows
    - id: comparison-open
      title: Adding T-09 does not fill the credit cell
      summary: |-
        PQ-48 (USD 684.50) plus T-09 (USD 36.00) gives USD 720.50 before credit. Comparison net: unknown. Row 04 has a blank CN-12 amount, not a zero credit; USD 720.50 is neither a net nor a payable.
        Excluded: PQ-48-copy (USD 684.50, resend) and E-14 (EUR 82.00, outside USD). Only the test-inclusive subtotal is USD 36.00 higher.
        Follow row 04 to CN-12.pdf, page 2, Return allowance. If the section is unreadable, ask for a legible copy.
      documentIds: [partial-register]
      skillId: read-stored-rows
    - id: trade-with-page
      title: Trade net supported by the return advice
      summary: |-
        The partial register supports PQ-48 at USD 684.50 before credit. CN-12.pdf, page 2, Return allowance shows USD 54.50 in the buyer's favour. Signed credit: USD -54.50. Trade net: USD 630.00.
        Excluded: PQ-48-copy (USD 684.50, resend); T-09 (USD 36.00, marked TEST); E-14 (EUR 82.00, outside USD). The credit came from the page, not the amount cell. Row 04 remains blank; no correction was made.
      documentIds: [partial-register, credit-page]
      skillId: consult-allowance
    - id: comparison-with-page
      title: Test-inclusive comparison supported by the return advice
      summary: |-
        The partial register supports PQ-48 (USD 684.50) plus T-09 (USD 36.00), or USD 720.50 before credit. CN-12.pdf, page 2, Return allowance shows USD 54.50 in the buyer's favour. Signed credit: USD -54.50. Comparison net: USD 666.00.
        The trade net is USD 630.00; the USD 36.00 difference is test data, not a payable. Excluded: PQ-48-copy (USD 684.50, resend) and E-14 (EUR 82.00, outside USD). Row 04 remains blank; no correction was made.
      documentIds: [partial-register, credit-page]
      skillId: consult-allowance
  cases:
    - id: trade-from-register
      title: Close on the full register
      inputs: {evidence: full, basis: trade}
      expected:
        outcomeId: trade-stored
        kind: answer
        documentIds: [full-register]
        contains: ['PQ-48 before credit: USD 684.50', 'Stored CN-12 credit: USD -54.50', 'Trade net: USD 630.00', 'PQ-48-copy (USD 684.50', 'T-09 (USD 36.00, marked TEST)', 'E-14 (EUR 82.00, outside USD)']
    - id: comparison-from-register
      title: Add only the training row
      inputs: {evidence: full, basis: comparison}
      expected:
        outcomeId: comparison-stored
        kind: answer
        documentIds: [full-register]
        contains: ['T-09 (USD 36.00)', 'USD 720.50 before credit', 'Stored CN-12 credit: USD -54.50', 'Comparison net: USD 666.00', 'trade net of USD 630.00', 'PQ-48-copy (USD 684.50, resend)', 'E-14 (EUR 82.00, outside USD)']
    - id: trade-missing-credit
      title: Withhold a net on a blank credit
      inputs: {evidence: partial, basis: trade}
      expected:
        outcomeId: trade-open
        kind: answer
        documentIds: [partial-register]
        contains: ['PQ-48 before credit: USD 684.50', 'Trade net: unknown', 'not a zero credit', 'T-09 (USD 36.00, marked TEST)', 'CN-12.pdf, page 2, Return allowance']
    - id: comparison-missing-credit
      title: The what-if still has a missing credit
      inputs: {evidence: partial, basis: comparison}
      expected:
        outcomeId: comparison-open
        kind: answer
        documentIds: [partial-register]
        contains: ['USD 720.50 before credit', 'Comparison net: unknown', 'not a zero credit', 'PQ-48-copy (USD 684.50, resend)', 'E-14 (EUR 82.00, outside USD)', 'CN-12.pdf, page 2, Return allowance']
    - id: trade-from-page
      title: Verify the allowance without correcting the ledger
      inputs: {evidence: source, basis: trade}
      expected:
        outcomeId: trade-with-page
        kind: answer
        documentIds: [partial-register, credit-page]
        contains: ['USD 684.50 before credit', 'CN-12.pdf, page 2, Return allowance', 'Signed credit: USD -54.50', 'Trade net: USD 630.00', 'T-09 (USD 36.00, marked TEST)', 'Row 04 remains blank']
    - id: comparison-from-page
      title: Read the same allowance on the comparison basis
      inputs: {evidence: source, basis: comparison}
      expected:
        outcomeId: comparison-with-page
        kind: answer
        documentIds: [partial-register, credit-page]
        contains: ['USD 720.50 before credit', 'CN-12.pdf, page 2, Return allowance', 'Signed credit: USD -54.50', 'Comparison net: USD 666.00', 'trade net is USD 630.00', 'E-14 (EUR 82.00, outside USD)', 'Row 04 remains blank']
    - id: original-not-needed
      title: The complete register stands on its own
      inputs: {evidence: full, basis: trade}
      disabledKnowledge: [partial-register, credit-page]
      expected:
        outcomeId: trade-stored
        kind: answer
        documentIds: [full-register]
        contains: ['Trade net: USD 630.00', 'no source page is needed']
    - id: no-full-register
      title: Other documents cannot impersonate the full capture
      inputs: {evidence: full, basis: trade}
      disabledKnowledge: [full-register]
      expected:
        outcomeId: trade-stored
        kind: missing-knowledge
        documentIds: []
        contains: ['Run blocked', 'July register, full capture', 'No draft or action was produced']
    - id: no-supplier-page
      title: A stored filename is not the original page
      inputs: {evidence: source, basis: trade}
      disabledKnowledge: [credit-page]
      expected:
        outcomeId: trade-with-page
        kind: missing-knowledge
        documentIds: []
        contains: ['Run blocked', 'CN-12 supplier return advice', 'No draft or action was produced']
    - id: no-partial-register
      title: The supplier page alone cannot establish the batch net
      inputs: {evidence: source, basis: comparison}
      disabledKnowledge: [partial-register]
      expected:
        outcomeId: comparison-with-page
        kind: missing-knowledge
        documentIds: []
        contains: ['Run blocked', 'July register, partial capture', 'No draft or action was produced']
