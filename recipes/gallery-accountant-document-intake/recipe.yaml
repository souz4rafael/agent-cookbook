schemaVersion: 1
revision: 1
id: gallery-accountant-document-intake
status: published
title: Paper Quay invoice reconciliation
summary: Explain a bindery's July net from five intake rows. Compare a test-inclusive figure, then trace a missing credit to the supplier's return allowance.
industry: Finance and accounting
difficulty: intermediate
accentIcon: document
learningGoals:
  - Show invoices before credit, the signed credit and the net in USD. Identify the resend, training charge and euro invoice by row.
  - Demonstrate why including T-09 changes a comparison by exactly USD 36.00 without changing the trade payable.
  - Trace a blank credit through its filename to the page and section that supports its value. Distinguish that read from approval to correct a register.
sourceUrl: https://microsoft.github.io/copilot-studio-gallery/solutions/accountant-document-intake/
scenario:
  headline: Five intake rows arrived. How much belongs in the bindery's USD close?
  problem: A cover-board invoice came in twice, alongside a training charge, a supplier credit and an invoice in euros. The accountant needs a figure another colleague can reproduce without reading every file again.
  impact: Counting a resend would add a whole invoice. Adding the face value of the return as a charge would make the bindery appear to owe more for sending boards back.
  approach: Start with the extraction register and its notes. Use one copy per purchase, separate currencies and show the credit on its own line. If the credit cell is blank, follow the row to the allowance on the supplier's second page.
  startSmall: Use the full capture and change only whether T-09 is included. Then switch to the partial capture. Can you still support the net, or only the subtotal before credit?
  potentialValue: A reviewer can see which document to reopen and which rows explain a difference between two figures.
  measure: Give a second reviewer just the answer and its citations. Can they reproduce the USD net, name the exclusions and locate the evidence for the credit?
  boundary: Five fictional rows, two alternative captures of one batch and a text facsimile. The accountant owns any correction. No real extraction, arbitrary sum, file save or payment is performed.
  sourceLabel: "Copilot Studio Gallery: Accountant Document Intake & Q&A, v1.0 by Adriana Trujillo"
  home:
    challenge: Which of five rows belong in the USD payable when an invoice was resent, a charge is marked TEST and the supplier issued a credit?
    experiment: Include T-09 to see the net comparison rise by USD 36.00. Switch to the partial capture and see why the subtotal alone cannot settle the net.
    takeaway: Account for each excluded row and the sign of a credit, and know when the register needs evidence from a specific page.
    scope: One fictional bindery packet. Reading its register or its credit note cannot approve a correction or change a payable.
agent:
  name: Paper Quay closing desk
  description: Help an accountant explain the July USD close from the intake register and locate missing credit evidence.
  instructions: |-
    # Reconciliation mandate

    Task: Explain the bindery's USD net for the packet the accountant selected. Read the stored rows and their derivation notes first; do not combine alternative captures.
    Basis: Count PQ-48 once. Keep euros separate. Exclude the marked training row unless asked for a test-inclusive comparison; label that figure as a what-if, not a payable.
    Answer: Show the subtotal before credit, the signed allowance and the net. Name the excluded rows, their amounts and reasons. Apply the allowance once as a reduction.
    Evidence: If CN-12's amount is blank, report only the supported subtotal and identify the originating page and section. If that section is supplied, cite it and distinguish its printed value from the stored field. Do not treat a blank as zero.
    Authority: Read and explain only. A correction is a separate request: show the row, current and proposed values and evidence, then seek confirmation and the required write approval. Do not change a row or save a file.
  tone: formal
  detail: detailed
instructionStyles:
  structured: |-
    # Reconciliation mandate

    Task: Explain the bindery's USD net for the packet the accountant selected. Read the stored rows and their derivation notes first; do not combine alternative captures.
    Basis: Count PQ-48 once. Keep euros separate. Exclude the marked training row unless asked for a test-inclusive comparison; label that figure as a what-if, not a payable.
    Answer: Show the subtotal before credit, the signed allowance and the net. Name the excluded rows, their amounts and reasons. Apply the allowance once as a reduction.
    Evidence: If CN-12's amount is blank, report only the supported subtotal and identify the originating page and section. If that section is supplied, cite it and distinguish its printed value from the stored field. Do not treat a blank as zero.
    Authority: Read and explain only. A correction is a separate request: show the row, current and proposed values and evidence, then seek confirmation and the required write approval. Do not change a row or save a file.
  stepByStep: |-
    # Reconciliation procedure

    1. Choose the July register named in the question. Read its rows and notes; the two captures describe the same packet.
    2. Keep the first PQ-48 and set aside the copy and the EUR invoice. Leave T-09 out of trade figures; include it only in a requested what-if.
    3. Find CN-12. If its amount is missing, identify the known subtotal and withhold the net. Follow its filename to the originating section. Cite any value read there as source evidence, not a stored correction.
    4. When the credit is known, show the USD subtotal, signed credit and net; apply the credit once. List the amounts and reasons for exclusions.
    5. Stop at the read. A request to correct data needs a separate preview of the old value, proposed value and evidence, explicit confirmation and write approval. Do not write or save anything.
  decisionRules: |-
    # Evidence and inclusion rules

    Complete register -> answer from this capture and its notes; never add in the other capture.
    Same invoice resent -> one purchase. Different currency -> separate figure. TEST -> leave out unless explicitly included in a comparison, never present that comparison as trade debt.
    Known allowance -> show invoices before credit, signed credit as a reduction, then net. State each exclusion with currency, amount and reason.
    Blank allowance -> no net and no zero substitute. Point to the source section. With the identified page in hand, cite the printed allowance and explain its effect without changing the stored value.
    Correction or save -> outside this read. A separate request, preview with current and proposed values and evidence, confirmation and write approval would be needed.
  examples: |-
    “What does Hinge Mill's resend add?” Nothing to the trade net: the same USD 684.50 invoice is already counted.
    “The supplier printed 54.50 without a minus sign.” Read the label. An allowance in the buyer's favour reduces the payable; a blank register field alone supports no credit amount.
editable: [name, instructions, tone, detail]
connections:
  - id: bindery-library
    type: sharepoint
    title: Bindery evidence library
    description: Choose the local July packet to make its register captures and return advice available.
    accountLabel: Paper Quay training desk
    resources:
      - id: july-packet
        label: July close packet
        description: Two alternative register snapshots and the supplier page for CN-12.
    realWorldNote: This selector exposes fictional text only. It does not authenticate to SharePoint or read a Dataverse table.
knowledge:
  - id: full-register
    title: July register, full capture
    summary: All five intake rows, the resend and test flags, and the signed credit recorded for the trade close.
    connectionId: bindery-library
    resourceId: july-packet
    file: documents/full-register.txt
  - id: partial-register
    title: July register, partial capture
    summary: An alternate reading of the same packet. Row 04 retains its filename and heading but has no credit amount.
    connectionId: bindery-library
    resourceId: july-packet
    file: documents/partial-register.txt
  - id: credit-page
    title: CN-12 supplier return advice
    summary: A text facsimile of the original credit note, including its Return allowance section on page 2.
    connectionId: bindery-library
    resourceId: july-packet
    file: documents/cn-12-source.txt
facts:
  - id: read-full-net
    documentId: full-register
    keywords: [full register trade net, full trade net]
    answer: The full register gives USD 684.50 in invoices and a signed credit of USD -54.50, for a trade net of USD 630.00. Leave out the PQ-48 copy, T-09 and the EUR invoice E-14.
    detail: Row 02 would add USD 684.50 a second time. Row 03 would add USD 36.00 of test data. Row 05 stays at EUR 82.00 in a separate currency group.
  - id: explain-test-delta
    documentId: full-register
    keywords: [test-inclusive comparison, include the training row]
    answer: "Include T-09 only in the what-if: USD 720.50 before credit, USD -54.50 in credit, and USD 666.00 net. The trade net remains USD 630.00."
    detail: Only the test row changes sides. The duplicate stays out and no EUR amount enters either USD figure.
  - id: trace-blank-credit
    documentId: partial-register
    keywords: [trace the blank credit, partial register]
    answer: The partial register has no credit amount. Follow row 04 to CN-12.pdf, page 2, Return allowance, before reporting a USD net.
    detail: Ask for a legible copy of that section if it cannot be read. A blank amount is not a zero credit.
  - id: read-allowance
    documentId: credit-page
    keywords: [printed allowance, read the supplier page]
    answer: CN-12.pdf, page 2, Return allowance shows USD 54.50 in the buyer's favour. Its signed effect on PQ-48 is USD -54.50, not another charge.
    detail: The ten boards at USD 5.45 explain the printed allowance; the line calculation and its total are the same credit, not two credits.
  - id: separate-write
    documentId: partial-register
    keywords: [authorize a correction, write approval]
    answer: Reading the allowance does not authorize a ledger correction. Identify the row, old and proposed values, and source; a write needs a separate request and confirmation.
    detail: This desk exercise makes no change to either register or to the supplier document.
tools: []
skills:
  - id: read-stored-rows
    title: Read the extraction register
    description: Use the current capture to explain a net or identify an unsupported credit.
    instructions: Read row notes first. Separate the USD test comparison from the trade figure; if row 04 has no amount, give only a subtotal and the locator for the original.
    coverage: simulated
  - id: consult-allowance
    title: Consult the originating section
    description: Resolve the missing field for this answer using the supplied facsimile, without backfilling the stored row.
    instructions: Match CN-12 to PQ-48, locate page 2 and give the allowance its sign from the buyer's perspective.
    coverage: simulated
  - id: controlled-write
    title: Approved corrections in the gallery solution
    description: Reference only. A reader's request for an explanation is not a request to write back.
    instructions: A proposed change needs its own request, a preview of the exact change, the accountant's confirmation and the platform's write approval.
    coverage: reference
journey:
  - id: connect-packet
    title: Find the July close packet
    description: In Knowledge, choose July close packet in the bindery library. No sign-in is needed.
    tab: knowledge
    completeWhen: {type: connection, connectionId: bindery-library}
  - id: select-full
    title: Select the full register
    description: Select July register, full capture. Which two row numbers describe the same purchase?
    tab: knowledge
    completeWhen: {type: knowledge, documentId: full-register}
  - id: select-partial
    title: Select the alternate capture
    description: Select July register, partial capture. Look at the amount cell on row 04; do not join the two registers.
    tab: knowledge
    completeWhen: {type: knowledge, documentId: partial-register}
  - id: select-page
    title: Make the return advice available
    description: Select CN-12 supplier return advice. Having the file available does not mean you need it for a complete register.
    tab: knowledge
    completeWhen: {type: knowledge, documentId: credit-page}
  - id: try-trade
    title: Reconcile the USD trade rows
    description: In Review, run the full capture with Trade rows only. Check the three omitted rows against the invoice subtotal.
    tab: activity
    completeWhen: {type: case-tested, caseId: trade-from-register}
  - id: try-test
    title: Change one inclusion decision
    description: Keep the full capture and include T-09 in a what-if. Run again. Explain the USD 36.00 difference without counting the resend.
    tab: activity
    completeWhen: {type: case-tested, caseId: comparison-from-register}
  - id: try-blank
    title: Stop on a missing credit
    description: Switch back to trade rows and choose Partial register only. Run it and distinguish the supported subtotal from an unknown net.
    tab: activity
    completeWhen: {type: case-tested, caseId: trade-missing-credit}
  - id: inspect-page
    title: Follow row 04 to its source
    description: Change the evidence to Partial register plus supplier page and run again. Open the CN-12 citation and find the label that determines the sign on page 2.
    tab: activity
    completeWhen: {type: citation-opened, documentId: credit-page}
  - id: evaluate
    title: Test what happens without a source
    description: Run the evaluation with all three documents selected. Compare the table-only case with the unavailable-page case. Why does just one need the original?
    tab: activity
    completeWhen: {type: evaluation-passed}
test:
  suggestedQuestions:
    - What is the full register trade net?
    - What changes in the test-inclusive comparison?
    - How do I trace the blank credit?
    - What does the printed allowance mean?
    - Does a source read authorize a correction?
  handoffKeywords: []
  unknownAnswer: I can explain the five-row July packet, not calculate a new batch or change a ledger. Ask for the full trade net, the printed allowance or the test-inclusive comparison.
  missingKnowledgeAnswer: I do not have the selected evidence for that answer. Connect the July close packet and select the matching register or supplier advice.
  handoffBlockedAnswer: There is no write destination on this desk. No row or file was changed.
  handoffReadyAnswer: Reading is the last step here. No correction or save is offered.
conversations:
