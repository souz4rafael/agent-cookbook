conversations:
  - schemaVersion: 1
    revision: 1
    id: guided-example
    title: Patient Navigator
    mode: simulated
    starter:
      label: Practice explaining a plan in everyday words
      prompt: Practice explaining a plan in everyday words
    variationPolicy: stable-per-session
    onUnexpectedInput: stay-and-guide
    variables: {}
    steps:
      - id: clarify
        role: assistant
        variants:
          - id: direct
            text: This chat cannot look up or confirm anyone’s plan. Would you like to practice explaining an existing step, reading a referral label or asking about a scheduling barrier?
          - id: alternative
            text: Choose a general navigation question. Only the separate role-and-permission exercise shows a fictional plan; do not enter names or personal details.
      - id: choose-route
        role: user
        choices:
          - id: read-next-step
            label: Explain an existing step
            next: reply-read-next-step
          - id: read-return
            label: Interpret a referral label
            next: reply-read-return
          - id: ask-for-options
            label: Ask about a barrier
            next: reply-ask-for-options
      - id: reply-read-next-step
        role: simulation
        prompt: How can I put a written next step into plain language?
        end: true
      - id: reply-read-return
        role: simulation
        prompt: Does a referral receipt mean an appointment has been booked?
        end: true
      - id: reply-ask-for-options
        role: simulation
        prompt: What can someone ask if a proposed time does not work?
        end: true
lab:
  title: Read the plan before calling it a booking
  description: Choose a fictional role, permission and administrative markings. Read the resulting explanation; there is no account, patient record or calendar connection.
  fields:
    - id: viewer
      label: Who is asking in the scenario?
      type: select
      options:
        - value: self
          label: Person the exercise concerns
        - value: supporter
          label: Supporter listed for this explanation
        - value: unlisted
          label: Another person, not listed
      defaultValue: unlisted
      hint: Do not enter a name. This role is a local exercise setting.
    - id: permission
      label: Permission for this explanation recorded?
      type: boolean
      defaultValue: false
      hint: Permission must cover the selected person and this purpose.
    - id: plan
      label: Existing plan step
      type: select
      options:
        - value: legible
          label: Written next step is legible
        - value: unclear
          label: Step missing or not legible
      defaultValue: unclear
      hint: Never create a replacement step.
    - id: referral
      label: Referral sheet marking
      type: select
      options:
        - value: received
          label: Intake receipt only
        - value: offered
          label: Time proposed; no acceptance
        - value: uncertain
          label: Conflicting or incomplete entry
      defaultValue: uncertain
      hint: A receipt, an offer and a booking are not interchangeable.
    - id: barrier
      label: Administrative barrier
      type: select
      options:
        - value: none
          label: No barrier stated
        - value: travel
          label: Proposed travel time does not work
        - value: format
          label: Needs the options in an accessible written format
      defaultValue: none
      hint: Select a broad category only; do not add personal details.
  checks:
    - id: outside
      label: Person is outside the permitted roles
      field: viewer
      operator: eq
      value: unlisted
    - id: consent
      label: Permission recorded for this explanation
      field: permission
      operator: eq
      value: true
    - id: written
      label: Existing next step legible
      field: plan
      operator: eq
      value: legible
    - id: receipt
      label: Only receipt recorded
      field: referral
      operator: eq
      value: received
    - id: offer
      label: Offer without acceptance
      field: referral
      operator: eq
      value: offered
    - id: travel
      label: Travel constraint selected
      field: barrier
      operator: eq
      value: travel
    - id: format
      label: Written format requested
      field: barrier
      operator: eq
      value: format
  rules:
    - id: outside-role
      label: Stop for a person outside scope
      all:
        - checkId: outside
          equals: true
      outcomeId: no-disclosure
    - id: without-consent
      label: Stop without permission
      all:
        - checkId: consent
          equals: false
      outcomeId: no-disclosure
    - id: missing-step
      label: Do not invent an existing plan step
      all:
        - checkId: written
          equals: false
      outcomeId: unreadable-step
    - id: intake-only
      label: Separate the recorded receipt from the written plan
      all:
        - checkId: receipt
          equals: true
      outcomeId: explain-receipt
    - id: travel-conflict
      label: Address a travel barrier to an offered time
      all:
        - checkId: offer
          equals: true
        - checkId: travel
          equals: true
      outcomeId: travel-question
    - id: accessible-offer
      label: Address an inaccessible offer format
      all:
        - checkId: offer
          equals: true
        - checkId: format
          equals: true
      outcomeId: written-options
    - id: unaccepted-offer
      label: Describe an offer without acceptance
      all:
        - checkId: offer
          equals: true
      outcomeId: offer-only
    - id: uncertain-entry
      label: Do not infer a referral state
      all: []
      outcomeId: clarify-state
  outcomes:
    - id: no-disclosure
      title: No record details can be shared
      summary: I cannot confirm whether a plan, referral or appointment exists for this request.
      documentIds:
        - consent-and-scheduling-questions
    - id: unreadable-step
      title: Ask the plan author to clarify
      summary: The supplied exercise page does not establish the next plan step. Ask the team that wrote it for a legible explanation. Do not invent a step or infer a booking.
      documentIds:
        - plan-and-referral-reading-guide
    - id: explain-receipt
      title: The referral desk has a receipt, not a booking
      summary: Your fictional plan says the scheduling desk will offer a follow-up time and you can reply to that offer. The intake desk recorded receipt only. No offer or accepted time is shown. This is not a booking. Nothing has been requested or changed.
      documentIds:
        - plan-and-referral-reading-guide
        - consent-and-scheduling-questions
      recommendations:
        - when:
            checkId: travel
            equals: true
          title: Question to ask before an offer
          description: Can I tell the desk which times are reachable by transport?
        - when:
            checkId: format
            equals: true
          title: Question about the reply
          description: Can future time options be provided in an accessible written format?
    - id: travel-question
      title: Prepare a question about travel
      summary: Your fictional plan says the scheduling desk will offer a follow-up time and you can reply to that offer. A time is proposed, not accepted. You could ask the scheduling desk, “Is another time available that I can reach by transport?” This is not a booking. Nothing has been requested or changed.
      documentIds:
        - plan-and-referral-reading-guide
        - consent-and-scheduling-questions
    - id: written-options
      title: Ask for the offer in a usable format
      summary: Your fictional plan says the scheduling desk will offer a follow-up time and you can reply to that offer. A time is proposed, not accepted. You could ask, “Can I review the time options in an accessible written format before I reply?” This is not a booking. Nothing has been requested or changed.
      documentIds:
        - plan-and-referral-reading-guide
        - consent-and-scheduling-questions
    - id: offer-only
      title: A proposed time is not confirmation
      summary: Your fictional plan says the scheduling desk will offer a follow-up time and you can reply to that offer. The referral sheet shows an offer, but no acceptance. Ask the scheduling desk how to respond to the proposal. This is not a booking. Nothing has been requested or changed.
      documentIds:
        - plan-and-referral-reading-guide
    - id: clarify-state
      title: Ask which referral entry is supported
      summary: Your fictional plan says the scheduling desk will offer a follow-up time and you can reply to that offer. The supplied referral sheet does not establish a single state. Ask the responsible desk which entry it can confirm; do not assume there is an appointment. This is not a booking. Nothing has been requested or changed.
      documentIds:
        - plan-and-referral-reading-guide
  cases:
    - id: receipt-not-visit
      title: Explain the receipt alongside the plan
      inputs:
        viewer: self
        permission: true
        plan: legible
        referral: received
        barrier: none
      expected:
        outcomeId: explain-receipt
        documentIds:
          - plan-and-referral-reading-guide
          - consent-and-scheduling-questions
        kind: answer
        contains:
          - intake desk recorded receipt only
          - This is not a booking. Nothing has been requested or changed.
    - id: unworkable-offer
      title: Phrase a question about travel
      inputs:
        viewer: self
        permission: true
        plan: legible
        referral: offered
        barrier: travel
      expected:
        outcomeId: travel-question
        documentIds:
          - plan-and-referral-reading-guide
          - consent-and-scheduling-questions
        kind: answer
        contains:
          - A time is proposed, not accepted
          - reach by transport?
          - This is not a booking. Nothing has been requested or changed.
    - id: listed-supporter
      title: Explain an offer with permission for a supporter
      inputs:
        viewer: supporter
        permission: true
        plan: legible
        referral: offered
        barrier: format
      expected:
        outcomeId: written-options
        documentIds:
          - plan-and-referral-reading-guide
          - consent-and-scheduling-questions
        kind: answer
        contains:
          - accessible written format
          - This is not a booking. Nothing has been requested or changed.
    - id: offer-no-barrier
      title: Distinguish an offer from acceptance
      inputs:
        viewer: self
        permission: true
        plan: legible
        referral: offered
        barrier: none
      expected:
        outcomeId: offer-only
        documentIds:
          - plan-and-referral-reading-guide
        kind: answer
        contains:
          - an offer, but no acceptance
    - id: conflicting-state
      title: Leave conflicting referral markings unresolved
      inputs:
        viewer: self
        permission: true
        plan: legible
        referral: uncertain
        barrier: none
      expected:
        outcomeId: clarify-state
        documentIds:
          - plan-and-referral-reading-guide
        kind: answer
        contains:
          - does not establish a single state
    - id: missing-step
      title: Do not replace an illegible plan
      inputs:
        viewer: self
        permission: true
        plan: unclear
        referral: received
        barrier: none
      expected:
        outcomeId: unreadable-step
        documentIds:
          - plan-and-referral-reading-guide
        kind: answer
        contains:
          - Ask the team that wrote it
    - id: unlisted-person
      title: Decline an unlisted viewer even if permission is ticked
      inputs:
        viewer: unlisted
        permission: true
        plan: legible
        referral: received
        barrier: none
      expected:
        outcomeId: no-disclosure
        documentIds:
          - consent-and-scheduling-questions
        kind: answer
        contains:
          - I cannot confirm whether
    - id: no-permission
      title: Decline a supporter without permission
      inputs:
        viewer: supporter
        permission: false
        plan: legible
        referral: received
        barrier: none
      expected:
        outcomeId: no-disclosure
        documentIds:
          - consent-and-scheduling-questions
        kind: answer
        contains:
          - I cannot confirm whether
    - id: plan-guide-removed
      title: Try explaining the receipt without its guide
      inputs:
        viewer: self
        permission: true
        plan: legible
        referral: received
        barrier: none
      expected:
        outcomeId: explain-receipt
        documentIds: []
        kind: missing-knowledge
        contains:
          - Run blocked
      disabledKnowledge:
        - plan-and-referral-reading-guide
implementation:
  - title: Build this in the real service
    description: Ask navigation staff and people who use the service to review plain-language explanations, permission boundaries and accessible ways of asking scheduling questions.
  - title: What to measure
    description: Check for invented next steps, disclosures outside permission and statements that incorrectly turn a receipt, proposal or draft question into a booking.
  - title: Scope of this draft
    description: No personal health identifiers, record lookup, diagnosis, treatment advice, appointment booking or rescheduling. This local exercise uses fictional evidence; it does not access a live system or make an official determination. The Microsoft Learn reference is about agent authoring, not municipal policy.
