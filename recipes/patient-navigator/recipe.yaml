knowledge:
  - id: plan-and-referral-reading-guide
    title: Reading a plan and a referral side by side
    summary: A care plan and a referral entry answer different questions. The plan records what is supposed to happen. The referral entry records the last administrative event supported by the page. Neither, on its own, proves what happened afterwards.
    connectionId: evidence-library
    resourceId: alderfen-library
    file: documents/plan-and-referral-reading-guide.txt
  - id: consent-and-scheduling-questions
    title: Permission and questions about proposed times
    summary: "A navigator can teach the general process to anyone. A plan-specific exercise is different: the person in the scenario or their listed supporter must have permission for that explanation. If the role or permission is missing, decline without saying whether any plan, appointment or referral exists. A role choice in this exercise proves no identity."
    connectionId: evidence-library
    resourceId: alderfen-library
    file: documents/consent-and-scheduling-questions.txt
facts:
  - id: read-next-step
    documentId: plan-and-referral-reading-guide
    keywords:
      - How can I put a written next step into plain language
    answer: Name who acts next, what the plan says they will do, and what reply to look for. Repeat the written step without adding a new one.
    detail: If the step is missing or unclear, ask the team that wrote the plan to explain it. A navigator does not interpret clinical content, diagnose or recommend treatment.
  - id: read-return
    documentId: plan-and-referral-reading-guide
    keywords:
      - Does a referral receipt mean an appointment has been booked
    answer: No. A receipt acknowledges delivery to the receiving desk. It does not establish that a time has been offered, accepted or booked.
    detail: Read the latest supported entry separately from the intended next step. If entries conflict, ask the responsible desk to clarify instead of inferring a booking.
  - id: ask-for-options
    documentId: consent-and-scheduling-questions
    keywords:
      - What can someone ask if a proposed time does not work
    answer: They can ask the scheduling desk whether another time or a more accessible way to review the options is available. They need not explain medical details here.
    detail: Check whether the entry is only an offer before calling it rescheduling. Drafting a question does not send a message or change an appointment.
