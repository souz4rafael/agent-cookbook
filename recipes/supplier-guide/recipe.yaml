  decisionRules: |-
    # Decision rules

    Help a supplier read the next obligation in its own fictional Alderfen contract.
    No verified own-contract scope → provide only the public folder guide.
    No signed edition or no register marker → stop before giving a date.
    Start → packing list; list logged → origin certificate; list returned → use its correction slip.
