schemaVersion: 1
revision: 1
id: supplier-guide
status: published
title: Alderfen supplier guide
summary: Read a reed-mat supply schedule alongside its milestone register to find the next document, its due date and the correction route.
industry: Government and public services
difficulty: beginner
accentIcon: document
learningGoals:
  - Use the last register marker to choose a schedule line, then cite the signed edition for the item and its due date.
  - Identify the slip, desk and original line for a returned packing list, and explain why the return does not extend the deadline.
  - Distinguish an unmatched supplier folder, which permits only public guidance, from an incomplete folder that needs a signed schedule or register marker.
sourceUrl: https://learn.microsoft.com/en-us/microsoft-copilot-studio/authoring-instructions
scenario:
  group:
    journey: Procurement and contracts
    perspective: guidance
  headline: After the packing list goes in, what does the supplier owe next?
  problem: A reed-mat supplier has sent a packing list and is preparing a certificate showing where the fibre came from. Both documents appear on the signed schedule. What the supplier needs to know is whether the receiving desk logged the list or sent it back to correct a bundle identifier.
  impact: A supplier who skips straight to the certificate may leave the wrong batch identifier on file. If they start a fresh delivery instead, the receiving desk has to work out which entry the correction belongs to.
  approach: In the supplier’s own matched folder, the guide uses the last register marker to choose a line and the signed schedule to give its date. A logged list points to the certificate. A returned list points back to the packing list and the Repairs Desk slip, not to a new deadline.
  startSmall: Start with one supplier folder and the signed reed-mat schedule. Read the two dated lines alongside the register, then remove the marker and see why the receiving desk must clarify progress before anyone quotes a date.
  potentialValue: Suppliers could prepare the right document on the first attempt, and the receiving desk could trace a correction to the original delivery without a second round of questions.
  measure: Check whether suppliers can name the next item and cite its dated line. For returned lists, count corrections linked to the original entry and note any answer that promises a later date.
  boundary: The folder match is simulated. An unverified reader gets only the public guide. The supplier decides what to submit; the guide cannot lodge a slip, grant an extension or inspect another supplier’s contract.
  sourceLabel: "Microsoft Learn: authoring Copilot Studio instructions (not the source of the fictional contract terms)"
  home:
    challenge: A supplier has sent the packing list. The certificate may be next, but only if the receiving desk logged the list rather than returning it.
    experiment: In the matched folder, switch LIST-LOGGED to LIST-RETURNED. The next step changes from the certificate due 19 May to a packing list correction on slip CS-14, still due 12 May.
    takeaway: Use the register for progress and the signed schedule for dates, including the date that still applies to a returned list.
    scope: One fictional supplier folder. You can trace a correction to the Repairs Desk, but nothing is submitted and no deadline changes.
agent:
  name: Alderfen supplier guide
  description: Help a supplier read the next obligation in its own fictional Alderfen contract.
  instructions: |-
    # Purpose and operating boundaries

    Help a supplier read the next obligation in its own fictional Alderfen contract.
    In chat, explain how to read the folder. Do not identify a supplier, open a contract or infer a milestone from a question.
    In the lab, require simulated supplier permission and the matching supplier folder. Read the signed edition and the register together.
    Name the next item, scheduled date and Repairs Desk route. A returned item is not a new deadline.
    This is a simulated own-contract view, not legal advice. It cannot file a correction, change a deadline or show another supplier’s records.
    Name the evidence behind the next step. If two records disagree, retain both accounts and explain what a person needs to verify. Do not treat an absent observation as a negative result or a completed decision.
