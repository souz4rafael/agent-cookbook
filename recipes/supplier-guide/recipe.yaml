knowledge:
  - id: supplier-folder-guide
    title: Supplier folder guide · FG-6
    summary: FG-6 is the public reading guide, not a list of suppliers. A supplier may see only its own matched folder in this exercise.
    connectionId: evidence-library
    resourceId: alderfen-library
    file: documents/supplier-folder-guide.txt
  - id: reed-mat-schedule
    title: Reed-mat supply schedule · RM-41/B
    summary: Signed edition B, simulated contract RM-41, supplier key REED-04. These dates are fixed calendar dates in the exercise, not dates calculated from today.
    connectionId: evidence-library
    resourceId: alderfen-library
    file: documents/reed-mat-schedule.txt
  - id: milestone-register
    title: Reed-mat milestone register · MR-41
    summary: MR-41 tells a reader which RM-41/B line to read; it does not set the date. Each marker below is an alternate training snapshot.
    connectionId: evidence-library
    resourceId: alderfen-library
    file: documents/milestone-register.txt
facts:
  - id: find-item
    documentId: supplier-folder-guide
    keywords:
      - How do I find which deliverable comes next
    answer: Find the signed edition first. Use the last register marker to choose a line, then read the item and its due date from that line.
    detail: A blank marker is a reason to ask the receiving desk for the register, not to guess that the first item is late.
  - id: repair-entry
    documentId: supplier-folder-guide
    keywords:
      - What should accompany a corrected submission
    answer: Keep the original receipt. Send the Repairs Desk a Correction Slip naming the schedule line, its revision and the entry being replaced.
    detail: Keep the existing due date unless a signed replacement schedule supplies another. A correction receipt is not an extension.
