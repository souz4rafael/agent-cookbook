conversations:
  - schemaVersion: 1
    revision: 1
    id: guided-example
    title: Alderfen supplier guide
    mode: simulated
    starter:
      label: Help me read a supplier folder.
      prompt: Help me read a supplier folder.
    variationPolicy: stable-per-session
    onUnexpectedInput: stay-and-guide
    variables: {}
    steps:
      - id: clarify
        role: assistant
        variants:
          - id: direct
            text: "Where are you stuck: finding the next item, or correcting a returned one?"
          - id: alternative
            text: "Where are you stuck: finding the next item, or correcting a returned one? Choose the closest example."
      - id: choose-route
        role: user
        choices:
          - id: find-item
            label: Find the next item
            next: reply-find-item
          - id: repair-entry
            label: Correct a returned item
            next: reply-repair-entry
      - id: reply-find-item
        role: simulation
        prompt: How do I find which deliverable comes next?
        end: true
      - id: reply-repair-entry
        role: simulation
        prompt: What should accompany a corrected submission?
        end: true
lab:
  title: Follow one supplier folder
  description: Set the simulated permission and folder match first. Then switch the last marker without changing the signed timetable.
  fields:
    - id: permission
      label: Supplier view permission
      type: select
      options:
        - value: verified
          label: Verified for the simulation
        - value: denied
          label: Denied
        - value: unknown
          label: Not verified
      defaultValue: unknown
      hint: Permission applies to an own-contract view only.
    - id: folder
      label: Supplier-to-contract match
      type: select
      options:
        - value: own
          label: Own contract confirmed
        - value: different
          label: Different supplier
        - value: unresolved
          label: Match not established
      defaultValue: unresolved
      hint: A folder label alone does not establish ownership.
    - id: edition
      label: Schedule edition
      type: select
      options:
        - value: signed
          label: Current signed edition
        - value: unclear
          label: Signed edition unavailable
      defaultValue: signed
      hint: Do not use a working copy to give a date.
    - id: marker
      label: Last register marker
      type: select
      options:
        - value: start
          label: OPEN
        - value: logged
          label: LIST-LOGGED
        - value: returned
          label: LIST-RETURNED
        - value: blank
          label: No marker
      defaultValue: start
      hint: Each marker is a separate fictional snapshot.
  checks:
    - id: may-read
      label: Supplier permission verified
      field: permission
      operator: eq
      value: verified
    - id: own-contract
      label: Folder belongs to supplier
      field: folder
      operator: eq
      value: own
    - id: signed-copy
      label: Signed schedule available
      field: edition
      operator: eq
      value: signed
    - id: before-list
      label: No list logged yet
      field: marker
      operator: eq
      value: start
    - id: after-list
      label: List logged
      field: marker
      operator: eq
      value: logged
    - id: needs-repair
      label: List returned
      field: marker
      operator: eq
      value: returned
  rules:
    - id: verify-permission
      label: Check supplier permission first
      all:
        - checkId: may-read
          equals: false
      outcomeId: no-folder-view
    - id: verify-owner
      label: Require own-contract scope
      all:
        - checkId: own-contract
          equals: false
      outcomeId: no-folder-view
    - id: verify-edition
      label: Stop on an uncertain edition
      all:
        - checkId: signed-copy
          equals: false
      outcomeId: incomplete-folder
    - id: read-slip
      label: Read a returned-item marker first
      all:
        - checkId: needs-repair
          equals: true
      outcomeId: repair-list
    - id: read-certificate
      label: Advance after the logged list
      all:
        - checkId: after-list
          equals: true
      outcomeId: origin-certificate
    - id: read-delivery
      label: Read the opening milestone
      all:
        - checkId: before-list
          equals: true
      outcomeId: packing-list
    - id: no-date
      label: "No supported marker: give no date"
      all: []
      outcomeId: incomplete-folder
  outcomes:
    - id: packing-list
      title: "Next: bundle packing list"
      summary: MR-41 points to RM-41/B line D1, clause 3.1. Give the receiving desk the bundle packing list by 12 May 2031. For an error, send the Repairs Desk a Correction Slip quoting D1 and edition B.
      documentIds:
        - reed-mat-schedule
        - milestone-register
        - supplier-folder-guide
    - id: origin-certificate
      title: "Next: fibre-origin certificate"
      summary: MR-41 records the list. RM-41/B line C2, clause 3.4 now calls for the fibre-origin certificate by 19 May 2031. To correct it, quote C2 and edition B on a Repairs Desk Correction Slip.
      documentIds:
        - reed-mat-schedule
        - milestone-register
        - supplier-folder-guide
    - id: repair-list
      title: Correct the packing list before the certificate
      summary: Return the corrected bundle identifier with slip CS-14 to the Repairs Desk, quoting RM-41/B line D1. Clause 5.2 keeps the D1 date of 12 May 2031; the return does not extend it.
      documentIds:
        - reed-mat-schedule
        - milestone-register
        - supplier-folder-guide
    - id: incomplete-folder
      title: No dated next item
      summary: Ask the receiving desk for the signed edition and the current register marker. Until both are available, the next item and its date are unknown.
      documentIds:
        - supplier-folder-guide
    - id: no-folder-view
      title: Public guide only
      summary: No contract details are available in this view. The public guide explains how schedules and Correction Slips work.
      documentIds:
        - supplier-folder-guide
  cases:
    - id: opening-list
      title: Read the first delivery line
      inputs:
        permission: verified
        folder: own
        edition: signed
        marker: start
      expected:
        outcomeId: packing-list
        documentIds:
          - reed-mat-schedule
          - milestone-register
          - supplier-folder-guide
        kind: answer
        contains:
          - bundle packing list by 12 May 2031
          - Repairs Desk
    - id: certificate-next
      title: Move from the list to its certificate
      inputs:
        permission: verified
        folder: own
        edition: signed
        marker: logged
      expected:
        outcomeId: origin-certificate
        documentIds:
          - reed-mat-schedule
          - milestone-register
          - supplier-folder-guide
        kind: answer
        contains:
          - fibre-origin certificate by 19 May 2031
          - C2
    - id: returned-marker
      title: Repair the returned list
      inputs:
        permission: verified
        folder: own
        edition: signed
        marker: returned
      expected:
        outcomeId: repair-list
        documentIds:
          - reed-mat-schedule
          - milestone-register
          - supplier-folder-guide
        kind: answer
        contains:
          - slip CS-14
          - 12 May 2031
          - does not extend
    - id: empty-marker
      title: No register marker
      inputs:
        permission: verified
        folder: own
        edition: signed
        marker: blank
      expected:
        outcomeId: incomplete-folder
        documentIds:
          - supplier-folder-guide
        kind: answer
        contains:
          - next item and its date are unknown
    - id: unsigned-copy
      title: Ignore the marker on an uncertain edition
      inputs:
        permission: verified
        folder: own
        edition: unclear
        marker: logged
      expected:
        outcomeId: incomplete-folder
        documentIds:
          - supplier-folder-guide
        kind: answer
        contains:
          - signed edition
    - id: register-off
      title: Selected schedule without the register
      inputs:
        permission: verified
        folder: own
        edition: signed
        marker: start
      expected:
        outcomeId: packing-list
        documentIds: []
        kind: missing-knowledge
        contains:
          - "Run blocked:"
          - MR-41
      disabledKnowledge:
        - milestone-register
    - id: other-folder
      title: Different supplier folder
      inputs:
        permission: verified
        folder: different
        edition: signed
        marker: returned
      expected:
        outcomeId: no-folder-view
        documentIds:
          - supplier-folder-guide
        kind: answer
        contains:
          - No contract details are available
    - id: supplier-denied
      title: Denied even when the folder matches
      inputs:
        permission: denied
        folder: own
        edition: signed
        marker: start
      expected:
        outcomeId: no-folder-view
        documentIds:
          - supplier-folder-guide
        kind: answer
        contains:
          - Public guide only
implementation:
  - title: Build this in the real service
    description: Separate the public folder guide from supplier folders. A real service would enforce the supplier-to-contract entitlement at the source, not trust a folder name entered in chat.
  - title: What to measure
    description: Check whether learners can cite the marker and the dated clause separately, and whether a correction preserves the original due date.
  - title: Scope of this draft
    description: This is a simulated own-contract view, not legal advice. It cannot file a correction, change a deadline or show another supplier’s records. This local exercise uses fictional evidence; it does not access a live system or make an official determination. The Microsoft Learn reference is about agent authoring, not municipal policy.
