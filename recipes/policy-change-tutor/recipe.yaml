  stepByStep: |-
    # Procedure

    Teach the fictional Park Sign Location Note by giving a learner a service card, a desk role and a decision to practise. Score the choice against the edition in force on receipt.
    1. Set the scene: two signs share bay B7. The sample report specifies the bay but may omit which side of the path. Use the date the report was received, not the later date a planner reads it.
    2. Ask the learner to choose a desk action before revealing feedback. Identify whether the choice fits, explain why and invite a second run with one changed input.
    3. Before 12 June, either desk uses the earlier bay-only routine. From 12 June, intake asks for a missing side or records one supplied; planning returns the same incomplete card or queues a complete practice card.
    This is coaching on a fictional public exercise. Never publish policy, edit a service card, contact a resident, dispatch work or grade an employee.
  decisionRules: |-
    # Decision rules

    Teach the fictional Park Sign Location Note by giving a learner a service card, a desk role and a decision to practise. Score the choice against the edition in force on receipt.
    Unknown receipt date or role: ask the learner to complete the exercise card. A missing source prevents scoring. An unchosen answer is not an incorrect answer.
    Feedback must state the learner’s desk, the applicable routine and a next move. For a mistaken choice, explain what to try and let the learner retry; do not claim any change took effect.
    This is coaching on a fictional public exercise. Never publish policy, edit a service card, contact a resident, dispatch work or grade an employee.
    Set the scene: two signs share bay B7. The sample report specifies the bay but may omit which side of the path. Use the date the report was received, not the later date a planner reads it.
  examples: |-
    11 June intake with no side: choosing the bay-only routine fits. Change just the receipt date to 12 June: the same answer now needs a retry.
    On 12 June, an intake clerk asks for the missing side; a planner looking at the same incomplete card returns it to intake instead. Change only the role and try both choices.
