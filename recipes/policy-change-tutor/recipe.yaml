schemaVersion: 1
revision: 1
id: policy-change-tutor
status: published
title: Policy change practice tutor
summary: Practise the 12 June cutover for a faded park sign at bay B7. Choose an action as the intake clerk or works planner and get feedback on that choice, not just a policy summary.
industry: Government and public services
difficulty: beginner
accentIcon: learning
learningGoals:
  - Try the bay-only answer on cards received on 11 and 12 June. Use the receipt stamp, not the common review date, to explain the different feedback.
  - On a revised B7 card with no side, choose the intake question. Switch to planning and retry by returning the same card rather than guessing a sign.
  - Distinguish a stated canal side from a blank or unreadable box. Explain when planning can queue the practice card and when the tutor needs clarification before scoring.
sourceUrl: https://learn.microsoft.com/en-us/microsoft-copilot-studio/authoring-instructions
scenario:
  group:
    journey: The public servant journey
    perspective: operations
  headline: Two signs share bay B7. When is the bay code enough?
  problem: On 13 June a planner opens a report about a faded sign at bay B7. One sign faces the canal and another faces the garden. Yesterday the location note changed. To know whether a side is missing, the planner needs the date intake received the report, not the date it reached their desk.
  impact: Applying the new note by review date would send an older report back for information it never needed. Guessing the side on a newer report could point the planner to the wrong sign.
  approach: Choose a desk action before reading the tutor’s feedback. The bay code alone fits a card received before 12 June 2032. From that date, intake asks for a missing side or records the one supplied. Planning returns the same incomplete card to intake or uses both labels to queue the practice card.
  startSmall: Try the bay-only action as an intake clerk on the 11 June card. Move the receipt stamp forward one day without changing the answer. Read why the tutor asks for a retry, then choose the question that would resolve the missing side.
  potentialValue: Staff can rehearse a change at the point where it affects their own desk, without asking a resident twice or opening a second report for the same sign.
  measure: Compare the feedback for the same answer across the cutover, then across desks on the same revised card. Check that an unreadable receipt stamp prompts clarification and that leaving the move unchosen does not count as a wrong answer.
  boundary: The location note, roles and cards are fictional. Choosing to ask, return or queue is a practice answer. It does not contact a resident, edit a report, dispatch work, publish policy or assess an employee.
  sourceLabel: "Microsoft Learn: authoring instructions in Copilot Studio (product reference)"
  home:
    challenge: Two signs stand at B7. A planner reviewing a faded-sign report after the rule changes needs to know whether the bay alone was enough when it arrived.
    experiment: Try the same bay-only answer with an 11 June stamp and a 12 June stamp. On the later card, swap intake for planning and retry the missing-side decision.
    takeaway: The receipt date selects the rule. Under the revision, intake asks which side; planning returns the same incomplete card rather than opening another.
    scope: The B7 report and both editions are invented. Returning or queuing a card gives feedback on a choice; no report changes and no work is dispatched.
agent:
  name: Policy change practice tutor
  description: Teach the fictional Park Sign Location Note by giving a learner a service card, a desk role and a decision to practise. Score the choice against the edition in force on receipt.
  instructions: |-
    # Purpose and operating boundaries

    Teach the fictional Park Sign Location Note by giving a learner a service card, a desk role and a decision to practise. Score the choice against the edition in force on receipt.
    Set the scene: two signs share bay B7. The sample report specifies the bay but may omit which side of the path. Use the date the report was received, not the later date a planner reads it.
    Ask the learner to choose a desk action before revealing feedback. Identify whether the choice fits, explain why and invite a second run with one changed input.
    Before 12 June, either desk uses the earlier bay-only routine. From 12 June, intake asks for a missing side or records one supplied; planning returns the same incomplete card or queues a complete practice card.
    This is coaching on a fictional public exercise. Never publish policy, edit a service card, contact a resident, dispatch work or grade an employee.
  tone: friendly
  detail: concise
instructionStyles:
  structured: |-
    # Purpose and operating boundaries

    Teach the fictional Park Sign Location Note by giving a learner a service card, a desk role and a decision to practise. Score the choice against the edition in force on receipt.
    Set the scene: two signs share bay B7. The sample report specifies the bay but may omit which side of the path. Use the date the report was received, not the later date a planner reads it.
