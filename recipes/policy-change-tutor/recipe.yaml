lab:
  title: Your move at bay B7
  description: "Report: “The lettering on a sign at bay B7 has faded.” Two signs share the bay. Read the card as the named desk and select your own next move before running it."
  fields:
    - id: role
      label: Your practice role
      type: select
      options:
        - value: intake
          label: Intake clerk
        - value: planning
          label: Works planner
        - value: unknown
          label: Role not specified
      defaultValue: intake
      hint: These are learning roles on a public exercise, not access to a staff record.
    - id: received
      label: Receipt stamp on this service card
      type: select
      options:
        - value: june-11
          label: 11 June 2032
        - value: june-12
          label: 12 June 2032
        - value: june-13
          label: 13 June 2032
        - value: unknown
          label: Stamp unreadable
      defaultValue: june-11
      hint: All cards are reviewed on 13 June; only the receipt stamp varies.
    - id: side
      label: What the report says after “bay B7”
      type: select
      options:
        - value: blank
          label: No side given
        - value: canal
          label: Canal side
        - value: unreadable
          label: Cannot read the box
      defaultValue: blank
      hint: Unreadable is not the same as a confirmed blank.
    - id: move
      label: Which action would you take?
      type: select
      options:
        - value: bay
          label: Use the bay code under the earlier routine
        - value: ask
          label: Ask which side and keep the intake card open
        - value: record
          label: Record the supplied side beside the bay code
        - value: return
          label: Return the same card to intake for the side
        - value: queue
          label: Queue practice work with the bay and supplied side
        - value: skip
          label: I have not chosen yet
      defaultValue: bay
      hint: Replace the loaded answer to test your own choice; no work is dispatched.
  checks:
    - id: no-stamp
      label: Receipt stamp unreadable
      field: received
      operator: eq
      value: unknown
    - id: before
      label: Card predates the cutover
      field: received
      operator: eq
      value: june-11
    - id: intake-desk
      label: Acting as intake
      field: role
      operator: eq
      value: intake
    - id: planning-desk
      label: Acting as planning
      field: role
      operator: eq
      value: planning
    - id: no-role
      label: No practice role
      field: role
      operator: eq
      value: unknown
    - id: side-blank
      label: Report does not give a side
      field: side
      operator: eq
      value: blank
    - id: side-shown
      label: Canal side supplied
      field: side
      operator: eq
      value: canal
    - id: not-attempted
      label: No move chosen
      field: move
      operator: eq
      value: skip
    - id: chose-bay
      label: "Learner: Use the bay code under the earlier routine"
      field: move
      operator: eq
      value: bay
    - id: chose-ask
      label: "Learner: Ask which side and keep the intake card open"
      field: move
      operator: eq
      value: ask
    - id: chose-record
      label: "Learner: Record the supplied side beside the bay code"
      field: move
      operator: eq
      value: record
    - id: chose-return
      label: "Learner: Return the same card to intake for the side"
      field: move
      operator: eq
      value: return
    - id: chose-queue
      label: "Learner: Queue practice work with the bay and supplied side"
      field: move
      operator: eq
      value: queue
  rules:
    - id: get-stamp
      label: Do not teach the wrong edition
      all:
        - checkId: no-stamp
          equals: true
      outcomeId: clarify-card
    - id: get-role
      label: Do not assume a desk role
      all:
        - checkId: no-role
          equals: true
      outcomeId: clarify-card
    - id: get-choice
      label: Invite an actual attempt
      all:
        - checkId: not-attempted
          equals: true
      outcomeId: choose-move
    - id: prior-fits
      label: "Choice fits: Use the earlier routine"
      all:
        - checkId: before
          equals: true
        - checkId: chose-bay
          equals: true
      outcomeId: prior-fits
    - id: prior-retry
      label: "Coach the learner: Use the earlier routine"
      all:
        - checkId: before
          equals: true
      outcomeId: prior-retry
    - id: ask-side-fits
      label: "Choice fits: Ask one intake question"
      all:
        - checkId: intake-desk
          equals: true
        - checkId: side-blank
          equals: true
        - checkId: chose-ask
          equals: true
      outcomeId: ask-side-fits
    - id: ask-side-retry
      label: "Coach the learner: Ask one intake question"
      all:
        - checkId: intake-desk
          equals: true
        - checkId: side-blank
          equals: true
      outcomeId: ask-side-retry
    - id: note-side-fits
      label: "Choice fits: Record the supplied side"
      all:
        - checkId: intake-desk
          equals: true
        - checkId: side-shown
          equals: true
        - checkId: chose-record
          equals: true
      outcomeId: note-side-fits
    - id: note-side-retry
      label: "Coach the learner: Record the supplied side"
      all:
        - checkId: intake-desk
          equals: true
        - checkId: side-shown
          equals: true
      outcomeId: note-side-retry
    - id: return-card-fits
      label: "Choice fits: Return the same card to intake"
      all:
        - checkId: planning-desk
          equals: true
        - checkId: side-blank
          equals: true
        - checkId: chose-return
          equals: true
      outcomeId: return-card-fits
    - id: return-card-retry
      label: "Coach the learner: Return the same card to intake"
      all:
        - checkId: planning-desk
          equals: true
        - checkId: side-blank
          equals: true
      outcomeId: return-card-retry
    - id: queue-card-fits
      label: "Choice fits: Use the two location labels"
      all:
        - checkId: planning-desk
          equals: true
        - checkId: side-shown
          equals: true
        - checkId: chose-queue
          equals: true
      outcomeId: queue-card-fits
    - id: queue-card-retry
      label: "Coach the learner: Use the two location labels"
      all:
        - checkId: planning-desk
          equals: true
        - checkId: side-shown
          equals: true
      outcomeId: queue-card-retry
    - id: unreadable-side
      label: Do not score an unclear revised card
      all: []
      outcomeId: clarify-card
  outcomes:
    - id: clarify-card
      title: Clarify the exercise card first
      summary: Confirm the receipt date, desk role and any unreadable side box needed by that edition. Do not infer the receipt stamp from the review date or score this attempt.
      documentIds:
        - sign-cutover
        - sign-practice
    - id: choose-move
      title: Choose a move before checking the answer
      summary: No attempt to score yet. Read the receipt stamp and your desk role, pick a next action and run the card again.
      documentIds:
        - sign-cutover
        - sign-practice
    - id: prior-fits
      title: "Correct: Use the earlier routine"
      summary: "Desk: {{role}}. Earlier routine. The card was received before 12 June 2032. For either desk, bay B7 is sufficient under the earlier routine. A later review date does not move the card to the new edition. Change one clue and try another move."
      documentIds:
        - sign-cutover
        - sign-practice
    - id: prior-retry
      title: "Try again: Use the earlier routine"
      summary: "Desk: {{role}}. Earlier routine. The card was received before 12 June 2032. For either desk, bay B7 is sufficient under the earlier routine. A later review date does not move the card to the new edition. Pick the move that matches that responsibility and run the same card again."
      documentIds:
        - sign-cutover
        - sign-practice
    - id: ask-side-fits
      title: "Correct: Ask one intake question"
      summary: "Desk: {{role}}. Revised routine: receipt on or after 12 June. At intake, ask “Is the sign on the canal side or the garden side of bay B7?” Keep this card open; do not guess a side or create a second report. Change one clue and try another move."
      documentIds:
        - sign-cutover
        - sign-practice
    - id: ask-side-retry
      title: "Try again: Ask one intake question"
      summary: "Desk: {{role}}. Revised routine: receipt on or after 12 June. At intake, ask “Is the sign on the canal side or the garden side of bay B7?” Keep this card open; do not guess a side or create a second report. Pick the move that matches that responsibility and run the same card again."
      documentIds:
        - sign-cutover
        - sign-practice
    - id: note-side-fits
      title: "Correct: Record the supplied side"
      summary: "Desk: {{role}}. Revised routine: receipt on or after 12 June. At intake, record B7 and canal side together on this card. The resident has already supplied the side; there is no reason to ask again. Change one clue and try another move."
      documentIds:
        - sign-cutover
        - sign-practice
    - id: note-side-retry
      title: "Try again: Record the supplied side"
      summary: "Desk: {{role}}. Revised routine: receipt on or after 12 June. At intake, record B7 and canal side together on this card. The resident has already supplied the side; there is no reason to ask again. Pick the move that matches that responsibility and run the same card again."
      documentIds:
        - sign-cutover
        - sign-practice
    - id: return-card-fits
      title: "Correct: Return the same card to intake"
      summary: "Desk: {{role}}. Revised routine: receipt on or after 12 June. At planning, return the same card to intake for the missing side. Do not choose a side, open a duplicate or place the practice work in the queue yet. Change one clue and try another move."
      documentIds:
        - sign-cutover
        - sign-practice
    - id: return-card-retry
      title: "Try again: Return the same card to intake"
      summary: "Desk: {{role}}. Revised routine: receipt on or after 12 June. At planning, return the same card to intake for the missing side. Do not choose a side, open a duplicate or place the practice work in the queue yet. Pick the move that matches that responsibility and run the same card again."
      documentIds:
        - sign-cutover
        - sign-practice
    - id: queue-card-fits
      title: "Correct: Use the two location labels"
      summary: "Desk: {{role}}. Revised routine: receipt on or after 12 June. At planning, queue the practice work with B7 and canal side on the existing card. Planning uses the supplied location; it does not need to ask intake to obtain it again. Change one clue and try another move."
      documentIds:
        - sign-cutover
        - sign-practice
    - id: queue-card-retry
      title: "Try again: Use the two location labels"
      summary: "Desk: {{role}}. Revised routine: receipt on or after 12 June. At planning, queue the practice work with B7 and canal side on the existing card. Planning uses the supplied location; it does not need to ask intake to obtain it again. Pick the move that matches that responsibility and run the same card again."
      documentIds:
        - sign-cutover
        - sign-practice
  cases:
    - id: pre-change
      title: "B7 received on 11 June: test the bay-only move"
      inputs:
        role: intake
        received: june-11
        side: blank
        move: bay
      expected:
        outcomeId: prior-fits
