facts:
  - id: receipt-date
    documentId: sign-cutover
    keywords:
      - Does the receipt date or review date set the sign routine
    answer: Use the date the report was received. The revised routine starts with reports received on 12 June 2032, not reports first reviewed that day.
    detail: For a report received on 11 June, the earlier bay-only routine remains in use even when someone reads it after the change.
  - id: desk-duties
    documentId: sign-cutover
    keywords:
      - Who clarifies a missing side on the revised sign card
    answer: Intake asks which side of the bay is meant. Planning returns an incomplete card to intake on the same reference rather than guessing or opening a duplicate.
    detail: For a side already supplied, intake records it with the bay code and planning uses both labels in the practice queue.
  - id: try-practice
    documentId: sign-practice
    keywords:
      - How can I practise the B7 service case
    answer: Open Review and load the B7 example. Read the role, receipt stamp and side box, choose a desk action, then run it to see the feedback.
    detail: Keep the same answer and switch only the receipt date from 11 to 12 June. Try another run with the role swapped and explain what changed.
