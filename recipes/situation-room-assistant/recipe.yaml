lab:
  title: Two slips at the end of a shift
  description: Use fictional stationery-desk reports only. The shift window on 12 May 2025 is 12:00–14:00 UTC. Selecting the assigned reviewer is a scenario input, not sign-in.
  fields:
    - id: role
      label: Review scope
      type: select
      options:
        - value: assigned
          label: Assigned shift reviewer for this handover
        - value: other
          label: Not assigned to this handover
      defaultValue: other
      hint: Only the assigned exercise reviewer may see the mock handover.
    - id: subject
      label: Subject on the second slip
      type: select
      options:
        - value: revised desk sign
          label: A revised desk sign
        - value: delivery of the same paper forms
          label: Possibly the same forms delivery
        - value: subject missing
          label: Subject missing
      defaultValue: subject missing
      hint: Choose the relation to the first observation; the original slips stay separate.
    - id: origin
      label: Source on the second slip
      type: select
      options:
        - value: signed first-hand print desk note
          label: Signed first-hand note from print desk
        - value: forwarded copy without its original
          label: Forwarded copy; original unavailable
        - value: source unknown
          label: No traceable source
      defaultValue: source unknown
      hint: A forwarded copy is not independent confirmation.
    - id: observed
      label: Observation time on the second slip
      type: select
      options:
        - value: 12 May 2025 at 13:50 UTC
          label: 12 May 2025, 13:50 UTC (inside exercise shift)
        - value: 11 May 2025 at 13:50 UTC
          label: 11 May 2025, 13:50 UTC (previous day)
        - value: not recorded
          label: Observation time missing
      defaultValue: not recorded
      hint: Use time observed, not time received.
  checks:
    - id: assigned
      label: Within assigned review scope
      field: role
      operator: eq
      value: assigned
    - id: overlap
      label: Possible common observation
      field: subject
      operator: eq
      value: delivery of the same paper forms
    - id: distinct
      label: Different subject stated
      field: subject
      operator: eq
      value: revised desk sign
    - id: original
      label: First-hand source established
      field: origin
      operator: eq
      value: signed first-hand print desk note
    - id: in-window
      label: Observation inside exercise shift
      field: observed
      operator: eq
      value: 12 May 2025 at 13:50 UTC
    - id: prior
      label: Observation from prior day
      field: observed
      operator: eq
      value: 11 May 2025 at 13:50 UTC
  rules:
    - id: role-first
      label: Stop outside the assigned review
      all:
        - checkId: assigned
          equals: false
      outcomeId: decline-access
    - id: preserve-overlap
      label: Keep possible repeats separate
      all:
        - checkId: overlap
          equals: true
      outcomeId: possible-repeat
    - id: older-observation
      label: Do not carry an older observation forward
      all:
        - checkId: prior
          equals: true
      outcomeId: historical-only
    - id: two-supported
      label: Keep two independently supported subjects
      all:
        - checkId: distinct
          equals: true
        - checkId: original
          equals: true
        - checkId: in-window
          equals: true
      outcomeId: review-two
    - id: hold-evidence
      label: Leave incomplete evidence unresolved
      all: []
      outcomeId: review-gap
  outcomes:
    - id: decline-access
      title: Outside assigned review scope
      summary: I cannot disclose reports, counts or handover details for this request.
      documentIds:
        - shift-handover-format
    - id: review-two
      title: Two supported observations for review
      summary: The slips describe different subjects. Both have first-hand sources and observation times inside the exercise shift. Review the draft; nothing was published.
      documentIds:
        - field-note-reading-key
        - shift-handover-format
      draft:
        title: Shift handover for human review
        body: |-
          Historical exercise cut-off: 12 May 2025 at 14:00 UTC.
          Confirmed for this shift: Slip A — the reception lead recorded receipt of blank enquiry forms, first-hand, 12 May 2025 at 13:40 UTC. Slip B — {{subject}}; source: {{origin}}; observation time: {{observed}}.
          Unverified or not current: None in the supplied pair.
          Question for the incoming reviewer: Do the originals support each line as written?
          Original slips stay separate. No dispatch.
    - id: possible-repeat
      title: Possible duplicate, not a second confirmed event
      summary: The forms delivery may be described twice. Preserve the source and time on both slips. Only the first observation is counted; the reviewer decides whether there is overlap.
      documentIds:
        - field-note-reading-key
        - shift-handover-format
      draft:
        title: Shift handover for human review
        body: |-
          Historical exercise cut-off: 12 May 2025 at 14:00 UTC.
          Confirmed for this shift: Slip A — the reception lead recorded receipt of blank enquiry forms, first-hand, 12 May 2025 at 13:40 UTC.
          Unverified or not current: Slip B — {{subject}}; source: {{origin}}; observation time: {{observed}}. Possible duplicate; a second delivery is not confirmed.
          Question for the incoming reviewer: Do the original slips describe one delivery or two?
          Original slips stay separate. No dispatch.
    - id: historical-only
      title: Prior observation, not current confirmation
      summary: The second observation predates the shift. Keep its original provenance in the review copy but do not carry it forward as a current condition.
      documentIds:
        - field-note-reading-key
        - shift-handover-format
      draft:
        title: Shift handover for human review
        body: |-
          Historical exercise cut-off: 12 May 2025 at 14:00 UTC.
          Confirmed for this shift: Slip A — the reception lead recorded receipt of blank enquiry forms, first-hand, 12 May 2025 at 13:40 UTC.
          Unverified or not current: Slip B — {{subject}}; source: {{origin}}; observation time: {{observed}}. Historical, not confirmed for this shift.
          Question for the incoming reviewer: Is there a dated observation inside this shift?
          Original slips stay separate. No dispatch.
    - id: review-gap
      title: Second slip remains unverified
      summary: A distinct subject, first-hand source and in-shift observation time have not all been established. Keep the second slip separate; do not fill the gap from the first.
      documentIds:
        - field-note-reading-key
        - shift-handover-format
      draft:
        title: Shift handover for human review
        body: |-
          Historical exercise cut-off: 12 May 2025 at 14:00 UTC.
          Confirmed for this shift: Slip A — the reception lead recorded receipt of blank enquiry forms, first-hand, 12 May 2025 at 13:40 UTC.
          Unverified or not current: Slip B — {{subject}}; source: {{origin}}; observation time: {{observed}}. Not confirmed.
          Question for the incoming reviewer: Which original establishes the missing subject, source or observation time?
          Original slips stay separate. No dispatch.
  cases:
    - id: separate-subjects
      title: Prepare a two-subject handover
      inputs:
        role: assigned
        subject: revised desk sign
        origin: signed first-hand print desk note
        observed: 12 May 2025 at 13:50 UTC
      expected:
        outcomeId: review-two
        documentIds:
          - field-note-reading-key
          - shift-handover-format
        kind: answer
        contains:
          - "Confirmed for this shift:"
          - revised desk sign
          - "Unverified or not current: None"
    - id: possible-duplicate
      title: Preserve two slips about the same delivery
      inputs:
        role: assigned
        subject: delivery of the same paper forms
        origin: forwarded copy without its original
        observed: 12 May 2025 at 13:50 UTC
      expected:
        outcomeId: possible-repeat
        documentIds:
          - field-note-reading-key
          - shift-handover-format
        kind: answer
        contains:
          - a second delivery is not confirmed
          - forwarded copy without its original
          - No dispatch
    - id: old-note
      title: Do not promote the previous day’s observation
      inputs:
        role: assigned
        subject: revised desk sign
        origin: signed first-hand print desk note
        observed: 11 May 2025 at 13:50 UTC
      expected:
        outcomeId: historical-only
        documentIds:
          - field-note-reading-key
          - shift-handover-format
        kind: answer
        contains:
          - 11 May 2025 at 13:50 UTC
          - Historical, not confirmed for this shift
    - id: source-gap
      title: Review an unattributed and undated second slip
      inputs:
        role: assigned
        subject: revised desk sign
        origin: source unknown
        observed: not recorded
      expected:
        outcomeId: review-gap
        documentIds:
          - field-note-reading-key
          - shift-handover-format
        kind: answer
        contains:
          - source unknown
          - Not confirmed
    - id: outside-shift
      title: Decline a viewer outside the review scope
      inputs:
        role: other
        subject: revised desk sign
        origin: signed first-hand print desk note
        observed: 12 May 2025 at 13:50 UTC
      expected:
        outcomeId: decline-access
        documentIds:
          - shift-handover-format
        kind: answer
        contains:
          - I cannot disclose reports, counts or handover details
    - id: source-guide-removed
      title: Try preparing a handover without its reading key
      inputs:
        role: assigned
        subject: revised desk sign
        origin: signed first-hand print desk note
        observed: 12 May 2025 at 13:50 UTC
      expected:
        outcomeId: review-two
        documentIds: []
        kind: missing-knowledge
        contains:
          - Run blocked
      disabledKnowledge:
        - field-note-reading-key
implementation:
  - title: Build this in the real service
    description: Have shift supervisors define which sources support a confirmed entry, who can review originals, and how an unresolved duplicate stays visible at shift change.
  - title: What to measure
    description: Count false confirmations from stale or copied slips, possible duplicates silently combined, and handover entries lacking an attributable source or observation time.
  - title: Scope of this draft
    description: No live incident feed, autonomous merge, deployment decision, dispatch or publication. This local exercise uses fictional evidence; it does not access a live system or make an official determination. The Microsoft Learn reference is about agent authoring, not municipal policy.
