knowledge:
  - id: field-note-reading-key
    title: Reading two field slips
    summary: Keep each original slip intact. Note the stated observer or desk, whether the report was first-hand or forwarded, what was observed and when it was observed. Record intake time separately. Receiving two messages does not mean two people observed an event.
    connectionId: evidence-library
    resourceId: alderfen-library
    file: documents/field-note-reading-key.txt
  - id: shift-handover-format
    title: The incoming shift handover sheet
    summary: The handover sheet is a review copy for the assigned exercise shift reviewer. Outside that role, do not show notes, counts or whether a note exists. An exercise role selection is not authentication. General training can describe the format without quoting cases.
    connectionId: evidence-library
    resourceId: alderfen-library
    file: documents/shift-handover-format.txt
facts:
  - id: compare-repeats
    documentId: field-note-reading-key
    keywords:
      - How should I handle two slips that may describe one observation
    answer: Keep both original slips, mark possible overlap and do not count the second as another confirmed observation.
    detail: Compare the subject, observer and observation time. A forwarded copy can repeat an original without adding an independent witness; leave any reconciliation to the reviewer.
  - id: read-the-clock
    documentId: field-note-reading-key
    keywords:
      - Which timestamp matters when deciding whether a note is current
    answer: Compare the time of observation with the shift window. A fresh intake timestamp tells you only when the message arrived.
    detail: If observation time is absent or outside the window, mark the note unverified for this shift or historical. Ask for a dated observation instead of silently carrying the note forward.
  - id: structure-sheet
    documentId: shift-handover-format
    keywords:
      - What belongs in the confirmed and unverified handover sections
    answer: List supported observations with their source and observation time under confirmed. Put uncertainty, possible overlap and stale observations under a separate heading.
    detail: State the exercise cut-off, retain the original slips and end with a question for the incoming reviewer. Do not dispatch or publish from the draft.
