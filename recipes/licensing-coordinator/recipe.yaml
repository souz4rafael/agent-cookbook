lab:
  title: Follow the frontage drawing, not the largest suffix
  description: Compare two desk register entries with the status of the single correction thread. Test what changes when only one desk has adopted the verified revision.
  fields:
    - id: mandate
      label: Simulated coordination authority
      type: select
      options:
        - value: both
          label: Verified for this application, both registers and correction routing
        - value: one
          label: One desk only
        - value: unknown
          label: Authority not verified
      defaultValue: both
      hint: No real account is checked. Selecting a desk role alone would not confer this scope.
    - id: markets
      label: "Markets register: frontage drawing"
      type: select
      options:
        - value: C2
          label: "C2: earlier copy"
        - value: C3
          label: "C3: other desk copy"
        - value: C4
          label: "C4: replacement reference"
        - value: unknown
          label: Register line unreadable
      defaultValue: C2
      hint: Read the register label, not the date on an inbox attachment.
    - id: streets
      label: "Street Use register: frontage drawing"
      type: select
      options:
        - value: C2
          label: "C2: earlier copy"
        - value: C3
          label: "C3: other desk copy"
        - value: C4
          label: "C4: replacement reference"
        - value: unknown
          label: Register line unreadable
      defaultValue: C3
      hint: A register can still point to an earlier copy after a replacement is verified.
    - id: thread
      label: Single correction thread
      type: select
      options:
        - value: none
          label: "Checked: no request open"
        - value: open
          label: Open; no verified return
        - value: verified
          label: Custodian verified replacement C4
        - value: unknown
          label: Thread status unknown
      defaultValue: none
      hint: A return without the custodian check is still open, not verified.
  checks:
    - id: full-scope
      label: Exact coordination scope verified
      field: mandate
      operator: eq
      value: both
    - id: market-gap
      label: Markets line unreadable
      field: markets
      operator: eq
      value: unknown
    - id: street-gap
      label: Street Use line unreadable
      field: streets
      operator: eq
      value: unknown
    - id: no-thread
      label: No open request after checking
      field: thread
      operator: eq
      value: none
    - id: waiting
      label: Open thread, no verified return
      field: thread
      operator: eq
      value: open
    - id: signed
      label: Replacement verified
      field: thread
      operator: eq
      value: verified
    - id: desk-match
      label: Desk labels match each other
      field: markets
      operator: eq
      otherField: streets
    - id: market-current
      label: Markets already cites C4
      field: markets
      operator: eq
      value: C4
    - id: street-current
      label: Street Use already cites C4
      field: streets
      operator: eq
      value: C4
  rules:
    - id: protect-registers
      label: Require scope for both desks first
      all:
        - checkId: full-scope
          equals: false
      outcomeId: access-stop
    - id: missing-markets
      label: Resolve unreadable Markets entry
      all:
        - checkId: market-gap
          equals: true
      outcomeId: inventory-hold
    - id: missing-street
      label: Resolve unreadable Street Use entry
      all:
        - checkId: street-gap
          equals: true
      outcomeId: inventory-hold
    - id: all-current
      label: Both references already current
      all:
        - checkId: signed
          equals: true
        - checkId: market-current
          equals: true
        - checkId: street-current
          equals: true
      outcomeId: no-resend
    - id: streets-lags
      label: Only Street Use still uses an old reference
      all:
        - checkId: signed
          equals: true
        - checkId: market-current
          equals: true
        - checkId: street-current
          equals: false
      outcomeId: street-review
    - id: markets-lags
      label: Only Markets still uses an old reference
      all:
        - checkId: signed
          equals: true
        - checkId: market-current
          equals: false
        - checkId: street-current
          equals: true
      outcomeId: market-review
    - id: both-lag
      label: Both desks still use old references
      all:
        - checkId: signed
          equals: true
        - checkId: market-current
          equals: false
        - checkId: street-current
          equals: false
      outcomeId: joint-review
    - id: already-open
      label: Do not duplicate an unresolved correction
      all:
        - checkId: waiting
          equals: true
      outcomeId: same-thread
    - id: split-no-thread
      label: Draft a single correction across the two desks
      all:
        - checkId: no-thread
          equals: true
        - checkId: desk-match
          equals: false
      outcomeId: one-request
    - id: otherwise-hold
      label: No basis to choose or redistribute a version
      all: []
      outcomeId: hold-version
  outcomes:
    - id: access-stop
      title: No register review
      summary: Use the authorised coordination route. No application information can be provided.
      documentIds:
        - version-control
    - id: inventory-hold
      title: Complete the register comparison first
      summary: Ask the register owner to verify the unreadable line. Do not choose a version or propose recipients from an incomplete inventory.
      documentIds:
        - version-control
        - canopy-register
    - id: one-request
      title: Draft one correction request
      summary: "One request for coordinator review: “Markets cites {{markets}} and Street Use cites {{streets}}. Which frontage drawing controls? Please return one dated, signed drawing identifying the copies it replaces.” Keep both references on one thread. This draft has not been sent."
      documentIds:
        - version-control
        - canopy-register
    - id: same-thread
      title: Keep the correction on the existing thread
      summary: The single request remains open. Record both register references for review; do not start a second request or route an unsigned attachment.
      documentIds:
        - version-control
        - canopy-register
    - id: joint-review
      title: Prepare C4 review for Markets and Street Use
      summary: The custodian has verified C4 on the correction thread. Propose the verified C4 pointer to both desks. Prepare a review case, not a licence decision.
      documentIds:
        - version-control
        - canopy-register
      toolId: stage-plan-review
      draft:
        title: Canopy drawing C4 | Markets and Street Use
        body: "For coordinator confirmation only. Verified replacement: C4, on the existing canopy correction thread. Register before review: Markets {{markets}}; Street Use {{streets}}. Affected desks: Markets and Street Use. Propose the verified C4 pointer to both desks. Retain the earlier references and request acknowledgement before closing the discrepancy. No notice or licence is issued."
    - id: street-review
      title: Prepare C4 review for Street Use
      summary: The custodian has verified C4 on the correction thread. Propose the verified C4 pointer to Street Use only; Markets already cites C4. Prepare a review case, not a licence decision.
      documentIds:
        - version-control
        - canopy-register
      toolId: stage-plan-review
      draft:
        title: Canopy drawing C4 | Street Use
        body: "For coordinator confirmation only. Verified replacement: C4, on the existing canopy correction thread. Register before review: Markets {{markets}}; Street Use {{streets}}. Affected desks: Street Use. Propose the verified C4 pointer to Street Use only; Markets already cites C4. Retain the earlier references and request acknowledgement before closing the discrepancy. No notice or licence is issued."
    - id: market-review
      title: Prepare C4 review for Markets
      summary: The custodian has verified C4 on the correction thread. Propose the verified C4 pointer to Markets only; Street Use already cites C4. Prepare a review case, not a licence decision.
      documentIds:
        - version-control
        - canopy-register
      toolId: stage-plan-review
      draft:
        title: Canopy drawing C4 | Markets
        body: "For coordinator confirmation only. Verified replacement: C4, on the existing canopy correction thread. Register before review: Markets {{markets}}; Street Use {{streets}}. Affected desks: Markets. Propose the verified C4 pointer to Markets only; Street Use already cites C4. Retain the earlier references and request acknowledgement before closing the discrepancy. No notice or licence is issued."
    - id: no-resend
      title: No replacement pointer needed
      summary: Both desk registers already cite the verified C4. Check any outstanding acknowledgement on the existing thread rather than sending another copy. This is not a licence decision.
      documentIds:
        - version-control
        - canopy-register
    - id: hold-version
      title: Hold for a custodian check
      summary: Confirm the correction thread and its controlling revision before proposing any action. Matching desk labels are not custodian verification; do not certify a copy or grant a licence.
      documentIds:
        - version-control
        - canopy-register
  cases:
    - id: split-drawings
      title: C2 and C3 with no open correction
      inputs:
        mandate: both
        markets: C2
        streets: C3
        thread: none
      expected:
        outcomeId: one-request
        documentIds:
          - version-control
          - canopy-register
        kind: answer
        contains:
          - Markets cites C2 and Street Use cites C3
          - one dated, signed drawing
    - id: returned-correction
      title: Same desks, now with a verified C4 return
      inputs:
        mandate: both
        markets: C2
        streets: C3
        thread: verified
      expected:
        outcomeId: joint-review
        documentIds:
          - version-control
          - canopy-register
        kind: handoff-ready
        contains:
          - "Affected desks: Markets and Street Use"
          - "Verified replacement: C4"
        toolId: stage-plan-review
    - id: open-already
      title: An unsigned attachment arrives on an open thread
      inputs:
        mandate: both
        markets: C2
        streets: C3
        thread: open
      expected:
        outcomeId: same-thread
        documentIds:
          - version-control
          - canopy-register
        kind: answer
        contains:
          - do not start a second request
    - id: street-only
      title: Markets has adopted the verified pointer
      inputs:
        mandate: both
        markets: C4
        streets: C3
        thread: verified
      expected:
        outcomeId: street-review
        documentIds:
          - version-control
          - canopy-register
        kind: handoff-ready
        contains:
          - to Street Use only
        toolId: stage-plan-review
    - id: market-only
      title: Street Use has adopted the verified pointer
      inputs:
        mandate: both
        markets: C2
        streets: C4
        thread: verified
      expected:
        outcomeId: market-review
        documentIds:
          - version-control
          - canopy-register
        kind: handoff-ready
        contains:
          - to Markets only
        toolId: stage-plan-review
    - id: both-done
      title: Both desks already cite C4
      inputs:
        mandate: both
        markets: C4
        streets: C4
        thread: verified
      expected:
        outcomeId: no-resend
        documentIds:
          - version-control
          - canopy-register
        kind: answer
        contains:
          - rather than sending another copy
    - id: unreadable
      title: A verified return but an unreadable desk line
      inputs:
        mandate: both
        markets: C2
        streets: unknown
        thread: verified
      expected:
        outcomeId: inventory-hold
        documentIds:
          - version-control
          - canopy-register
        kind: answer
        contains:
          - incomplete inventory
    - id: thread-unknown
      title: Nobody has checked the correction thread
      inputs:
        mandate: both
        markets: C2
        streets: C3
        thread: unknown
      expected:
        outcomeId: hold-version
        documentIds:
          - version-control
          - canopy-register
        kind: answer
        contains:
          - Confirm the correction thread
    - id: partial-scope
      title: One-desk scope is insufficient even for a verified return
      inputs:
        mandate: one
        markets: C2
        streets: C3
        thread: verified
      expected:
        outcomeId: access-stop
        documentIds:
          - version-control
        kind: answer
        contains:
          - No application information can be provided
    - id: queue-unavailable
      title: The drawing-review tool is switched off
      inputs:
        mandate: both
        markets: C2
        streets: C3
        thread: verified
      expected:
        outcomeId: joint-review
        documentIds:
          - version-control
          - canopy-register
        kind: handoff-blocked
        contains:
          - Action blocked
      disabledTools:
        - stage-plan-review
    - id: register-unavailable
      title: The register cannot ground a routing proposal
      inputs:
        mandate: both
        markets: C2
        streets: C3
        thread: verified
      expected:
        outcomeId: joint-review
        documentIds: []
        kind: missing-knowledge
        contains:
          - Run blocked
      disabledKnowledge:
        - canopy-register
implementation:
  - title: Build this in the real service
    description: Separate the custodian who verifies the controlling drawing from the coordinator who prepares the routing record. Enforce application and desk scope server-side; deduplicate on the application and correction thread, and retain the revision history.
  - title: What to measure
    description: Check proposed recipient sets against the desks still holding old copies. Count duplicate correction drafts per open thread, unverified revisions offered for routing and any licence-decision language.
  - title: Scope of this draft
    description: Coordinate version review only. Do not determine compliance, grant a licence, distribute a real application or claim that a desk has been notified. This local exercise uses fictional evidence; it does not access a live system or make an official determination. The Microsoft Learn reference is about agent authoring, not municipal policy.
