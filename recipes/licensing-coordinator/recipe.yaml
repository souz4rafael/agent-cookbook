conversations:
  - schemaVersion: 1
    revision: 1
    id: guided-example
    title: Licensing version coordinator
    mode: simulated
    starter:
      label: Show me how to reconcile two desk copies.
      prompt: Show me how to reconcile two desk copies.
    variationPolicy: stable-per-session
    onUnexpectedInput: stay-and-guide
    variables: {}
    steps:
      - id: clarify
        role: assistant
        variants:
          - id: direct
            text: Would you like to practise asking for one correction or recognising a verified replacement?
