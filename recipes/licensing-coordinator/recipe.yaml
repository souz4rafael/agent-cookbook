  - id: version-control
    title: "Public procedure: one correction thread"
    summary: The unit of correction is the application drawing, not the number of departments that spotted the discrepancy.
    connectionId: evidence-library
    resourceId: alderfen-library
    file: documents/version-control.txt
  - id: canopy-register
    title: "Canopy application: desk register exercise"
    summary: One synthetic covered-market application has two desks that rely on the same frontage drawing.
    connectionId: evidence-library
    resourceId: alderfen-library
    file: documents/canopy-register.txt
facts:
  - id: single-thread
    documentId: version-control
    keywords:
      - Why use one drawing correction thread
    answer: One thread lets both desks refer to the same question and the same eventual replacement. If a correction is already open, do not draft a second request.
    detail: Keep the conflicting references and identify the feature in dispute. Ask for one dated, signed replacement through the existing procedure, not a separate answer for each desk.
  - id: verified-copy
    documentId: version-control
    keywords:
      - Does the highest drawing number prove it is current
    answer: No. The custodian must verify the application, drawing and signed revision before its pointer can be proposed for routing.
    detail: Compare the verified pointer against each authorised desk register. A desk already using it does not need another copy, and matching pointers do not establish compliance.
