  - id: notice-route-list
    title: Public notice route list · NR-8
    summary: NR-8 is the official route list within this fictional scheme; there is no live form or service.
    connectionId: evidence-library
    resourceId: alderfen-library
    file: documents/notice-route-list.txt
  - id: stall-notice-card
    title: Seasonal notice card · NC-62
    summary: Training card NC-62 identifies one active covered bay, B-16, in the Copper Rain season. Use only in a verified own-account simulation.
    connectionId: evidence-library
    resourceId: alderfen-library
    file: documents/stall-notice-card.txt
facts:
  - id: charge-basis
    documentId: covered-stall-tariff
    keywords:
      - What does the covered-stall charge pay for
    answer: It pays for upkeep of the shared market roof and drains. The fictional tariff sets 24 crowns per active covered bay per season; it does not cover open-air pitches.
    detail: A tariff explains the rule, not the bays registered to any particular account or its outstanding balance.
  - id: request-plan
    documentId: notice-route-list
    keywords:
      - How do I ask for instalments
    answer: For an issued notice, the listed instalment route is Plan Desk P1. Quote the notice reference and propose a payment schedule for the desk to consider.
    detail: Asking is not approval. The desk must review the request; the leaflet does not determine eligibility or change a balance.
  - id: fact-or-basis
    documentId: notice-route-list
    keywords:
      - How is a factual correction different from a challenge
    answer: For a wrong bay count or season, use Notice Desk C2 and identify the register fact to correct. To dispute the charging basis on an issued notice, give the Review Clerk your reasons through R3.
    detail: A correction can be raised on a working card. A challenge to the basis is an issued-notice route. Neither submission revises a balance on its own.
