schemaVersion: 1
revision: 1
id: tax-explainer
status: published
title: Alderfen tax explainer
summary: Explain a fictional covered-stall charge in plain English. Distinguish asking for time to pay, correcting a fact and challenging the basis of a notice.
industry: Government and public services
difficulty: beginner
accentIcon: citizen
learningGoals:
  - Explain which market bays the seasonal tariff covers and what their upkeep charge pays for, without reading the tariff as an account balance.
  - Match a request for time to pay, a wrong bay count and a dispute about the charging rule to the right desk and supporting information.
  - Use the stage on a verified reader’s own card to explain which routes apply before and after issue; use public guidance when the account match is unconfirmed.
sourceUrl: https://learn.microsoft.com/en-us/microsoft-copilot-studio/authoring-instructions
scenario:
  group:
    journey: Tax and revenue
    perspective: guidance
  headline: Does the stallholder need time to pay, a correction or a review?
  problem: A market trader reads the seasonal charge for a covered bay. The leaflet explains why the charge exists, but the trader thinks the bay count is wrong. A neighbour with the right count needs time to pay instead. Both need a next step, not another reading of the rate.
  impact: A trader who challenges the charging rule to fix a register error may reach the wrong desk without the extract needed to correct the count. Another may believe a payment plan is in place when the Plan Desk has yet to consider the request.
  approach: The public tariff explains upkeep of the market roof and drains. The route list explains who handles payment schedules, register corrections and challenges to the charging rule. Only in a verified reader’s own example does the guide use the notice card to say which routes apply at its stage.
  startSmall: Begin with one seasonal tariff and its three request routes. Follow a disputed bay count from the leaflet to the Notice Desk, then use the example card to see why a factual correction need not wait for an issued notice.
  potentialValue: Traders could approach the right desk with a register extract, proposed schedule or reason for review, leaving staff more time to consider the request itself.
  measure: Ask readers to choose a desk and name what to bring for each of the three questions. Check whether they can tell a request for instalments from an approved payment plan.
  boundary: The tariff explains a charge, not what a person still owes. Only the responsible desk can agree a plan, amend a notice or decide a challenge. The exercise neither looks up a real account nor files a request.
  sourceLabel: "Microsoft Learn: authoring Copilot Studio instructions (not the source of the fictional tariff or notice routes)"
  home:
    challenge: A wrong bay count and a disagreement with the market charge can sound like the same complaint, but they need different evidence and different desks.
    experiment: On your issued notice, switch from a wrong bay count to a disputed rule. Instead of a register extract for Notice Desk C2, the guide asks for the tariff clause and reasons for Review Clerk R3.
    takeaway: Choose a request route by what the trader wants reviewed and check whether that route is open on a working card or only on an issued notice.
    scope: A fictional market tariff and training notice. You can explore how to ask for instalments, not check a balance or secure a payment plan.
agent:
  name: Alderfen tax explainer
  description: Explain the Alderfen covered-stall charge and its published request routes. The public leaflet does not require an account.
  instructions: |-
    # Purpose and operating boundaries

    Explain the Alderfen covered-stall charge and its published request routes. The public leaflet does not require an account.
    Use only the tariff and official fictional route list in chat. Do not confirm an account, its stage or its balance.
    In the example, personal notice details require simulated account authority and an exact account match. Otherwise stay with the public leaflet.
    Distinguish a working card from an issued notice. Explain how to make a request; do not decide eligibility, settle a challenge or change an amount.
    Public guidance is available without account access. Only the authorised own-account lab view can describe a fictional notice stage. No balance changes here.
    Name the evidence behind the next step. If two records disagree, retain both accounts and explain what a person needs to verify. Do not treat an absent observation as a negative result or a completed decision.
  tone: friendly
  detail: concise
