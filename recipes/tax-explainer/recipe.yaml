lab:
  title: Read the leaflet or the notice?
  description: The public tariff is the same for everyone. To practise a stage-specific answer, select verified authority and the matching training account.
  fields:
    - id: access
      label: Reading authority
      type: select
      options:
        - value: public
          label: Public leaflet only
        - value: own
          label: Authorised own-account view
        - value: denied
          label: Access denied
        - value: unknown
          label: Authority unknown
      defaultValue: public
      hint: Only an authorised reader can see a personal stage.
    - id: account
      label: Account match
      type: select
      options:
        - value: matched
          label: Confirmed own account
        - value: other
          label: Different account
        - value: unknown
          label: Not established
      defaultValue: unknown
      hint: A notice reference in a question is not proof of account authority.
    - id: stage
      label: Notice stage on the card
      type: select
      options:
        - value: working
          label: Working card
        - value: issued
          label: Issued notice
        - value: absent
          label: No stage supplied
      defaultValue: absent
      hint: A missing stage is neither working nor issued.
    - id: question
      label: What is the reader asking?
      type: select
      options:
        - value: basis
          label: Explain the charge
        - value: plan
          label: Ask about instalments
        - value: correct
          label: Correct a register fact
        - value: challenge
          label: Challenge the basis
      defaultValue: basis
      hint: Choose a route by the purpose of the request.
  checks:
    - id: public-only
      label: Public leaflet requested
      field: access
      operator: eq
      value: public
    - id: authorised
      label: Account authority verified
      field: access
      operator: eq
      value: own
    - id: own-account
      label: Requested account matches
      field: account
      operator: eq
      value: matched
    - id: working
      label: Card marked working
      field: stage
      operator: eq
      value: working
    - id: issued
      label: Notice marked issued
      field: stage
      operator: eq
      value: issued
    - id: basis
      label: Reader asks why
      field: question
      operator: eq
      value: basis
    - id: plan
      label: Reader asks for time to pay
      field: question
      operator: eq
      value: plan
    - id: correct
      label: Reader disputes a fact
      field: question
      operator: eq
      value: correct
    - id: challenge
      label: Reader disputes the rule
      field: question
      operator: eq
      value: challenge
  rules:
    - id: leaflet-first
      label: Use public sources for a leaflet request
      all:
        - checkId: public-only
          equals: true
      outcomeId: public-leaflet
    - id: require-authority
      label: Require account authority
      all:
        - checkId: authorised
          equals: false
      outcomeId: public-only-view
    - id: require-account
      label: Require an own-account match
      all:
        - checkId: own-account
          equals: false
      outcomeId: public-only-view
    - id: not-issued
      label: Explain a working card without suggesting an issued notice
      all:
        - checkId: working
          equals: true
      outcomeId: working-card
    - id: explain-basis
      label: Read the charge basis
      all:
        - checkId: issued
          equals: true
        - checkId: basis
          equals: true
      outcomeId: notice-basis
    - id: explain-plan
      label: Identify the instalment request route
      all:
        - checkId: issued
          equals: true
        - checkId: plan
          equals: true
      outcomeId: notice-plan
    - id: explain-correction
      label: Identify the factual correction route
      all:
        - checkId: issued
          equals: true
        - checkId: correct
          equals: true
      outcomeId: notice-correction
    - id: explain-challenge
      label: Identify the basis challenge route
      all:
        - checkId: issued
          equals: true
        - checkId: challenge
          equals: true
      outcomeId: notice-challenge
    - id: no-stage
      label: Do not infer a notice stage
      all: []
      outcomeId: stage-unavailable
  outcomes:
    - id: public-leaflet
      title: Public covered-stall leaflet
      summary: LT-4 sets a seasonal upkeep charge of 24 crowns per active covered bay. The public guide lists Plan Desk P1 for instalments, Notice Desk C2 for corrections and Review Clerk R3 for challenges. These are request routes, not guaranteed outcomes.
      documentIds:
        - covered-stall-tariff
        - notice-route-list
    - id: public-only-view
      title: Public guidance only
      summary: No account details are available in this view. The fictional tariff is 24 crowns per active covered bay per season. The public guide lists Plan Desk P1 for instalments, Notice Desk C2 for corrections and Review Clerk R3 for challenges. These are request routes, not guaranteed outcomes.
      documentIds:
        - covered-stall-tariff
        - notice-route-list
    - id: working-card
      title: Working card, not an issued notice
      summary: NC-62 is a working card in this snapshot. Give Notice Desk C2 the disputed bay or season and a register extract to request a factual correction. Plan Desk P1 and Review Clerk R3 are listed for issued notices, not this stage. No balance is changed.
      documentIds:
        - stall-notice-card
        - notice-route-list
    - id: notice-basis
      title: Basis of the issued notice
      summary: NC-62 lists one active covered bay for Copper Rain. LT-4 clause 1 sets 24 crowns for that bay for the season. That explains the charge, not the outstanding balance.
      documentIds:
        - stall-notice-card
        - covered-stall-tariff
    - id: notice-plan
      title: "Instalments: ask the Plan Desk"
      summary: For issued notice NC-62, use Plan Desk P1. Quote the reference and propose a schedule. The desk decides; eligibility is not guaranteed and no balance has changed.
      documentIds:
        - stall-notice-card
        - notice-route-list
    - id: notice-correction
      title: "Wrong fact: ask the Notice Desk"
      summary: For NC-62, use Notice Desk C2. Name the bay count or season you think is wrong and include the register extract. The desk reviews it; this explanation does not amend the notice.
      documentIds:
        - stall-notice-card
        - notice-route-list
    - id: notice-challenge
      title: "Disputed basis: ask the Review Clerk"
      summary: For issued notice NC-62, use Review Clerk R3. Quote the disputed tariff clause and give your reasons. No challenge has been filed and the balance is unchanged.
      documentIds:
        - stall-notice-card
        - notice-route-list
    - id: stage-unavailable
      title: No stage-specific answer
      summary: The notice stage is not supplied. Do not assume that a notice has been issued. The public guide lists Plan Desk P1 for instalments, Notice Desk C2 for corrections and Review Clerk R3 for challenges. These are request routes, not guaranteed outcomes.
      documentIds:
        - notice-route-list
  cases:
    - id: why-issued
      title: Explain the charge, not the balance
      inputs:
        access: own
        account: matched
        stage: issued
        question: basis
      expected:
        outcomeId: notice-basis
        documentIds:
          - stall-notice-card
          - covered-stall-tariff
        kind: answer
        contains:
          - one active covered bay
          - 24 crowns
          - not the outstanding balance
    - id: working-not-appealable
      title: Distinguish a working card from an issued notice
      inputs:
        access: own
        account: matched
        stage: working
        question: challenge
      expected:
        outcomeId: working-card
        documentIds:
          - stall-notice-card
          - notice-route-list
        kind: answer
        contains:
          - working card
          - Notice Desk C2
          - not this stage
    - id: instalment-request
      title: An instalment enquiry is not approval
      inputs:
        access: own
        account: matched
        stage: issued
        question: plan
      expected:
        outcomeId: notice-plan
        documentIds:
          - stall-notice-card
          - notice-route-list
        kind: answer
        contains:
          - Plan Desk P1
          - eligibility is not guaranteed
    - id: wrong-count
      title: Ask to correct a register fact
      inputs:
        access: own
        account: matched
        stage: issued
        question: correct
      expected:
        outcomeId: notice-correction
        documentIds:
          - stall-notice-card
          - notice-route-list
        kind: answer
        contains:
          - Notice Desk C2
          - include the register extract
    - id: tariff-dispute
      title: Dispute the rule rather than the count
      inputs:
        access: own
        account: matched
        stage: issued
        question: challenge
      expected:
        outcomeId: notice-challenge
        documentIds:
          - stall-notice-card
          - notice-route-list
        kind: answer
        contains:
          - Review Clerk R3
          - balance is unchanged
    - id: missing-stage
      title: No stage on the card
      inputs:
        access: own
        account: matched
        stage: absent
        question: basis
      expected:
        outcomeId: stage-unavailable
        documentIds:
          - notice-route-list
        kind: answer
        contains:
          - notice stage is not supplied
    - id: directory-off
      title: Withhold an ungrounded route
      inputs:
        access: own
        account: matched
        stage: issued
        question: plan
      expected:
        outcomeId: notice-plan
        documentIds: []
        kind: missing-knowledge
        contains:
          - "Run blocked:"
          - NR-8
      disabledKnowledge:
        - notice-route-list
    - id: just-leaflet
      title: Read without an account
      inputs:
        access: public
        account: unknown
        stage: issued
        question: basis
      expected:
        outcomeId: public-leaflet
        documentIds:
          - covered-stall-tariff
          - notice-route-list
        kind: answer
        contains:
          - Public covered-stall leaflet
          - request routes
    - id: no-authority
      title: Denied personal view still offers the public leaflet
      inputs:
        access: denied
        account: matched
        stage: issued
        question: basis
      expected:
        outcomeId: public-only-view
        documentIds:
          - covered-stall-tariff
          - notice-route-list
        kind: answer
        contains:
          - No account details are available
          - Plan Desk P1
    - id: other-account
      title: Authority for one account cannot open another
      inputs:
        access: own
        account: other
        stage: working
        question: basis
      expected:
        outcomeId: public-only-view
        documentIds:
          - covered-stall-tariff
          - notice-route-list
        kind: answer
        contains:
          - No account details are available
implementation:
  - title: Build this in the real service
    description: Publish the leaflet independently of account tools. In a real service, verify the user’s authority for the account before reading a notice and check that the route directory is current.
  - title: What to measure
    description: Check route choice for a timing request, an incorrect bay count and a disputed tariff clause. Test that an unverified reader sees only the public leaflet at every stage.
  - title: Scope of this draft
    description: Public guidance is available without account access. Only the authorised own-account lab view can describe a fictional notice stage. No balance changes here. This local exercise uses fictional evidence; it does not access a live system or make an official determination. The Microsoft Learn reference is about agent authoring, not municipal policy.
