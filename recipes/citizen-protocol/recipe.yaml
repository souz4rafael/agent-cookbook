implementation:
  - title: Build this in the real service
    description: A real service would need separate public and case APIs. Enforce authenticated, record-scoped authorisation on the server before reading any case fields. Recheck create permission and consent on write; distinguish a successful receipt from a draft or uncertain result.
  - title: What to measure
    description: "In the simulator, compare denied replies across visitor and matched-holder inputs: they should be identical. Count a request only in the host’s local case history after confirmation, not when Preview offers a draft."
  - title: Scope of this draft
    description: Use only invented map tiles and exercise slips. No real identities, addresses, documents or case records; no live authentication, filing or publication. This local exercise uses fictional evidence; it does not access a live system or make an official determination. The Microsoft Learn reference is about agent authoring, not municipal policy.
