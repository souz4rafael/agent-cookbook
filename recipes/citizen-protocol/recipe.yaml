knowledge:
  - id: path-sign-intake
    title: "Path Sign counter: the public intake card"
    summary: Use this card to prepare a fictional request for a faded sign or a missing arrow on a printed practice map. It is a checklist, not a way to find an existing request.
    connectionId: evidence-library
    resourceId: alderfen-library
    file: documents/path-sign-intake.txt
  - id: two-counter-boundary
    title: "Two counters: public and case scope"
    summary: At the public counter anyone may read the intake card. It describes what to prepare, never who has applied. A new draft starts here and cannot carry over a previous case.
    connectionId: evidence-library
    resourceId: alderfen-library
    file: documents/two-counter-boundary.txt
  - id: practice-desk-slips
    title: Reading the three practice desk slips
    summary: Read these invented slips only as material for a matched-holder case-scope exercise. Colours select paper examples, not record IDs. All day numbers are exercise days, not calendar deadlines. “Due” names a particular actor and task; it is not necessarily a completion date.
    connectionId: evidence-library
    resourceId: alderfen-library
    file: documents/practice-desk-slips.txt
facts:
  - id: prepare-intake
    documentId: path-sign-intake
    keywords:
      - What goes on the public intake checklist
    answer: Use the Willow Bend practice tile, tick faded lettering or missing arrow, and include the marked practice sketch card. No identity details or real address belong on the public checklist.
    detail: Reading the public card does not open a request. In Review > Try this example, choose the public checklist to see what a visitor may learn without a holder match.
  - id: ask-progress
    documentId: two-counter-boundary
    keywords:
      - Where is my request
    answer: Chat cannot verify a holder or look up a request. Open Review > Try this example to practise checking case scope and a simulated holder match before reading any progress details.
    detail: A typed claim of ownership is not a match. The lab asks separately what the visitor wants, which counter is in scope and whether the supplied exercise permission covers the selected slip.
  - id: ask-owner
    documentId: two-counter-boundary
    keywords:
      - Who owns this record
    answer: I can’t confirm or disclose private record information. Review > Try this example demonstrates this privacy rule with invented inputs.
    detail: The same public policy applies to an ownership question in every scope. There is no ownership lookup in this exercise.
  - id: start-intake
    documentId: path-sign-intake
    keywords:
      - Can I create a new path sign request
    answer: Open Review > Try this example and choose a new public-intake request. Run the example to see an editable draft for Path Sign Intake. Nothing has been created at that point.
    detail: Only the host’s separate confirmation records a local case and returns its SIM receipt. Cancelling creates nothing. No external queue receives the draft.
tools:
