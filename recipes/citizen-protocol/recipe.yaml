    type: create-case
    title: Create a local path sign request
    description: Prepare the fictional map tile, sign issue and supplied sketch for review in Path Sign Intake. The host creates a browser-local case only on separate confirmation.
    connectionId: review-queue
    resourceId: team-review
    requiredKnowledge:
      - path-sign-intake
      - two-counter-boundary
    realWorldNote: Only the local confirmation dialog can create a simulated receipt. No live work is routed.
