test:
  suggestedQuestions:
    - What goes on the public intake checklist?
    - Where is my request?
    - Who owns this record?
    - Can I create a new path sign request?
  handoffKeywords: []
  unknownAnswer: This chat gives public guidance only. It cannot establish identity, look up progress or file a request.
  missingKnowledgeAnswer: The selected source for this exercise is unavailable. I can’t supply a case detail or infer an answer from the question.
  handoffBlockedAnswer: The review tool is unavailable. No request was created.
  handoffReadyAnswer: Review the fictional request and confirm it separately. No external action has been performed.
conversations:
  - schemaVersion: 1
    revision: 1
    id: guided-example
    title: Citizen Protocol
    mode: simulated
    starter:
      label: Visit the Path Sign counter
      prompt: Visit the Path Sign counter
    variationPolicy: stable-per-session
    onUnexpectedInput: stay-and-guide
    variables: {}
    steps:
      - id: clarify
        role: assistant
        variants:
          - id: direct
            text: Do you need the public checklist, a progress explanation, the privacy rule, or a new request?
          - id: alternative
            text: Which Path Sign counter question would you like to try with fictional inputs?
      - id: choose-route
        role: user
        choices:
          - id: prepare-intake
            label: What goes on the public intake checklist?
            next: reply-prepare-intake
          - id: ask-progress
            label: Where is my request?
            next: reply-ask-progress
          - id: ask-owner
            label: Who owns this record?
            next: reply-ask-owner
          - id: start-intake
            label: Can I create a new path sign request?
            next: reply-start-intake
      - id: reply-prepare-intake
        role: simulation
        prompt: What goes on the public intake checklist?
        end: true
      - id: reply-ask-progress
        role: simulation
        prompt: Where is my request?
        end: true
      - id: reply-ask-owner
        role: simulation
        prompt: Who owns this record?
        end: true
      - id: reply-start-intake
        role: simulation
        prompt: Can I create a new path sign request?
        end: true
lab:
  title: Which counter can answer?
  description: Select a question and scope. Access is a supplied classroom condition, not a log-in. Paper colours select invented evidence; they are never lookup keys. For a new request, choose a sign issue and whether to prepare the draft. Running never confirms it.
  fields:
    - id: question
      label: Question at the counter
      type: select
      options:
        - value: checklist
          label: What should I bring?
        - value: progress
          label: Where is my request?
        - value: owner
          label: Who owns this record?
        - value: new
          label: Start a new request
      defaultValue: checklist
      hint: An ownership inquiry never becomes a progress or intake request.
    - id: scope
      label: Counter scope
      type: select
      options:
        - value: public
          label: Public intake
        - value: case
          label: Case progress
      defaultValue: public
      hint: Case scope and a matching holder are both needed for a progress answer.
    - id: access
      label: Simulated access
      type: select
      options:
        - value: visitor
          label: Public visitor
        - value: claim
          label: Unverified claim
        - value: other
          label: Verified for a different slip
        - value: matched
          label: Verified holder of the selected slip
      defaultValue: visitor
      hint: A made-up permission supplied by the exercise. Do not enter identity data.
    - id: paper
      label: Practice paper
      type: select
      options:
        - value: ochre
          label: Ochre
        - value: blue
          label: Blue
        - value: green
          label: Green
        - value: unreadable
          label: Unreadable
      defaultValue: ochre
      hint: Selects the evidence for a permitted progress question only.
    - id: issue
      label: "New request: sign issue"
      type: select
      options:
        - value: faded lettering
          label: Faded lettering
        - value: missing arrow
          label: Missing arrow
      defaultValue: faded lettering
      hint: The fixed Willow Bend practice tile and its marked sketch are supplied.
    - id: choice
      label: "New request: draft choice"
      type: select
      options:
        - value: review
          label: Prepare for review
        - value: cancel
          label: Cancel preparation
      defaultValue: review
      hint: Preparing is not confirmation. The host has a separate Cancel or Confirm decision.
  checks:
    - id: ownership
      label: Ownership question
      field: question
      operator: eq
      value: owner
    - id: progress
      label: Progress requested
      field: question
      operator: eq
      value: progress
    - id: case-scope
      label: Case counter selected
      field: scope
      operator: eq
      value: case
    - id: holder-match
      label: Exercise permission matches
      field: access
      operator: eq
      value: matched
    - id: list
      label: Public checklist requested
      field: question
      operator: eq
      value: checklist
    - id: new-intake
      label: New intake requested
      field: question
      operator: eq
      value: new
    - id: cancelled
      label: Draft preparation declined
      field: choice
      operator: eq
      value: cancel
    - id: ochre-paper
      label: Practice paper is ochre
      field: paper
      operator: eq
      value: ochre
    - id: blue-paper
      label: Practice paper is blue
      field: paper
      operator: eq
      value: blue
    - id: green-paper
      label: Practice paper is green
      field: paper
      operator: eq
      value: green
  rules:
    - id: never-identify
      label: Decline an ownership lookup in either scope
      all:
        - checkId: ownership
          equals: true
      outcomeId: no-disclosure
    - id: public-cannot-read
      label: Keep public scope separate from progress
      all:
        - checkId: progress
          equals: true
        - checkId: case-scope
          equals: false
      outcomeId: no-disclosure
    - id: require-binding
      label: Require a match to this exercise slip
      all:
        - checkId: progress
          equals: true
        - checkId: holder-match
          equals: false
      outcomeId: no-disclosure
    - id: give-checklist
      label: Use the public intake card only
      all:
        - checkId: list
          equals: true
      outcomeId: public-checklist
    - id: stop-draft
      label: Stop if preparation is declined
      all:
        - checkId: new-intake
          equals: true
        - checkId: cancelled
          equals: true
      outcomeId: cancelled-intake
    - id: blank-intake
      label: Prepare a new public-intake draft
      all:
        - checkId: new-intake
          equals: true
        - checkId: case-scope
          equals: false
        - checkId: cancelled
          equals: false
      outcomeId: draft-intake
    - id: separate-counters
      label: Do not turn a case view into a new filing
      all:
        - checkId: new-intake
          equals: true
        - checkId: case-scope
          equals: true
      outcomeId: public-start
    - id: read-ochre
      label: Read the permitted ochre slip
      all:
        - checkId: progress
          equals: true
        - checkId: case-scope
          equals: true
        - checkId: holder-match
          equals: true
        - checkId: ochre-paper
          equals: true
      outcomeId: waiting-authority
    - id: read-blue
      label: Read the permitted blue slip
      all:
        - checkId: progress
          equals: true
        - checkId: case-scope
          equals: true
        - checkId: holder-match
          equals: true
        - checkId: blue-paper
          equals: true
      outcomeId: missing-sketch
    - id: read-green
      label: Read the permitted green slip
      all:
        - checkId: progress
          equals: true
        - checkId: case-scope
          equals: true
        - checkId: holder-match
          equals: true
        - checkId: green-paper
          equals: true
      outcomeId: complete
    - id: no-readable-slip
      label: Withhold details without readable evidence
      all: []
      outcomeId: no-reading
  outcomes:
    - id: public-checklist
      title: "Public scope: intake checklist"
      summary: Use the Willow Bend practice tile, select the sign issue (faded lettering or missing arrow), and include the marked sketch card. Leave names and real locations off the card. Reading the checklist does not create a request.
      documentIds:
        - path-sign-intake
    - id: no-disclosure
      title: Private inquiry
      summary: I can’t confirm or disclose private record information.
      documentIds:
        - two-counter-boundary
    - id: waiting-authority
      title: "Case scope: waiting for authority review"
      summary: The request is at the Map Authority desk. The marked sketch is already attached. Day 8 is the authority’s review checkpoint, not a promised repair date. The holder need not send anything; check again after the checkpoint if still waiting.
      documentIds:
        - practice-desk-slips
        - two-counter-boundary
    - id: missing-sketch
      title: "Case scope: waiting for a document"
      summary: The request is at the Intake desk. The holder needs to add the missing marked sketch card by day 6. Intake can then route the packet; no authority review date has been set.
      documentIds:
        - practice-desk-slips
        - two-counter-boundary
    - id: complete
      title: "Case scope: complete"
      summary: The reply reached the Reply shelf on day 5. No deadline or required next action remains. The holder may read the reply; this is not confirmation of a repair.
      documentIds:
        - practice-desk-slips
        - two-counter-boundary
    - id: no-reading
      title: The exercise slip is unreadable
      summary: No stage, due point or next action can be read from the supplied paper. Do not borrow the details of another example.
      documentIds:
        - practice-desk-slips
        - two-counter-boundary
    - id: public-start
      title: Create from the public counter
      summary: A new intake starts on a blank public form, not from a case view. No case data was copied and no draft was prepared.
      documentIds:
        - two-counter-boundary
    - id: cancelled-intake
      title: Draft preparation cancelled
      summary: No draft, action or receipt. Cancelling in the separate confirmation dialog also leaves the request uncreated.
      documentIds:
        - path-sign-intake
    - id: draft-intake
      title: "New public intake: draft, not a receipt"
      summary: Check the tile, sign issue, sketch and destination. If the create tool is available, open the review dialog. Cancel to stop, or confirm the corrected summary to receive the host-generated local SIM receipt.
      documentIds:
        - path-sign-intake
        - two-counter-boundary
      toolId: create-path-sign-request
      draft:
        title: Review the new path sign request
        body: |-
          Destination: Path Sign Intake
          Practice map tile: Willow Bend
          Sign issue: {{issue}}
          Enclosure: marked practice sketch card (supplied)
          Requested work: inspect the sign symbol on the practice map.
  cases:
    - id: public-card
      title: Read the public checklist
      inputs:
        question: checklist
        scope: public
        access: visitor
        paper: ochre
        issue: faded lettering
        choice: review
      expected:
        outcomeId: public-checklist
        documentIds:
          - path-sign-intake
        kind: answer
        contains:
          - marked sketch card
          - does not create a request
    - id: authority-turn
      title: Read the holder’s authority checkpoint
      inputs:
        question: progress
        scope: case
        access: matched
        paper: ochre
        issue: faded lettering
        choice: review
      expected:
        outcomeId: waiting-authority
        documentIds:
          - practice-desk-slips
          - two-counter-boundary
        kind: answer
        contains:
          - Map Authority desk
          - Day 8
          - need not send anything
    - id: holder-turn
      title: Find what the holder must supply
      inputs:
        question: progress
        scope: case
        access: matched
        paper: blue
        issue: faded lettering
        choice: review
      expected:
        outcomeId: missing-sketch
        documentIds:
          - practice-desk-slips
          - two-counter-boundary
        kind: answer
        contains:
          - Intake desk
          - missing marked sketch card by day 6
    - id: finished-slip
      title: Distinguish completion from a new deadline
      inputs:
        question: progress
        scope: case
        access: matched
        paper: green
        issue: faded lettering
        choice: review
      expected:
        outcomeId: complete
        documentIds:
          - practice-desk-slips
          - two-counter-boundary
        kind: answer
        contains:
          - Reply shelf on day 5
          - No deadline or required next action
    - id: public-owner
      title: Decline a visitor’s ownership question
      inputs:
        question: owner
        scope: public
        access: visitor
        paper: unreadable
        issue: faded lettering
        choice: review
      expected:
        outcomeId: no-disclosure
        documentIds:
          - two-counter-boundary
        kind: answer
        contains:
          - I can’t confirm or disclose private record information.
    - id: matched-owner
      title: Decline the same question from a matched holder
      inputs:
        question: owner
        scope: case
        access: matched
        paper: blue
        issue: faded lettering
        choice: review
      expected:
        outcomeId: no-disclosure
        documentIds:
          - two-counter-boundary
        kind: answer
        contains:
          - I can’t confirm or disclose private record information.
    - id: wrong-scope
      title: A matching holder is still at the public counter
      inputs:
        question: progress
        scope: public
        access: matched
