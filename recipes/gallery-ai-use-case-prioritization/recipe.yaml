implementation:
  - title: Derivation and coverage
    description: The gallery documents AI Use Case Prioritization Agent by Alicja Gilderdale (1.0.0.2). Its ZIP requests guided or provisional assessment, grounded classification and scoring, final QA, a confirmed two-table save and a report in chat. This original exercise uses only the ideas of evidence gaps, four assessment dimensions and confirmation. It does not run those skills, score the full rubric or inherit any upstream approval. See SOURCE.txt for the inspected paths and digest.
  - title: What runs here
    description: Three fictional texts ground predefined chat answers. The lab checks five bounded inputs to recommend the next step for one proposal. Guided replies invoke the current chat rules; they do not run the lab. The local tray uses a simulated create-case tool, not a Dataverse connector. An unavailable tool blocks the action even if draft text is visible. Only separate host confirmation can create a browser-local case; declining leaves none.
  - title: What a real team would need
    description: The no-app sample needs a Power Platform environment with Copilot Studio orchestration and Dataverse custom tables, an enabled Dataverse MCP server and an invoker-context connection. Verify the approved rubric, taxonomy, intake guidance and report template are actually available. The gallery lists four knowledge sources; the ZIP names the intake quality rubric but has no standalone payload by that name.
  - title: Before considering real use
    description: A tenant owner must review licensing, Entra group access, own-record versus intake/admin roles and data loss prevention for the connector and knowledge location. The gallery directs teams to set moderation to High, disable code interpreter and smoke-test the deployment. Those are upstream prerequisites and checks, not activities performed here. There is no file extraction, live model, HTML output, reviewer app or external routing in this draft.
