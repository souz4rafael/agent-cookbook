knowledge:
  - id: visit-editing-guide
    title: Checklist change and evidence-link guide
    summary: Survey Lead | revision note C4 | issued 3 June 2026 for Alderfen civic-room revisits.
    connectionId: evidence-library
    resourceId: alderfen-library
    file: documents/visit-editing-guide.txt
  - id: paired-survey-sheet
    title: Indexed survey packet
    summary: "Paired packet PS-4 r2 | Weir Reading Room | 27 May 2026 C3 survey, signed by the Field Surveyor. Assigned revisit: 10 June 2026."
    connectionId: evidence-library
    resourceId: alderfen-library
    file: documents/paired-survey-sheet.txt
  - id: unlinked-survey-sheet
    title: Survey packet with a loose reading
    summary: Independent incomplete packet PS-4 r1 | Weir Reading Room | 27 May 2026 C3 survey.
    connectionId: evidence-library
    resourceId: alderfen-library
    file: documents/unlinked-survey-sheet.txt
facts:
  - id: pair-evidence
    documentId: visit-editing-guide
    keywords:
      - How should photos and readings be linked to a finding
    answer: Use one row per finding. Attach its human-indexed photo reference and its measurement reference, unit and collection point. Mark a missing link explicitly.
    detail: Do not assign an unattached reading to the nearest row or interpret the photo. Ask the Survey Records Clerk to check the original field sheet.
  - id: revise-sheet
    documentId: visit-editing-guide
    keywords:
      - What belongs in a checklist revision before a revisit
    answer: Name the old and issued editions, state which prompt changes, and leave space for a fresh observation at each measurement point.
    detail: Keep the dated prior reading as context. Do not copy it into a new results column or convert it into a pass or fail decision.
