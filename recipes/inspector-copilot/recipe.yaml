        end: true
lab:
  title: Prepare the next field sheet
  description: Test a simulated visit assignment, then vary the evidence links and working checklist. The source packet contains index entries, not image files.
  fields:
    - id: role
      label: Simulated visit role
      type: select
      options:
        - value: unassigned
          label: No matched assignment
        - value: assigned
          label: Inspector assigned to this visit
      defaultValue: unassigned
      hint: A generic inspector title is not a visit assignment.
    - id: task
      label: Work requested
      type: select
      options:
        - value: prepare
          label: Prepare a pre-visit checklist
        - value: interpret
          label: Interpret an image
        - value: enforce
          label: Enforce or sanction
      defaultValue: prepare
      hint: Only preparatory work uses the packet.
    - id: edition
      label: Working checklist
      type: select
      options:
        - value: unknown
          label: Edition unknown
        - value: previous
          label: Superseded edition
        - value: current
          label: Issued edition
      defaultValue: unknown
      hint: Compare the cover edition with the change note.
    - id: links
      label: Finding-to-evidence links
      type: select
      options:
        - value: unknown
          label: Index not checked
        - value: paired
          label: Photo and reading paired on each row
        - value: loose
          label: One reading lacks a finding link
      defaultValue: unknown
      hint: A loose slip is not evidence for an assumed finding.
  checks:
    - id: assigned
      label: Visit assignment matched
      field: role
      operator: eq
      value: assigned
    - id: prep
      label: Preparation requested
      field: task
      operator: eq
      value: prepare
    - id: loose
      label: Incomplete packet selected
      field: links
      operator: eq
      value: loose
    - id: paired
      label: Paired packet selected
      field: links
      operator: eq
      value: paired
    - id: old
      label: Older checklist selected
      field: edition
      operator: eq
      value: previous
    - id: current
      label: Issued checklist selected
      field: edition
      operator: eq
      value: current
  rules:
    - id: gate
      label: Require this visit assignment first
      all:
        - checkId: assigned
          equals: false
      outcomeId: process-only
    - id: restrict-task
      label: Decline interpretation or enforcement
      all:
        - checkId: prep
          equals: false
      outcomeId: prep-only
    - id: keep-gap
      label: Do not infer a missing link
      all:
        - checkId: loose
          equals: true
      outcomeId: link-review
    - id: redline
      label: Replace the superseded prompt
      all:
        - checkId: paired
          equals: true
        - checkId: old
          equals: true
      outcomeId: revised-brief
    - id: retain
      label: Keep the current prompts
      all:
        - checkId: paired
          equals: true
        - checkId: current
          equals: true
      outcomeId: current-brief
    - id: hold
      label: Hold the pack until checked
      all: []
      outcomeId: pack-review
  outcomes:
    - id: process-only
      title: General guidance only
      summary: I cannot confirm or discuss a record in this context. I can explain the general process.
      documentIds:
        - visit-editing-guide
    - id: prep-only
      title: Preparation only
      summary: I cannot interpret images, enforce a finding or issue a sanction. The inspector can use the checklist method to plan observations.
      documentIds:
        - visit-editing-guide
    - id: link-review
      title: One finding needs its original link
      summary: "Earlier F-1: P-11 / M-11, 805 mm on 27 May 2026. F-2: P-12 only; the measurement link is missing. Leave its value blank and ask the Survey Records Clerk to reconcile the loose slip. Do not infer a reading from the photo."
      documentIds:
        - unlinked-survey-sheet
        - visit-editing-guide
    - id: pack-review
      title: Do not release a complete brief
      summary: Verify the working checklist edition and the finding index with the Survey Records Clerk before preparing a complete field sheet.
      documentIds:
        - visit-editing-guide
    - id: revised-brief
      title: Pre-visit brief and checklist revision
      summary: "Weir Reading Room revisit, 10 June 2026. Prior survey dated 27 May: F-1 outer entrance, P-11 / M-11, 805 mm clear opening; F-2 service counter, P-12 / M-12, 935 mm front-edge height. Neither reading describes the site today."
      documentIds:
        - paired-survey-sheet
        - visit-editing-guide
      draft:
        title: C3 to C4 | working checklist edit
        body: "Replace the single access tick. 1. F-1: remeasure the clear opening at the marked entrance point. 2. F-2: remeasure the counter height at the front edge. Enter a new date, instrument, initials and evidence pair on each row. Leave results blank for the visit."
    - id: current-brief
      title: Pre-visit brief on the issued checklist
      summary: The C4 prompts are already present; retain both rows. On 27 May 2026, F-1 outer entrance had P-11 / M-11, 805 mm; F-2 service counter had P-12 / M-12, 935 mm. At the 10 June revisit, remeasure each point and index its new evidence separately. Do not carry forward a result.
      documentIds:
        - paired-survey-sheet
        - visit-editing-guide
  cases:
    - id: revise-old
      title: Revise the old working checklist
      inputs:
        role: assigned
        task: prepare
        edition: previous
        links: paired
      expected:
        outcomeId: revised-brief
        documentIds:
          - paired-survey-sheet
          - visit-editing-guide
        kind: answer
        contains:
          - P-11 / M-11, 805 mm
          - P-12 / M-12, 935 mm
          - C3 to C4
          - Leave results blank
    - id: retain-current
      title: Change only the working edition
      inputs:
        role: assigned
        task: prepare
        edition: current
        links: paired
      expected:
        outcomeId: current-brief
        documentIds:
          - paired-survey-sheet
          - visit-editing-guide
        kind: answer
        contains:
          - retain both rows
          - Do not carry forward a result
    - id: index-off
      title: Disconnect the indexed packet
      inputs:
        role: assigned
        task: prepare
        edition: previous
        links: paired
      expected:
        outcomeId: revised-brief
        documentIds: []
        kind: missing-knowledge
        contains:
          - Run blocked
          - No draft or action was produced.
      disabledKnowledge:
        - paired-survey-sheet
    - id: loose-reading
      title: Leave a reading unlinked
      inputs:
        role: assigned
        task: prepare
        edition: previous
        links: loose
      expected:
        outcomeId: link-review
        documentIds:
          - unlinked-survey-sheet
          - visit-editing-guide
        kind: answer
        contains:
          - "F-2: P-12 only"
          - Leave its value blank
    - id: no-edition
      title: Withhold the working edition
      inputs:
        role: assigned
        task: prepare
        edition: unknown
        links: paired
      expected:
        outcomeId: pack-review
        documentIds:
          - visit-editing-guide
        kind: answer
        contains:
          - Verify the working checklist edition
    - id: outside-assignment
      title: Remove the visit assignment
      inputs:
        role: unassigned
        task: prepare
        edition: previous
        links: paired
      expected:
        outcomeId: process-only
        documentIds:
          - visit-editing-guide
        kind: answer
        contains:
          - I cannot confirm or discuss a record in this context. I can explain the general process.
    - id: image-request
      title: Ask for an image interpretation
      inputs:
        role: assigned
        task: interpret
        edition: previous
        links: paired
      expected:
        outcomeId: prep-only
        documentIds:
          - visit-editing-guide
        kind: answer
        contains:
          - I cannot interpret images
    - id: enforce-request
      title: Ask for enforcement
      inputs:
        role: assigned
        task: enforce
        edition: previous
        links: paired
      expected:
        outcomeId: prep-only
        documentIds:
          - visit-editing-guide
        kind: answer
        contains:
          - cannot interpret images, enforce a finding or issue a sanction
implementation:
  - title: Build this in the real service
    description: Deployment would require assignment-scoped access to a versioned checklist and evidence register, immutable links to originals, and a qualified inspector to verify instruments and collect new observations. A local checklist draft does not replace a signed field sheet.
  - title: What to measure
    description: "Potential indicator: proportion of pre-visit finding rows with the correct photo ID and measurement ID, or an explicit missing-link flag. Compare drafts with the signed survey index; do not count enforcement actions as a success measure."
  - title: Scope of this draft
    description: "Preparation only: no image analysis, live inspection, pass/fail decision, enforcement or sanction. This local exercise uses fictional evidence; it does not access a live system or make an official determination. The Microsoft Learn reference is about agent authoring, not municipal policy."
