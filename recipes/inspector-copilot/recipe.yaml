conversations:
  - schemaVersion: 1
    revision: 1
    id: guided-example
    title: Inspector Copilot
    mode: simulated
    starter:
      label: Walk me through preparing an inspection checklist.
      prompt: Walk me through preparing an inspection checklist.
    variationPolicy: stable-per-session
    onUnexpectedInput: stay-and-guide
    variables: {}
    steps:
      - id: clarify
        role: assistant
        variants:
          - id: direct
            text: Would you like to check evidence links or revise a working checklist?
          - id: alternative
            text: Would you like to check evidence links or revise a working checklist? Choose the closest example.
      - id: choose-route
        role: user
        choices:
